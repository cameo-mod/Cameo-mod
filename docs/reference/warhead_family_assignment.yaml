# ── PER-WEAPON OVERRIDES ────────────────────────────────────────────────────────────────────
#
# Dictated by the maintainer in the 2026-09-21 review. An override BEATS its group family.
#
# These are the durable half of the review. Group names carry a `_2`/`_3` suffix assigned
# by clustering order, so they SHIFT whenever `compress_warheads.py` is re-run -- and it was
# re-run the same day, when folding the warheads of a weapon together merged 7 groups. A
# weapon name does not shift. Anything the maintainer said about a specific weapon lives
# here rather than in a group row, so a re-compression cannot silently lose it.
#
# `(drop: ...)`  never becomes a warhead -- support, targeting or a support power.
# `(park: ...)`  a real weapon held back until its ladder exists (naval).

overrides:
