# Reference warhead group -> Cameo warhead family.
#
# HAND-AUTHORED, like `peer_armor_map.yaml` and for the same reason: it is a series of JUDGEMENTS
# and every one has to be inspectable and arguable. There is deliberately NO generator for this
# file -- edit it directly. It must never be rebuilt from a name-matching pass:
# REFERENCE_EXTRACTION_PLAN.md R21 records the three separate ways that failed (`BazAP` read as
# Tesla because it contains "zAP"; `ChronoBeam` and `LocomotorBeam` read as Laser, and both are
# mind-control effects with no damage profile at all).
#
# The GROUPS come from `tools/reference/compress_warheads.py`, which keys on measured signals
# only: delivery from the weapon's `Projectile:`, element from its warhead's `DamageTypes:`,
# platform from the actors that actually fire it, and shape from the normalised Versus row.
# The FAMILY on each row is a decision, not a measurement.
#
# status:
#   proposed    Claude's reading, awaiting maintainer review
#   confirmed   the maintainer has reviewed this row
#
# Review page (pre-filled, markable): https://claude.ai/artifact/2b4mMZydFnKiox9XKGB8s3
#
# `profile` is the group's normalised Versus row in `armors` order. `n/a` means the warhead
# CANNOT TARGET that armour's macro class at all (R16) -- neither a zero nor a 100, and excluded
# from every mean.
#
# WARNING: group NAMES are stable only for a given compression run. If `compress_warheads.py`
# changes its key or threshold the names shift, and this file must be RE-REVIEWED rather than
# blindly re-applied. Current run: tau 0.50, four platform bands, one main warhead per weapon,
# zeros treated as absences.

