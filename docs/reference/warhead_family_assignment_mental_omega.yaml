# Reference warhead group -> Cameo warhead family — MENTAL OMEGA.
#
# HAND-AUTHORED, like the Combined Arms file beside it, and for the same reason: every row is a
# JUDGEMENT and every one has to be arguable. R21 forbids rebuilding this from a name-matching
# pass, and R46 measured why — four automatic matchers score ~20% against a 75% ceiling, and name
# evidence alone is right 40% of the time on the 42% of weapons it can even guess at.
#
# HOW THIS PASS WAS MADE, so it can be audited rather than trusted:
#   * Each row's `why` states the reasoning. Decisions were taken once per measured
#     (delivery, element) SIGNATURE — 37 of them across these 165 groups — rather than
#     once per group, because a signature is the thing the measurement actually distinguishes.
#   * 7 groups were opened and read individually and BEAT their signature;
#     those rows say so. They are the support weapons, the repair beams and the chrono effects.
#   * Everything is `status: proposed`. NOTHING here has been reviewed by the maintainer.
#
# ⚠ THE LEVEL IS NOT DECIDED HERE. `band` records which platform fires the weapon; the family is
# the only decision this file makes.
#
# ⚠ Group NAMES are an artefact of one compression run. Record any correction per WEAPON in an
# `overrides:` block, never against a group name — that is what let the Combined Arms review
# survive three regroupings untouched (R41, R45, R48).
#
# Current run: tau 0.20, four platform bands, one main warhead per weapon, zeros as absences,
# element vocabulary per R45, delivery per R48.
