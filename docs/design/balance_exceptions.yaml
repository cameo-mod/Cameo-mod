# balance_exceptions.yaml — which actors the Cost/DPS/HP class formula prices,
# and which it does not.
#
# DESIGN.md §12 prices a unit from its class anchor. Not every actor is a unit.
# This registry is the single answer to "is X in the formula?", so the question
# stops being re-litigated per session.
#
# Every entry needs: in_formula, ruling (who decided and when), and either a
# `method` (what prices it instead) or `manual: true`.
#
# Maintainer rulings recorded 2026-08-29 (this file's seed) are marked
# `ruling: maintainer 2026-08-29`.

_doc: >
  Balance-formula scope. `in_formula: true` means DESIGN.md §12's class formula
  prices the actor and `apply_balance` may write its Cost. `in_formula: false`
  means it does not, and `method` names what governs it instead.

# --------------------------------------------------------------------------- #
# Global laws that apply to everything the formula DOES price
# --------------------------------------------------------------------------- #
grids:
  damage:
    step: 100
    source: tools/balance/formula.py DAMAGE_STEP
    ruling: maintainer, W15
    note: >
      The 2000-step grid plus a FirepowerMultiplier fine-tune is a RETIRED law.
      FirepowerMultiplier is not a pricing knob (W17): apply_balance cannot
      write it and propose_class_rebalance.decompose_dps always solves at
      fp = 1.0.
  cost:
    step: 10
    source: DESIGN.md
    ruling: maintainer 2026-08-29
    note: >
      Every priced Cost is a multiple of 10. The formula's raw output is
      rounded to the nearest 10; ties round up. Not yet enforced in code —
      see the open item at the foot of this file.

# --------------------------------------------------------------------------- #
# In the formula
# --------------------------------------------------------------------------- #
categories:

  combat_units:
    in_formula: true
    method: DESIGN.md §12 class formula against the class anchor
    ruling: maintainer, standing
    note: The default. Anything not listed below is one of these.

  defenses:
    in_formula: true
    method: DESIGN.md §12 class formula
    ruling: maintainer 2026-08-29
    note: >
      Stated as the contrast case when superweapons were excluded:
      "super weapons are neither units nor defenses". Defenses are priced.

  heroes:
    in_formula: true
    method: DESIGN.md §12 class formula — no separate hero track
    ruling: maintainer 2026-08-29
    quote: "Heroes are part of the balance pipeline as they are regular units."
    note: >
      A hero is a unit with hero stats, not a different kind of thing. It sits
      in whatever class its role puts it in (commando, epic_vehicle, ...) and
      is priced from that anchor like any other member.

# --------------------------------------------------------------------------- #
# Out of the formula
# --------------------------------------------------------------------------- #

  superweapons:
    in_formula: false
    method: separate superweapon damage audit (TO BUILD — see open items)
    ruling: maintainer 2026-08-29
    quote: >
      "Super weapons are neither units nor defenses so not part of the balance
      formula. But they should still be part of a separate superweapon damage
      audit."
    scope:
      note: >
        Measured 2026-08-29 across the resolved tree. `Power` (base power
        supply) and `InfiltrateForSupportPower` (a spy-target marker) are NOT
        support powers and are excluded.
      weapon_firing: 40      # these need the damage audit
      traits_weapon_firing:
        - DetonateWeaponPower   # 13
        - AirstrikePower        # 12
        - IonCannonPower        # 10
        - FireArmamentPower     # 3
        - NukePower             # 2
      spawning: 26
      traits_spawning:
        - ParatroopersPower     # 13
        - SpawnActorPower       # 10
        - ProduceActorPower     # 3
      utility: 14
      traits_utility:
        - GrantExternalConditionPower  # 9
        - RA2ChronoshiftPower          # 2
        - GpsPower                     # 1
        - AttackOrderPower             # 1
        - RecallPower                  # 1

  harvesters:
    in_formula: false
    method: docs/design/HARVESTER_BALANCE.md — the six-parameter income model
    tool: tools/balance/harvester_income.py
    ruling: maintainer 2026-08-29
    note: >
      Priced on income per second at two mining distances, not on Cost/DPS/HP.
      Target bands are proposed in HARVESTER_BALANCE.md §5 and are NOT yet
      signed off. 33 harvester actors; measured aggregate spread 4.30x.

  support_units_without_weapons:
    in_formula: false
    manual: true
    ruling: maintainer 2026-08-29
    quote: >
      "Support units like Yuri Clones with no weapon cannot be balanced so they
      need to be manually tuned."
    note: >
      No DPS term means the class formula has nothing to solve. Cost is a
      maintainer decision. Units with a ZERO-damage utility weapon (repair
      beams, targeting lasers, EMP) belong here too — a weapon that deals no
      damage is not a DPS input.

  props_husks_and_debris:
    in_formula: false
    manual: true
    ruling: standing
    note: >
      Husks, `_backup` shells, corpses, craters, cloud and mine actors. Not
      buildable as units even where a `Valued` cost exists; the cost is a
      salvage/repair figure, not a price.

# --------------------------------------------------------------------------- #
# Engine-side floors and ceilings (maintainer 2026-08-29, MEASURED)
# --------------------------------------------------------------------------- #
limits:
  reload_delay:
    floor: 10
    ruling: maintainer 2026-08-29
    quote: "Reload delay lower limit should be at 10 unless there is a good reason for it like the tesla coil"
    measured_2026_08_29:
      live_weapons_below_floor: 121
      of_which_zero_damage: 7
      all_weapons_below_floor: 189
      total_with_reload: 2189
    exempt_families:
      - name: continuous_beam
        why: ReloadDelay IS the damage tick rate, not a reload
        members: [ChronoBeam, IFVChronoBeam, ChronoBeam_elite, AthenaLaser,
                  VoidRayBeam, HeatRayBeam1, HeatRayBeam2, HeatRayBeam3,
                  HeatRayBeam4, RA2DiskDrain, RA2DiskSteal]
      - name: gatling_spinup
        why: >
          the 1/2/3 ladder accelerates on purpose (6/4/2); a floor of 10
          collapses the ladder into a flat weapon
        members: [RA2GattlingMG1, RA2GattlingMG2, RA2GattlingMG3,
                  YuriGatlingCannonMG1, YuriGatlingCannonMG2, YuriGatlingCannonMG3,
                  CabalEliminatorGatling]
      - name: charge_weapons
        why: maintainer named the tesla coil explicitly; AttackTesla owns the cycle (DESIGN.md §6)
        members: [TeslaZap, TeslaZap_EMP, TeslaZapArc_EMP, PrismCharge, RA2Prism,
                  RA2CoilBolt, RA2CoilBolt2, RA2CoilBolt3, IxianCharge_EMP,
                  TSCABALCharge_EMP]
      - name: repair_and_heal
        why: not damage weapons; the delay is a heal tick
        members: [SCVRepair, RavenRepair, TKMMedicHeal, GDIRigDroneRepair,
                  ResonanceDroneRepair]
      - name: targeting_and_debuff
        why: zero damage; cosmetic or condition-granting
        members: [GDIRigDroneTargeting, GDIRigDroneTargetingTower, AthenaVisualLaser,
                  NaxisDonnerschlagTargetVisualLaser, Future_MBT_DebuffLaser,
                  Future_MBT_DebuffLaser_elite, SCSpiderEngage]
    note: >
      Everything NOT in an exempt family is a candidate for the floor — mostly
      chainguns and pistols at 6-9 (ChainGun, Colt45, HueyGun, MachineGunH,
      TSMechMGII, SteelRunnerPistols, ...). Raising those to 10 must be paired
      with a Damage rise through the pipeline or it is a straight DPS nerf.

  movement_speed:
    floor: 50
    applies_to: ground movers (Mobile); Aircraft are not on the ground pathfinder
    ruling: maintainer 2026-08-29
    quote: "pathfinding safe speed anything above 50 I would say"
    measured_2026_08_29:
      buildable_movers: 975
      below_floor: 118
      of_those_aircraft: 18
      of_those_props: 6      # 5x cabal *_backup at 0, sc_zerg_larva at 1
      genuine_slow_ground_units: 94
      median_speed: 75
    note: >
      Read as a FLOOR, not a ceiling. It is consistent with the class anchors:
      `docs/balance/class_anchors.json` has speed0 spanning 50..200 with a
      minimum of EXACTLY 50 (dreadnought, heavy_infantry, mortar,
      special_forces, support), so the anchor table already encodes it.
      The 94 genuine sub-50 units are slow BY DESIGN — Kirov 30, Battlecruiser
      30, Sturmtiger 30, Ratte 35, Devastator 31, Chrono Legionnaire 35 — plus
      a band of infantry at 40-49. Deciding whether the floor overrides that
      design intent is an open question, not a cleanup.

  projectile_speed:
    ruling: maintainer 2026-08-29, approximate
    quote: "The slowest projectiles might be artillery with speed of 200. The fastest ones are snipers or other fast bullets"
    measured_2026_08_29:
      live_weapons_with_speed: 1096
      slowest: 111            # FireballLauncherBuggy, BlackHandFlamer (flame, not artillery)
      by_projectile_type:
        Bullet:     {n: 643, min: 111, median: 737, max: 10000}
        Missile:    {n: 368, min: 150, median: 500,  max: 7500}
        LaserZap:   {n: 40,  min: 150, median: 500,  max: 10000}
        InstantHit: {n: 12,  min: 500, median: 3500, max: 4000}
    note: >
      The ~200 floor is roughly right for artillery; the true minimum of 111
      belongs to flame weapons, which are short-range by design.

  instant_hit_conversion:
    ruling: maintainer 2026-08-29
    quote: >
      "those should be transformed into the instant hits with fake bullets we
      ported from shattered paradise"
    status: PORT DONE, CONVERSION PARTIAL
    projectile: OpenRA.Mods.Cameo/Projectiles/InstantHitWithFakeBullets.cs
    measured_2026_08_29:
      snipers_on_instant_hit: 6    # LightSniper, NaxiSniper, NaxiSniper_elite,
                                   # TSSniper, VanSniper, td_gdi_commando_sniper
      snipers_still_on_bullet: 15  # at Speed 2500-10000
      inconsistent_family: >
        td_gdi_commando_sniper is InstantHitWithFakeBullets but its _elite
        variant is Bullet at 10000 — the same weapon family split across two
        projectile types.
    note: See docs/design/SPREAD_FALLOFF_PLAN.md for the projectile-template mapping.

# --------------------------------------------------------------------------- #
# Open items this registry raises
# --------------------------------------------------------------------------- #
open_items:
  - id: X1
    what: No superweapon damage audit exists.
    detail: >
      tools/audit/ has no superweapon check. 40 weapon-firing power instances
      are unaudited. The maintainer asked for one on 2026-08-29.
  - id: X2
    what: The cost grid (multiples of 10) is not enforced in code.
    detail: >
      formula.py has DAMAGE_STEP but no COST_STEP, and no audit reports a Cost
      that is not a multiple of 10.
  - id: X3
    what: The movement-speed floor conflicts with deliberate slow units.
    detail: >
      94 buildable ground units sit below 50 by design. The floor cannot be
      applied as a sweep; it needs a per-unit exemption list or a lower value.
  - id: X4
    what: HarvesterBalancer pays +38% for mining CLOSE.
    detail: >
      It widens the short/long income gap rather than closing it. Uniform
      across all 33 harvesters, inherited from CA's 5-cell default.
