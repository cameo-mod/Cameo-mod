# balance_exceptions.yaml — which actors the Cost/DPS/HP class formula prices,
# and which it does not.
#
# DESIGN.md §12 prices a unit from its class anchor. Not every actor is a unit.
# This registry is the single answer to "is X in the formula?", so the question
# stops being re-litigated per session.
#
# Every entry needs: in_formula, ruling (who decided and when), and either a
# `method` (what prices it instead) or `manual: true`.
#
# Maintainer rulings recorded 2026-08-29 (this file's seed) are marked
# `ruling: maintainer 2026-08-29`.

_doc: >
  Balance-formula scope. `in_formula: true` means DESIGN.md §12's class formula
  prices the actor and `apply_balance` may write its Cost. `in_formula: false`
  means it does not, and `method` names what governs it instead.

# --------------------------------------------------------------------------- #
# Global laws that apply to everything the formula DOES price
# --------------------------------------------------------------------------- #
grids:
  damage:
    step: 100
    source: tools/balance/formula.py DAMAGE_STEP
    ruling: maintainer, W15
    note: >
      The 2000-step grid plus a FirepowerMultiplier fine-tune is a RETIRED law.
      FirepowerMultiplier is not a pricing knob (W17): apply_balance cannot
      write it and propose_class_rebalance.decompose_dps always solves at
      fp = 1.0.
  cost:
    step: 10
    source: DESIGN.md
    ruling: maintainer 2026-08-29
    note: >
      Every priced Cost is a multiple of 10. The formula's raw output is
      rounded to the nearest 10; ties round up. Not yet enforced in code —
      see the open item at the foot of this file.

# --------------------------------------------------------------------------- #
# In the formula
# --------------------------------------------------------------------------- #
categories:

  combat_units:
    in_formula: true
    method: DESIGN.md §12 class formula against the class anchor
    ruling: maintainer, standing
    note: The default. Anything not listed below is one of these.

  defenses:
    in_formula: true
    method: DESIGN.md §12 class formula
    ruling: maintainer 2026-08-29
    note: >
      Stated as the contrast case when superweapons were excluded:
      "super weapons are neither units nor defenses". Defenses are priced.

  heroes:
    in_formula: true
    method: DESIGN.md §12 class formula — no separate hero track
    ruling: maintainer 2026-08-29
    quote: "Heroes are part of the balance pipeline as they are regular units."
    note: >
      A hero is a unit with hero stats, not a different kind of thing. It sits
      in whatever class its role puts it in (commando, epic_vehicle, ...) and
      is priced from that anchor like any other member.

# --------------------------------------------------------------------------- #
# Out of the formula
# --------------------------------------------------------------------------- #

  superweapons:
    in_formula: false
    method: separate superweapon damage audit (TO BUILD — see open items)
    ruling: maintainer 2026-08-29
    quote: >
      "Super weapons are neither units nor defenses so not part of the balance
      formula. But they should still be part of a separate superweapon damage
      audit."
    scope:
      note: >
        Measured 2026-08-29 across the resolved tree. `Power` (base power
        supply) and `InfiltrateForSupportPower` (a spy-target marker) are NOT
        support powers and are excluded.
      weapon_firing: 40      # these need the damage audit
      traits_weapon_firing:
        - DetonateWeaponPower   # 13
        - AirstrikePower        # 12
        - IonCannonPower        # 10
        - FireArmamentPower     # 3
        - NukePower             # 2
      spawning: 26
      traits_spawning:
        - ParatroopersPower     # 13
        - SpawnActorPower       # 10
        - ProduceActorPower     # 3
      utility: 14
      traits_utility:
        - GrantExternalConditionPower  # 9
        - RA2ChronoshiftPower          # 2
        - GpsPower                     # 1
        - AttackOrderPower             # 1
        - RecallPower                  # 1

  harvesters:
    in_formula: false
    method: docs/design/HARVESTER_BALANCE.md — the six-parameter income model
    tool: tools/balance/harvester_income.py
    ruling: maintainer 2026-08-29
    note: >
      Priced on income per second at two mining distances, not on Cost/DPS/HP.
      Target bands are proposed in HARVESTER_BALANCE.md §5 and are NOT yet
      signed off. 33 harvester actors; measured aggregate spread 4.30x.

  support_units_without_weapons:
    in_formula: false
    manual: true
    ruling: maintainer 2026-08-29
    quote: >
      "Support units like Yuri Clones with no weapon cannot be balanced so they
      need to be manually tuned."
    note: >
      No DPS term means the class formula has nothing to solve. Cost is a
      maintainer decision. Units with a ZERO-damage utility weapon (repair
      beams, targeting lasers, EMP) belong here too — a weapon that deals no
      damage is not a DPS input.

  props_husks_and_debris:
    in_formula: false
    manual: true
    ruling: standing
    note: >
      Husks, `_backup` shells, corpses, craters, cloud and mine actors. Not
      buildable as units even where a `Valued` cost exists; the cost is a
      salvage/repair figure, not a price.

# --------------------------------------------------------------------------- #
# PER-ACTOR quarantines (2026-08-31) — single actors that distort a whole class
# --------------------------------------------------------------------------- #
# ⛔ THESE ARE NOT "UNITS WE DISLIKE". Each one was found by a MEASUREMENT that
# named it: `band_granularity.py` reports the outlier queue and the log-price
# skew per class, and the three classes it flagged as non-bell-shaped were
# exactly the three carrying a distortion listed here.
#
# ⭐ AND THE ENTRIES ARE LIVE, NOT DECORATIVE. Before this section the registry's
# `categories:` block was read by NOTHING — only `limits:` had a consumer
# (`audit_engine_constraints.py`). A quarantine that no tool reads is the
# "dead knob" antipattern `formula.py` already documents about
# `VEHICLE_TYPE_CLASSES`: it answers "is this handled?" with a lie. So
# `tools/balance/exceptions.py` now reads this section and
# `band_granularity.py` honours it. ⚠ `apply_balance` does NOT yet consult it —
# wiring the WRITER is a separate change and needs a maintainer order.
actors:

  futuretech_athenacannon:
    in_formula: false
    manual: true
    ruling: proposed 2026-08-31 by measurement — awaiting maintainer confirmation
    method: hold out of class pricing until the DPS is triaged
    measured_2026_08_31:
      dps: 193600
      next_highest_in_artillery: 7920
      ratio_to_class_median: 133.24
      artillery_raw_spread_with_it: 324.5
      artillery_trimmed_spread_P10_P90: 5.9
      artillery_log_price_skew: 2.43
      artillery_log_price_excess_kurtosis: 7.55
    note: >
      ⛔ THIS IS A STAT ERROR, NOT A HEAVY UNIT. 193,600 DPS is 24x the next
      artillery in the class and 133x the class median; it alone turns a 5.9x
      class into a 324.5x one and is the entire reason `artillery` reads as
      non-bell-shaped. An Athena Cannon is a targeting beacon — the likely cause
      is an airstrike warhead being attributed to the spotter. Quarantined so it
      cannot corrupt the class, NOT priced as an epic. Fix the data, then remove
      this entry.

  ra2_ifv_family:
    in_formula: false
    manual: true
    ruling: proposed 2026-08-31 — RTS_BALANCE_REFERENCE §7 already rules this class of unit
    method: needs a chassis + payload model, not a single-weapon price
    members:
      - ra2_allies_ifv
      - ra2_allies_ifv_chrono
      - ra2_allies_ifv_hmg
      - ra2_allies_ifv_mg
      - ra2_allies_ifv_missile
      - ra2_allies_ifv_repair
      - futuretech_salamanderifv
    measured_2026_08_31:
      dps_all_seven_identical: 19211.7
      ratio_to_scout_vehicle_median: 5.89
      futuretech_salamanderifv_ratio: 7.92
      scout_vehicle_trimmed_spread: 11.7
      scout_vehicle_log_price_skew: 0.62
    note: >
      A TRANSFORMING unit priced from ONE variant's weapon bolted onto the
      chassis — all seven actors carry the identical 19,211.7 DPS, which is the
      missile variant's gun. `RTS_BALANCE_REFERENCE` §7 already rules that
      transforming units need their own model ("a state machine with transition
      cost, not two units"), so this is not a new decision, it is that ruling
      applied. ⚠ Quarantine is a HOLDING action: the family still needs a real
      chassis+payload pricing method before it can re-enter the formula.

# --------------------------------------------------------------------------- #
# Engine-side floors and ceilings (maintainer 2026-08-29, MEASURED)
# --------------------------------------------------------------------------- #
limits:
  reload_delay:
    floor: 10
    applies_to: standard projectile, missile and bullet weapons
    ruling: maintainer 2026-08-29 (RULED)
    quote: "Reload delay lower limit should be at 10 unless there is a good reason for it like the tesla coil"
    why: >
      CPU, not balance. Hundreds of standard bullets firing every 3 frames is
      tick exhaustion. That is why the exemptions below are by MECHANISM and
      not by taste: a continuous beam ticking at 1 is one actor, a hundred
      chainguns ticking at 6 is the load problem.
    fix_method: >
      PAIRED, through the pipeline. A 6-tick reload becomes 12 with damage
      doubled — DPS preserved, tick load halved. Raising reload alone is a
      straight DPS nerf and is not what was ruled.
    tool: tools/audit/audit_engine_constraints.py E2
    measured_2026_08_29:
      live_weapons_below_floor: 121
      of_which_zero_damage: 7
      all_weapons_below_floor: 189
      total_with_reload: 2189
    exempt_families:
      - name: continuous_beam
        why: ReloadDelay IS the damage tick rate, not a reload
        members: [ChronoBeam, IFVChronoBeam, ChronoBeam_elite, AthenaLaser,
                  VoidRayBeam, HeatRayBeam1, HeatRayBeam2, HeatRayBeam3,
                  HeatRayBeam4, RA2DiskDrain, RA2DiskSteal]
      - name: gatling_spinup
        why: >
          the 1/2/3 ladder accelerates on purpose (6/4/2); a floor of 10
          collapses the ladder into a flat weapon
        members: [RA2GattlingMG1, RA2GattlingMG2, RA2GattlingMG3,
                  YuriGatlingCannonMG1, YuriGatlingCannonMG2, YuriGatlingCannonMG3,
                  CabalEliminatorGatling]
      - name: charge_weapons
        why: maintainer named the tesla coil explicitly; AttackTesla owns the cycle (DESIGN.md §6)
        members: [TeslaZap, TeslaZap_EMP, TeslaZapArc_EMP, PrismCharge, RA2Prism,
                  RA2CoilBolt, RA2CoilBolt2, RA2CoilBolt3, IxianCharge_EMP,
                  TSCABALCharge_EMP,
                  # The OP variants are the same coil weapon; the infixed "OP"
                  # is not a suffix, so stem matching cannot reach them.
                  RA2OPCoilBolt1, RA2OPCoilBolt2, RA2OPCoilBolt3]
      - name: repair_and_heal
        why: not damage weapons; the delay is a heal tick
        members: [SCVRepair, RavenRepair, TKMMedicHeal, GDIRigDroneRepair,
                  ResonanceDroneRepair]
      - name: targeting_and_debuff
        why: zero damage; cosmetic or condition-granting
        members: [GDIRigDroneTargeting, GDIRigDroneTargetingTower, AthenaVisualLaser,
                  NaxisDonnerschlagTargetVisualLaser, Future_MBT_DebuffLaser,
                  Future_MBT_DebuffLaser_elite, SCSpiderEngage]
    note: >
      Everything NOT in an exempt family is a GENUINE VIOLATION (maintainer
      2026-08-29) — mostly chainguns and pistols at 6-9 (ChainGun, Colt45,
      HueyGun, MachineGunH, TSMechMGII, SteelRunnerPistols, ...). They are
      reported now and scaled during the weapon balance phase, not before:
      the paired damage change has to go through `apply_balance`.

  movement_speed:
    floor: 30
    applies_to: buildable ground movers (Mobile)
    ruling: maintainer 2026-08-29 (RULED — supersedes the earlier 50 reading)
    quote: >
      "The absolute engine floor for ground movers is 30. ... The 44-49 infantry
      band is acceptable."
    why: pathfinding safety
    exempt:
      - Aircraft — no ground pathfinder
      - structures
      - actors deliberately stationary at Speed 0 (classify each; an accidental
        0 is not exempt)
    not_the_anchor_minimum: >
      ⚠ 50 is the CLASS ANCHOR minimum (`docs/balance/class_anchors.json`
      speed0 spans 50..200), NOT the engine floor. They are different concepts
      and conflating them illegally flags the super-heavy class: Sturmtiger 30,
      Devastator 31, Ratte 35, Yamato 35 are heavy BY DESIGN. A floor of 50
      would have flagged 100 of 807 buildable ground movers; a floor of 30
      flags 7.
    measured_2026_08_29:
      buildable_ground_movers: 807
      below_50: 100
      below_40: 20
      below_35: 12
      below_30: 7
      of_those_7:
        non_units: 6        # 5x cabal_*_backup at Speed 0, sc_zerg_larva at 1
        genuine: 1          # cabal_avatar at 25
    tool: tools/audit/audit_engine_constraints.py E1

  projectile_speed:
    ruling: maintainer 2026-08-29, approximate
    quote: "The slowest projectiles might be artillery with speed of 200. The fastest ones are snipers or other fast bullets"
    measured_2026_08_29:
      live_weapons_with_speed: 1096
      slowest: 111            # FireballLauncherBuggy, BlackHandFlamer (flame, not artillery)
      by_projectile_type:
        Bullet:     {n: 643, min: 111, median: 737, max: 10000}
        Missile:    {n: 368, min: 150, median: 500,  max: 7500}
        LaserZap:   {n: 40,  min: 150, median: 500,  max: 10000}
        InstantHit: {n: 12,  min: 500, median: 3500, max: 4000}
    note: >
      The ~200 floor is roughly right for artillery; the true minimum of 111
      belongs to flame weapons, which are short-range by design.

  instant_hit_conversion:
    rule: every sniper weapon must use InstantHitWithFakeBullets
    ruling: maintainer 2026-08-29 (RULED)
    quote: >
      "All sniper weapons must use InstantHitWithFakeBullets. ... The 15 weapons
      still using Bullet at 2500-10000 speed should be flagged by the constraint
      reporter as deprecated patterns."
    status: PORT DONE, CONVERSION PARTIAL
    tool: tools/audit/audit_engine_constraints.py E3
    projectile: OpenRA.Mods.Cameo/Projectiles/InstantHitWithFakeBullets.cs
    measured_2026_08_29:
      snipers_on_instant_hit: 6    # LightSniper, NaxiSniper, NaxiSniper_elite,
                                   # TSSniper, VanSniper, td_gdi_commando_sniper
      snipers_still_on_bullet: 15  # at Speed 2500-10000
      inconsistent_family: >
        td_gdi_commando_sniper is InstantHitWithFakeBullets but its _elite
        variant is Bullet at 10000 — the same weapon family split across two
        projectile types.
    note: See docs/design/SPREAD_FALLOFF_PLAN.md for the projectile-template mapping.

# --------------------------------------------------------------------------- #
# Open items this registry raises
# --------------------------------------------------------------------------- #
open_items:
  - id: X1
    what: No superweapon damage audit exists.
    detail: >
      tools/audit/ has no superweapon check. 40 weapon-firing power instances
      are unaudited. The maintainer asked for one on 2026-08-29.
  - id: X2
    what: The cost grid (multiples of 10) is not enforced in code.
    detail: >
      formula.py has DAMAGE_STEP but no COST_STEP, and no audit reports a Cost
      that is not a multiple of 10.
  - id: X3
    what: RESOLVED 2026-08-29 — the movement-speed floor is 30, not 50.
    detail: >
      50 is the class-anchor minimum, not the engine floor. At 30 the
      heavy-by-design band is legal and only 7 buildable ground movers are
      flagged, 6 of them non-units. See limits.movement_speed.
  - id: X4
    what: HarvesterBalancer pays +38% for mining CLOSE.
    detail: >
      It widens the short/long income gap rather than closing it. Uniform
      across all 33 harvesters, inherited from CA's 5-cell default.
  - id: X5
    what: Ion Cannon damage is un-normalized across factions.
    ruling: maintainer 2026-08-29
    quote: >
      "A 259k to 452k damage spread for the same charge time is an
      un-normalized balance defect. We will not fix this today, but log it.
      Superweapon damage normalization will get its own dedicated pass after
      W27."
    measured_2026_08_29:
      td_gdi_TDIonCannon: 452075
      steelconsortium_and_protoss_SteelIonCannon: 452075
      ts_gdi_TSIonCannon: 271072
      asianalliance_AsianTSIonCannon: 259068
      charge_interval: 6000-7500 for all four
    status: DEFERRED to a dedicated pass after W27. Reported by
            tools/audit/audit_support_powers.py S3.
  - id: X6
    what: The class taxonomy has NO aircraft class. 127 buildable aircraft, 0 classifiable.
    detail: >
      `flying_infantry` is infantry that flies (zero members) and
      `anti_air_vehicle` is a ground class (all 13 members in `vehicles`). There
      is no fighter, bomber, gunship or air-transport class, so 127 buildable
      aircraft — 113 of them armed — fall through to the global Tiger formula
      with no class anchor and no declared role. This blocks the air half of
      counter_matrix.yaml: the anti_air_vehicle -> aircraft row cannot be
      measured because the defender has no tagged members.
    measured_2026_08_29:
      buildable_aircraft: 127
      armed: 113
      tagged_with_a_class: 0
      armor_segmentation:
        Helicopter: 65
        Spaceship: 21
        Bomber: 20
        Fighter: 16
        other: 5
    proposal: >
      Four new classes named by the armor that already segments them — gunship
      (Helicopter), heavy_aircraft (Spaceship), bomber (Bomber), interceptor
      (Fighter). No yaml changes; four entries in class_anchors.json plus anchors
      picked from existing aircraft. Do this BEFORE further faction passes: a
      faction pass currently cannot classify its aircraft at all.

