# Garrison-weapon design exceptions — DESIGN.md §12.
# Infantry listed here are ALLOWED to have no `Name: garrisoned` armament;
# audit_garrison_weapons.py skips them. One `- id` per line; the category
# headers are documentation. Decided by design 2026-07-10: melee,
# suicide/bomb attackers, and casters/mind-control do not fire from
# garrisons. Commandos and ranged shooters ALWAYS get a garrison weapon
# (the Ordos Face Dancer is a commando in Cameo — not an exception).

