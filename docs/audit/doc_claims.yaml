  - id: buildable_aircraft_unclassified
    value: 127
    tolerance: 0
    what: >
      Buildable aircraft with no design.class_anchor. The taxonomy has no class
      an aircraft can hold (flying_infantry is infantry, anti_air_vehicle is a
      ground class), so none of them is priced by a class anchor and the air half
      of counter_matrix.yaml cannot be measured. Must fall to 0.
    docs: [docs/HANDOFF.md, docs/design/balance_exceptions.yaml]
    measure: |
      import glob, json, pathlib
      n = 0
      for path in sorted(glob.glob('docs/balance/*.json')):
          if 'class_anchors' in path:
              continue
          try:
              doc = json.loads(pathlib.Path(path).read_text(encoding='utf-8'))
          except (ValueError, OSError):
              continue
          for _a, rec in (doc.get('sections') or {}).get('aircraft', {}).items():
              if not isinstance(rec, dict) or not rec.get('buildable'):
                  continue
              if not (rec.get('design') or {}).get('class_anchor'):
                  n += 1
      print(n)

  - id: bot_insurance_unreachable_difficulties
    value: 0
    tolerance: 0
    what: >
      Bot difficulties that reach NO anti-bankruptcy income at all. The committed
      `DynamicBotInsurance` trait covers every loaded bot type except deliberately uninsured
      `campaign`, so this is now 0. The predecessor ladder had a `normalbot`/`mediumbot` wiring
      hole that left the default medium bot with no income; replacing it on `Player:` removes the
      per-conyard condition ladder entirely. Enforced continuously by
      `tools/audit/audit_bot_insurance.py`.
    docs:
      - docs/HANDOFF.md
      - docs/design/AI_RESEARCH_RECONCILIATION.md
      - docs/design/ROADMAP.md
      - docs/design/BOOT_GATE_RUNBOOK.md
      - docs/LESSONS_LEARNED.md
      - docs/Cameo_Knowledge_Base_Manual.md
      - docs/audit/SUMMARY.md
      - docs/patches/README.md
    measure: |
      import importlib.util, pathlib, sys
      spec = importlib.util.spec_from_file_location(
          'abi', pathlib.Path('tools/audit/audit_bot_insurance.py'))
      abi = importlib.util.module_from_spec(spec)
      sys.modules['abi'] = abi
      spec.loader.exec_module(abi)
      rules = abi.miniyaml.Ruleset('.')
      dyn = abi.dynamic_difficulties(rules)
      if dyn is not None:
          loaded = abi.loaded_bot_types()
          print(len([b for b in loaded
                     if b not in dyn and b not in abi.UNINSURED_BOT_TYPES]))
      else:
          rungs = abi.ladder_rungs(rules)
          print(sum(1 for d in abi.DIFFICULTIES
                    if not any(abi.evaluate(r, abi.conditions_for(d)) for r in rungs)))

