# doc_claims.yaml — every NUMERIC claim the design docs make, and how to re-measure it.
#
# Maintainer 2026-08-17: *"the documentations are starting to explode in size ... regularly
# review everything for discrepancies and contradictions and then make design decisions
# together ... Right now a lot of information and design decisions are maybe outdated and
# contradict newer decisions?"*
#
# The problem is real and it is structural: prose cannot be checked, so a number written into a
# document is true only on the day it is written. This session alone found five:
#
#   * "Shield is free against 51% of the roster"  -> actually 1.4%  (35x wrong)
#   * "Shield = top + floor" stated as law       -> retired weeks earlier, still in 2 docs
#   * "apply_balance --confirm is the last step"  -> it is a NO-OP
#   * R1 "veterancy grants HP"                   -> contradicted by advice I gave and it was accepted
#   * "805 of 2053 weapons comply (39%)"         -> 522 of 1495 FIRED weapons (34.9%)
#
# THE FIX: a claim that matters gets an entry here with a `measure` command. `audit_doc_claims.py`
# runs each one and fails when reality and the document disagree. A doc sentence then becomes
# checkable, and going stale becomes a red audit instead of a future misunderstanding.
#
# RULES
#  * One entry per claim that a DECISION would rest on. Not every number in every doc.
#  * `measure` must print ONE number to stdout and nothing else.
#  * `tolerance` is fractional (0.02 = 2%). Counts that must be exact use 0.
#  * When a claim legitimately changes, update `value` IN THE SAME COMMIT as the doc. That is
#    the whole point: the audit forces doc and reality to move together.
#  * `docs` lists every file repeating the claim — so a change updates ALL of them, which is
#    how the `Shield = top + floor` duplication survived for weeks.

claims:
  - id: macro_contrast_cameo
    value: 1.67
    tolerance: 0.03
    what: >
      Median MACRO CONTRAST (max/min over the INF, VEH and BLD ladder MEANS) across Cameo's
      MAIN warhead profiles. THE NUMBER THE MAINTAINER REJECTED AT "1.7x". ⛔ It is NOT
      §9.4's row spread and must never be quoted as it — that one is max/min over the
      individual ROWS and it passes. Frame: MACRO_LADDERS in audit_versus_profile.py.
      ⭐ 1.63 -> 1.67 on 2026-08-30 when the maintainer ruled the DERIVED `Heroic` cell out of
      both spread metrics (WEAPON_HEAVINESS §9.4a): it sat inside the INF mean where the macro
      axis cannot move it as a rung, damping the metric it is judged on.
    docs: [docs/design/WEAPON_HEAVINESS.md, docs/audit/SUMMARY.md]
    measure: |
      import statistics, sys
      sys.path[:0] = ['tools/audit', 'tools/balance']
      import audit_versus_profile as a
      v = [x for x in (a.macro_contrast(p) for p in a.profiles().values()) if x]
      print(round(statistics.median(v), 4))

  - id: spread_median_families
    value: 3.63
    tolerance: 0.03
    what: >
      Median §9.4 ROW SPREAD across the 44 judged families (one level each, `armor_rows` minus
      DERIVED_ROWS, FLAT_BY_DESIGN and HAND_TUNED skipped). ⛔ PINNED BECAUSE ITS ABSENCE CAUSED
      A REAL ERROR: the audit reported only the OFFENDERS, never a central value, so "4.00x" was
      quoted from memory — sometimes meaning this per-FAMILY figure, sometimes a per-WEAPON one
      over a different population. A law with a target and no published central value invites
      exactly that. Target is 4x, band [2,8]; 3.63 is the SHIPPED state at MACRO_RATIO 1.0.
    docs: [docs/design/WEAPON_HEAVINESS.md, docs/audit/SUMMARY.md]
    measure: |
      import statistics, sys
      sys.path[:0] = ['tools/audit', 'tools/balance']
      import audit_versus_profile as a
      d = a.profiles()
      fams = sorted({f for f, _ in d})
      out = []
      for fam in fams:
          if fam in a.FLAT_BY_DESIGN:
              continue
          lvl = next((l for l in a.LEVELS if (fam, l) in d), None)
          if lvl is None or (fam, lvl) in a.HAND_TUNED:
              continue
          rows = [v for k, v in a.armor_rows(d[(fam, lvl)]).items()
                  if v > 0 and k not in a.DERIVED_ROWS]
          if rows:
              out.append(max(rows) / min(rows))
      print(round(statistics.median(out), 4))

