      anchors = json.loads(
          pathlib.Path('docs/balance/class_anchors.json').read_text(encoding='utf-8'))
      rows = collections.defaultdict(list)
      for _fn, actor, u, du in cb.collect({}):
          cls = (u.get('design') or {}).get('class_anchor')
          if not cls or cls.startswith('_') or cls not in anchors or u.get('build_limit'):
              continue
          if not exc.is_priced(actor):
              continue
          inp = cb.unit_inputs(u, du)
          if inp is None or not all(inp[:4]):
              continue
          rows[cls].append(inp)
      width = cb.SWEET_HI / cb.SWEET_LO
      n = 0
      for cls, rs in rows.items():
          if len(rs) < 4:
              continue
          base = {'hp0': rs[0][0], 'speed0': rs[0][1], 'range0_wdist': rs[0][2],
                  'dps0': rs[0][3], 'cost0': 100.0}
          pr = sorted(x for x in (cb.price_for(cls, {'spec': base}, i, 1.0) for i in rs)
                      if x and x > 0)
          if len(pr) < 2:
              continue
          # TRIMMED P10..P90, identical to band_granularity.py. Raw max/min is a
          # lie on a roster that still has data bugs -- it read 2 here while the
          # tool read 3, purely because `scout_vehicle` is 4.4x raw and 2.3x trimmed.
          lo, hi = int(0.1 * len(pr)), min(len(pr) - 1, int(0.9 * len(pr)))
          if pr[hi] / pr[lo] <= width:
              n += 1
      print(n)

  - id: peer_cost_step
