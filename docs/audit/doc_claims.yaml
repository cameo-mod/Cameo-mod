    what: >
      Median ratio between adjacent DISTINCT costs across the armed mobile units of 14
      shipped OpenRA mods (266 gaps). ⭐ THE COST RESOLUTION A BAND IS MEASURED IN: two
      units priced closer than this are not distinguishable to a player, so a band of
      width W holds ln(W)/ln(1.143) rungs -- 9.2 for the 3.43x target band. It is the
      external, non-preference answer to "how many units fit in a class". Cameo's own
