      all 1016 unarmed buildings and reported a 19x shift in the Shield column's weight.
    docs: [docs/design/BALANCE_PROGRAM_PLAN.md]
    measure: |
      import re, sys, pathlib
      sys.path[:0] = ['tools/audit', 'tools/balance']
      from miniyaml import Ruleset
      TOK = re.compile(r'[A-Za-z_][A-Za-z0-9_.]*')
      def num(v, d=0.0):
          try: return float(str(v).strip())
          except (TypeError, ValueError): return d
      def gated(cond):
          for t in re.split(r'&&|\|\|', str(cond or '')):
              t = t.strip().strip('()').strip()
              if t and not t.startswith('!') and TOK.match(t): return True
          return False
      rs = Ruleset(pathlib.Path('.').resolve()); n = 0
      for name in rs.actors:
          if name.startswith('^'): continue
          node = rs.resolve(name)
          if node is None: continue
          sh = None; is_bld = False; armor = None
