name: Continuous Integration

on:
  push:
  pull_request:
    branches: [ master, bleed, 'prep-*' ]

permissions:
  contents: read  #  to fetch code (actions/checkout)

jobs:
  linux:
    name: Linux (.NET 6.0)
    runs-on: ubuntu-22.04

    steps:
      - name: Clone Repository
        uses: actions/checkout@v4

      - name: Install .NET 6.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Check Mods
        run: |
          sudo apt-get install lua5.1
          make check-scripts
          make TREAT_WARNINGS_AS_ERRORS=false test

  linux-mono:
    name: Linux (mono)
    runs-on: ubuntu-22.04

    steps:
      - name: Clone Repository
        uses: actions/checkout@v4

      - name: Check Mods
        run: |
          # check-scripts does not depend on .net/mono, so is not needed here
          make RUNTIME=mono TREAT_WARNINGS_AS_ERRORS=false test

  windows:
    name: Windows (.NET 6.0)
    runs-on: windows-2022

    steps:
      - name: Clone Repository
        uses: actions/checkout@v4

      - name: Install .NET 6.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Check Mods
        run: |
          choco install lua --version 5.1.5.52
          $ENV:Path = $ENV:Path + ";C:\Program Files (x86)\Lua\5.1\"
          $ENV:TREAT_WARNINGS_AS_ERRORS = "false"
          .\make.ps1 check-scripts
          .\make.ps1 test

  # Cameo-specific: the NUnit suite in OpenRA.Mods.Cameo.Test plus the
  # bot-module line-coverage ratchet (tools/audit/audit_test_coverage.py T4).
  # NOTE: coverlet's collector/msbuild/console drivers all record zero hits in
  # this EngineRootPath layout; dotnet-coverage (CLR profiler) is the working
  # collector — see tools/ai/coverage_report.py.
  cameo-tests:
    name: Cameo NUnit + bot-module coverage
    runs-on: windows-2022

    steps:
      - name: Clone Repository
        uses: actions/checkout@v4

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build engine and mods
        run: .\make.ps1 all
        env:
          TREAT_WARNINGS_AS_ERRORS: 'false'

      - name: Run Cameo NUnit suite
        run: dotnet test OpenRA.Mods.Cameo.Test/OpenRA.Mods.Cameo.Test.csproj -c Release

      - name: Bot-module coverage ratchet
        run: |
          dotnet tool install -g dotnet-coverage
          python tools/ai/coverage_report.py --collect --xml TestResults/coverage.cobertura.xml
          python tools/audit/audit_test_coverage.py --coverage-xml TestResults/coverage.cobertura.xml
