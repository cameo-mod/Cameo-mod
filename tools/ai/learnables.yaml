# Learnability manifest, sourced from the 40-row fleet LEARN_CATALOG_2026-10-06.md.
# Values are offline-fitted, reviewed, and frozen at match start. Ranges state the
# accepted parameter domain; safety_floor records the lower invariant the consumer
# must preserve. "planned" rows have no runtime consumer until their switch is scheduled.
schema_version: 1
catalog: LEARN_CATALOG_2026-10-06.md
learning_mode: offline_reviewed_yaml_frozen_at_match_start
identity_policy: no player, account, client, game, or map identity keys
allowed_scope_keys: faction, matchup, doctrine, temperament, map_feature_vector, squad_type, unit_role, enemy_role, range_band, phase, threat_role, target_class, power_type, starting_temperament, distance_band
learnables:
    predictor_calibration:
        rank: 1
        name: Predictor calibration (seed 1)
        owner: EngagementPriorsBotModule.cs:EngagementPriorsBotModule; CombatVetoBotModule.cs:CombatVetoBotModule
        bounds: min=500,max=2000,safety_floor=500,unit=permille
        feature_schema: E.seen.predicted_trade,E.outcome,E.score,E.truth_offline,map_features,own_role,enemy_role,range_band,phase
        credit_metric: actual_minus_predicted_trade
        method: shrinkage_integer_additive_hinge_regression
        scope_keys: faction,matchup,map_feature_vector,own_role,enemy_role,range_band,phase
        fitter: tools/ai/fit_engagement_priors.py
        sample_floor: 200 effective engagements per model
        switch: AP_tier1_priors
        state: wired
        artifact:
            path: mods/cameo/ai/learned/engagement_priors.yaml
            schema: engagement_priors_v1
            storage_bounds:
                correction_permille: 500..2000
                resolved_versus_percent: 0..2147483647
                evidence_count: 0..2147483647
                timing_ticks: 0..2147483647
                suicide_index: 0..1000
                fit_version: 0..2147483647
                staleness_tau_milli: 1..2147483647
    effective_unit_value:
        rank: 2
        name: Effective unit value by matchup
        owner: BotLearnedPriors.cs:BotLearnedPriors; EngagementPriorsBotModule.cs:EngagementPriorsBotModule
        bounds: min=50,max=150,safety_floor=50,unit=effective_weight_percent
        feature_schema: E.role_losses,E.role_kills,E.score,map_features,own_role,enemy_role,phase
        credit_metric: trade_per_cost_residual_after_predictor_calibration
        method: hierarchical_smooth_regression
        scope_keys: faction,matchup,map_feature_vector,own_role,enemy_role,phase
        fitter: tools/ai/fit_arsenal_priors.py
        sample_floor: 250 effective engagements per model
        switch: unscheduled
        state: wired_currently_enabled_without_increment_switch
        activation_note: ai.yaml sets UseLearnedPriors=true; this registry records the gap but does not change the existing order stream
        artifact:
            path: mods/cameo/ai/learned/arsenal_priors.yaml
            schema: arsenal_priors_v1
            note: Existing TradePercent rows use legacy actor-type keys; the catalog target is role-scoped. Runtime clamps the resulting candidate weight to 50..150 percent.
            storage_bounds:
                visibility_percent: 0..100
                raw_trade_percent: 0..2147483647
