# Behaviour switches of the current increment (AI_MASTER_PLAN §1.2 step 6, amended 2026-10-01).
# Applied to a FROZEN A/B worktree by tools/ai/apply_increment_switches.py — never committed into ai.yaml itself:
# master keeps every behaviour at its default until the increment's A/B says otherwise.
#
# Arms: ctrl = previous master (no switches); all = groups A + B; half = group A only.
# A trait key matches every instance of that trait in mods/cameo/ai/*.yaml (Trait or Trait@name), except the
# instances named in `skip` (classic stays the untouched A/B reference).
# Off on purpose: SiegeEvaluatorBotModule.BehaviourEnabled (lost its A/B, AI_MATCH_LOG ca2b), and the engineer safe
# route v1 alone (lost its smoke) — v2 below replaces it.

skip: [SquadManagerBotModuleCA@classic]

groups:
  # SHIPPED 2026-10-01 as master defaults after the INC-1+2+3 A/B (all 13-3, 81% vs ctrl 12-4, 75%): former groups
  # A_squad_tactics, B_ownership_engineers_missions, C_f1_frans_services (C on every genericbot tier, §19.1).
  # Still OFF on master, for the next increment A/B:
  D_zone_topology:                   # NOVA ZG-a/b/c — zone-backed RegionMemory + zone-adjacency RegionRouter (#711/#713/#718)
    MasterAiBotModule:
      UseZoneTopology: true
  E_engt_transport:                  # re-arm the Frans transport provider ONLY after #716 (orders-only, DESIGN §19.8) lands
    GrantConditionOnBotOwner@engttransport:
      Bots: easiest, veryeasy, easy, medium, hard, veryhard, brutal, challenger, unbeatable, cameogod, exploit_rush, exploit_turtle, exploit_guerrilla
  H_influence_layers:                # NOVA IM-1 — BotInfluenceLayers on the situation snapshot + scout consumption
    MasterAiBotModule:
      UseInfluenceLayers: true
  G_personality_leads:               # NOVA PL-1 — Steamroller/Rush leads lean their budget drivers while trailing (§12.14)
    MasterAiBotModule:
      UsePersonalityLeads: true
  I_derived_unit_weights:            # NOVA UW-1 — derive UnitsToBuild weights from RoleMix x Versus strength (§2.8b item 3)
    UnitBuilderBotModuleCA:
      UseDerivedUnitWeights: true
  J_rolemix_production:              # NOVA CA-3 (§12.5) — the six personalities' starting RoleMixes fill production deficits (classic carries none)
    SquadManagerBotModuleCA@rush:
      UseRoleMix: true
    SquadManagerBotModuleCA@turtle:
      UseRoleMix: true
    SquadManagerBotModuleCA@tech:
      UseRoleMix: true
    SquadManagerBotModuleCA@expansion:
      UseRoleMix: true
    SquadManagerBotModuleCA@steamroller:
      UseRoleMix: true
    SquadManagerBotModuleCA@guerrilla:
      UseRoleMix: true
  # UT-1 (AI_DEEP_RESEARCH §5.1): the squad manager's attack-delay reset scales by the
  # master's Turtle<->Rush utility axis. Explicit @-keys arm the six genericbot
  # personality instances only; @classic (the A/B control) is skipped above and never
  # listed. K and L stay reserved for DAWN.
  M_utility_axes:
    SquadManagerBotModuleCA@rush:
      UseUtilityAxes: true
    SquadManagerBotModuleCA@turtle:
      UseUtilityAxes: true
    SquadManagerBotModuleCA@tech:
      UseUtilityAxes: true
    SquadManagerBotModuleCA@expansion:
      UseUtilityAxes: true
    SquadManagerBotModuleCA@steamroller:
      UseUtilityAxes: true
    SquadManagerBotModuleCA@guerrilla:
      UseUtilityAxes: true
  K_cn2_unit_repair:                 # DAWN CN2 - UnitRepairBotModule (CN port): depots/repair-near/mobile repairers for damaged units
    GrantConditionOnBotOwner@cn2unitrepair:
      Bots: easiest, veryeasy, easy, medium, hard, veryhard, brutal, challenger, unbeatable, cameogod, exploit_rush, exploit_turtle, exploit_guerrilla
  L_cn2_garrison_defense:            # DAWN CN2 - GarrisonDefenseBotModule (CN port): mans own garrisons, threat-matched specialists
    GrantConditionOnBotOwner@cn2garrison:
      Bots: easiest, veryeasy, easy, medium, hard, veryhard, brutal, challenger, unbeatable, cameogod, exploit_rush, exploit_turtle, exploit_guerrilla
  M_cn3_deploy:                      # DAWN CN3 - DeployBotModule (CN port): artillery/stat/support/ability deploy driving
    GrantConditionOnBotOwner@cn3deploy:
      Bots: easiest, veryeasy, easy, medium, hard, veryhard, brutal, challenger, unbeatable, cameogod, exploit_rush, exploit_turtle, exploit_guerrilla
  N_ca6_target_intel:                # DAWN CA-6 - scout<->target loop: stale intel loses score; scouts refresh the main target's footprint
    MasterAiBotModule:
      WeightIntelAge: 120
    ScoutBotModule:
      UseTargetIntelBias: true
  O_ca2_defend_reserve:              # DAWN CA-2 - defend-draft keeps a reserve (FransGroundDefendForcePreservationGuard port); attacker inside base = emergency, commits all
    SquadManagerBotModuleCA:
      UseDefendPreservation: true
  P_di2_director_pacing:             # NOVA DI-2 — Director wave phase scales the assault launch bar (stacked on director-1 publisher)
    SquadManagerBotModuleCA:
      UseDirectorPacing: true
  Q_ut3_defend_share:                # NOVA UT-3 — TurtleRush axis scales the CA-2 defend reserve (turtles dig deeper, rushers strip the pool); needs O_ca2 armed to have a reserve to scale
    SquadManagerBotModuleCA:
      UseUtilityDefendReserve: true
  R_tc2_sync_attacks:                # NOVA TC-2a — an ally's Director Climax opens our launch window too; team waves surge together (reads TC-1 blackboard, inert in 1v1)
    SquadManagerBotModuleCA:
      UseTeamSyncAttacks: true
