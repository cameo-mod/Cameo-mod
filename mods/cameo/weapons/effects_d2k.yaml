# effects_d2k.yaml — D2k effect FAMILY templates (W27).
# Ruling 2026-09-23 5a: one effect-template file per game, mounted in mod.yaml.
# The ^d2k_* visual+sound PAIRING atoms live in
# ContentPacks/D2k/Shared/yaml/weapons.yaml; the templates below compose full
# resolved channel payloads so concrete weapons need no inline Warhead@* nodes.

^d2k_fremen_s:
	Warhead@2Eff: CreateEffect
		ExplosionPalette: effect75alpha
		Explosions: d2k_small_explosion
		ImpactActors: false
		ImpactSounds: EXPLSML1.WAV

^d2k_phoenix_rocket:
	Warhead@3Eff: CreateEffect
		ExplosionPalette: effect
		Explosions: napalm
		GlowFadeFrames: 30
		GlowFadeInFrames: 12
		GlowScale: 1.5
		ImpactSounds: firebl3.aud

# Family derivation of ^Effect_Laser_Heavy with the ruled D2k air-impact sound.
^d2k_laser_heavy:
	Inherits: ^Effect_Laser_Heavy
	Warhead@EffectAir:
		ImpactSounds: EXPLLG2.WAV

^d2k_explosive_debris:
	Warhead@Effect: CreateEffect
		ExplosionPalette: effect75alpha
		Explosions: large_explosion
		ImpactActors: false
		ImpactSounds: EXPLSML4.WAV
		ValidTargets: Ground, Ship

^d2k_plasma_explosion:
	Warhead@3Eff: CreateEffect
		ExplosionPalette: effect75alpha
		Explosions: devastator
		ImpactSounds: EXPLLG2.WAV
