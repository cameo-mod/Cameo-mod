# effects_d2k.yaml — D2k effect FAMILY templates (W27).
# Ruling 2026-09-23 5a: one effect-template file per game, mounted in mod.yaml.
# The ^d2k_* visual+sound PAIRING atoms live in
# ContentPacks/D2k/Shared/yaml/weapons.yaml; the templates below compose full
# resolved channel payloads so concrete weapons need no inline Warhead@* nodes.

^d2k_fremen_s:
	Warhead@2Eff: CreateEffect
		ExplosionPalette: effect75alpha
		Explosions: d2k_small_explosion
		ImpactActors: false
		ImpactSounds: EXPLSML1.WAV

^d2k_phoenix_rocket:
	Warhead@3Eff: CreateEffect
		ExplosionPalette: effect
		Explosions: napalm
		GlowFadeFrames: 30
		GlowFadeInFrames: 12
		GlowScale: 1.5
		ImpactSounds: firebl3.aud

# Family derivation of ^Effect_Laser_Heavy with the ruled D2k air-impact sound.
^d2k_laser_heavy:
	Inherits: ^Effect_Laser_Heavy
	Warhead@EffectAir:
		ImpactSounds: EXPLLG2.WAV

^d2k_explosive_debris:
	Warhead@Effect: CreateEffect
		ExplosionPalette: effect75alpha
		Explosions: large_explosion
		ImpactActors: false
		ImpactSounds: EXPLSML4.WAV
		ValidTargets: Ground, Ship

^d2k_plasma_explosion:
	Warhead@3Eff: CreateEffect
		ExplosionPalette: effect75alpha
		Explosions: devastator
		ImpactSounds: EXPLLG2.WAV

^d2k_ordos_bullet_medium:
	Inherits: ^Effect_Bullet_Medium
	Warhead@EffectWater:
		ImpactSounds: splash9.aud

^d2k_ordos_laser_heavy:
	Inherits: ^Effect_Laser_Heavy
	Warhead@EffectAir:
		ImpactSounds: EXPLLG2.WAV
	Warhead@EffectWater: CreateEffect
		ImpactSounds: splash9.aud

^d2k_ordos_laser_heavy_2:
	Inherits: ^Effect_Laser_Heavy
	Warhead@EffectAir:
		ImpactSounds: EXPLLG2.WAV

^d2k_ordos_flame_heavy:
	Inherits: ^Effect_Flame_Heavy
	Warhead@Effect:
		GlowFadeFrames: 30
		Explosions: deviator
		ExplosionPalette: deviatorgas
		GlowScale: 1.5
		UsePlayerPalette: true
		ImpactSounds: bioball_impact.wav
		ValidTargets: Ground, Ship

^d2k_ordos_deviator_art:
	Inherits: ^Effect_Flame_Heavy
	Warhead@Effect:
		GlowFadeFrames: 30
		Explosions: deviator
		ExplosionPalette: deviatorgas
		GlowScale: 1.5
		UsePlayerPalette: true
		ImpactSounds: bioball_impact.wav
		ValidTargets: Ground, Air

^d2k_ordos_set4:
	Warhead@2Eff: CreateEffect
		ImpactSounds: EXPLSML4.WAV
		ExplosionPalette: effect75alpha
		Explosions: d2k_large_explosion

^d2k_ordos_120mm_td:
	Warhead@Effect: CreateEffect
		GlowFadeFrames: 30
		ImpactSounds: xplosml2.aud
		GlowScale: 1.5
		GlowFadeInFrames: 12
		Explosions: poof
	Warhead@EffectAir: CreateEffect
		ImpactSounds: EXPLLG2.WAV
		Explosions: big_explosion_air

^d2k_ordos_eye_bomberguy:
	Warhead@Effect: CreateEffect
		ExplosionPalette: effect75alpha
		Explosions: d2k_building
		ImpactSounds: EXPLSML2.WAV

^d2k_ordos_deviatormissile:
	Inherits: ^Effect_CannonHE_Heavy
	Warhead@Effect:
		GlowFadeFrames: 30
		Explosions: deviator
		ExplosionPalette: deviatorgas
		GlowScale: 1.5
		UsePlayerPalette: true
		GlowFadeInFrames: 12
		ImpactSounds: bioball_impact.wav
		ValidTargets: Ground, Air
	Warhead@EffectAir:
		ImpactSounds: EXPLLG2.WAV
	Warhead@Smudge:
		SmudgeType: SandCrater, RockCrater

^d2k_ordos_d2k_grenade:
	Inherits: ^Effect_Concussion_Medium
	Warhead@Effect:
		ExplosionPalette: effect75alpha
