# Dune 2000 weapons — legacy remainder.
#
# Every weapon still referenced by a live actor or weapon was moved into the
# D2k ContentPacks on 2026-09-22 (devin/dawn branch, resolved-diff verified):
#   - ContentPacks/D2k/Shared/yaml/weapons.yaml — cross-faction weapons and
#     shared ^templates, plus weapons re-homed from single packs that other
#     packs referenced (OrniGun, Sound, HMG, ordos_autogunturret, HMG_turret,
#     d2k_laser).
#   - The owning faction pack for faction-unique weapons.
#
# What remains here, and why:
#   1. CROSS-THEME consumers — needs a design ruling before it can move:
#      DeathHand, oDeathHand, PulseMissile, ixian_airdrone are referenced by
#      Core/yaml Player support powers; D2K_155mm is referenced by
#      StarCraft/Zerg weapons (BehemothShoot, GuardianShoot).
#   2. UNREFERENCED weapons (the o* OpenRA-era duplicates and the d2k_*
#      specials such as D2KAPMine/d2k_quake_boom) — nothing live references
#      them (all 363 .oramap archives scanned clean; dormant commented-out
#      rules/dune2.yaml + weapons/dune2.yaml still name oDeviatorMissile and
#      oSound). Held pending the unused-file audit phase in docs/MIGRATION.md.

