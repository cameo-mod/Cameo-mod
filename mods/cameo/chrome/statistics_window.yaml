					Y: 12
					Width: 28
					Height: 28
					Key: escape
					Background: button
					Children:
						Label@TEXT:
							Width: PARENT_WIDTH
							Height: PARENT_HEIGHT
							Align: Center
							VAlign: Middle
							Font: Bold
							Text: X

