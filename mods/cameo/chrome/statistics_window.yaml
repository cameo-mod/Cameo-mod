Container@STATISTICS_PANEL:
	Width: WINDOW_WIDTH
	Height: WINDOW_HEIGHT
	Logic: StatisticsWindowLogic
	Children:
		ClickMask@MASK:
			Width: WINDOW_WIDTH
			Height: WINDOW_HEIGHT
			Color: 00000099
