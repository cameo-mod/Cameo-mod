			X: (WINDOW_WIDTH - WIDTH) / 2
			Y: (WINDOW_HEIGHT - HEIGHT) / 2
			Width: 900
			Height: 680
			Children:
				ColorBlock@WINDOW_BG:
					Width: PARENT_WIDTH
					Height: PARENT_HEIGHT
					Color: 101520F2
				Label@TITLE:
					Y: 14
					Width: PARENT_WIDTH
					Height: 26
					Align: Center
					Font: Bold
					Text: statistics.title
				Button@CLOSE_BUTTON:
