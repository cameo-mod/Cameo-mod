Container@MAINMENU:
	Logic: MainMenuLogic, CameoMainMenuLogic
	Children:
		LogicKeyListener@GLOBAL_KEYHANDLER:
			Logic: MusicHotkeyLogic, ScreenshotHotkeyLogic, MuteHotkeyLogic
				StopMusicKey: StopMusic
				PauseMusicKey: PauseMusic
				PrevMusicKey: PrevMusic
				NextMusicKey: NextMusic
				TakeScreenshotKey: TakeScreenshot
				MuteAudioKey: ToggleMute
		Background@BORDER:
			Background: mainmenu-border
			X: 0 - 15
			Y: 0 - 15
			Width: WINDOW_WIDTH + 30
			Height: WINDOW_HEIGHT + 30
		Image@LOGO:
			X: WINDOW_WIDTH - 296
			Y: 30
			ImageCollection: logos
			ImageName: logo
		Label@VERSION_LABEL:
			Logic: VersionLabelLogic
			X: WINDOW_WIDTH - 296
			Y: 296 - 20
			Width: 296 - 20
			Height: 25
			Align: Center
			Font: Regular
			Shadow: true
		Container@MENUS:
			X: 13 + (WINDOW_WIDTH - 522) / 4 - WIDTH / 2
			Y: WINDOW_HEIGHT / 2 - HEIGHT / 2
			Width: 200
			Height: 320
			Children:
				Background@MAIN_MENU:
					Background: cyberintel-panel
					Width: PARENT_WIDTH
					Height: PARENT_HEIGHT
					Children:
						Label@MAINMENU_LABEL_TITLE:
							X: 0
							Y: 22
							Width: 200
							Height: 34
							Text: CAMEO
							Align: Center
							Font: Bold
							TextColor: FFC088
						Button@SINGLEPLAYER_BUTTON:
							X: PARENT_WIDTH / 2 - WIDTH / 2
							Y: 60
							Width: 140
							Height: 34
							Text: Singleplayer
							Font: Bold
							Background: cyberintel-button
							TextColor: F0A46E
						Button@MULTIPLAYER_BUTTON:
							X: PARENT_WIDTH / 2 - WIDTH / 2
							Y: 100
							Width: 140
							Height: 34
							Text: Multiplayer
							Font: Bold
							Background: cyberintel-button
							TextColor: F0A46E
						Button@SETTINGS_BUTTON:
							X: PARENT_WIDTH / 2 - WIDTH / 2
							Y: 140
							Width: 140
							Height: 34
							Text: Settings
							Font: Bold
							Background: cyberintel-button
							TextColor: F0A46E
						Button@EXTRAS_BUTTON:
							X: PARENT_WIDTH / 2 - WIDTH / 2
							Y: 180
							Width: 140
							Height: 34
							Text: Extras
							Font: Bold
							Background: cyberintel-button
							TextColor: F0A46E
						Button@CONTENT_BUTTON:
							X: PARENT_WIDTH / 2 - WIDTH / 2
							Y: 220
							Width: 140
							Height: 34
							Text: Manage Content
							Font: Bold
							Background: cyberintel-button
							TextColor: F0A46E
						Button@QUIT_BUTTON:
							X: PARENT_WIDTH / 2 - WIDTH / 2
							Y: 260
							Width: 140
							Height: 34
							Text: Quit
							Font: Bold
							Background: cyberintel-button
							TextColor: F0A46E
				Background@SINGLEPLAYER_MENU:
					Background: cyberintel-panel
					Width: PARENT_WIDTH
					Height: PARENT_HEIGHT
					Children:
						Label@SINGLEPLAYER_MENU_TITLE:
							X: 0
							Y: 20
							Width: 200
							Height: 34
							Text: Singleplayer
							Align: Center
							Font: Bold
							TextColor: FFC088
						Button@SKIRMISH_BUTTON:
							X: PARENT_WIDTH / 2 - WIDTH / 2
							Y: 60
							Width: 140
							Height: 34
							Text: Skirmish
							Font: Bold
							Background: cyberintel-button
							TextColor: F0A46E
						Button@MISSIONS_BUTTON:
							X: PARENT_WIDTH / 2 - WIDTH / 2
							Y: 100
							Width: 140
							Height: 34
							Text: Missions
							Font: Bold
							Background: cyberintel-button
							TextColor: F0A46E
						Button@LOAD_BUTTON:
							X: PARENT_WIDTH / 2 - WIDTH / 2
							Y: 140
							Width: 140
							Height: 34
							Text: Load
							Font: Bold
							Background: cyberintel-button
							TextColor: F0A46E
						Button@BACK_BUTTON:
							X: PARENT_WIDTH / 2 - WIDTH / 2
							Key: escape
							Y: 260
							Width: 140
							Height: 34
							Text: Back
							Font: Bold
							Background: cyberintel-button
							TextColor: F0A46E
				Background@EXTRAS_MENU:
					Background: cyberintel-panel
					Width: PARENT_WIDTH
					Height: PARENT_HEIGHT
					Children:
						Label@EXTRAS_MENU_TITLE:
							X: 0
							Y: 20
							Width: 200
							Height: 34
							Text: Extras
							Align: Center
							Font: Bold
							TextColor: FFC088
						Button@REPLAYS_BUTTON:
							X: PARENT_WIDTH / 2 - WIDTH / 2
							Y: 60
							Width: 140
							Height: 34
							Text: Replays
							Font: Bold
							Background: cyberintel-button
							TextColor: F0A46E
						Button@MUSIC_BUTTON:
							X: PARENT_WIDTH / 2 - WIDTH / 2
							Y: 100
							Width: 140
							Height: 34
							Text: Music
							Font: Bold
							Background: cyberintel-button
							TextColor: F0A46E
						Button@MAP_EDITOR_BUTTON:
							X: PARENT_WIDTH / 2 - WIDTH / 2
							Y: 140
							Width: 140
							Height: 34
							Text: Map Editor
							Font: Bold
							Background: cyberintel-button
							TextColor: F0A46E
						Button@ASSETBROWSER_BUTTON:
							X: PARENT_WIDTH / 2 - WIDTH / 2
							Y: 180
							Width: 140
							Height: 34
							Text: Asset Browser
							Font: Bold
							Background: cyberintel-button
							TextColor: F0A46E
						Button@CREDITS_BUTTON:
							X: PARENT_WIDTH / 2 - WIDTH / 2
							Y: 220
							Width: 140
							Height: 34
							Text: Credits
							Font: Bold
							Background: cyberintel-button
							TextColor: F0A46E
						Button@BACK_BUTTON:
							X: PARENT_WIDTH / 2 - WIDTH / 2
							Key: escape
							Y: 260
							Width: 140
							Height: 34
							Text: Back
							Font: Bold
							Background: cyberintel-button
							TextColor: F0A46E
				Background@MAP_EDITOR_MENU:
					Background: cyberintel-panel
					Width: PARENT_WIDTH
					Height: PARENT_HEIGHT
					Children:
						Label@MAP_EDITOR_MENU_TITLE:
							X: 0
							Y: 20
							Width: 200
							Height: 34
							Text: Map Editor
							Align: Center
							Font: Bold
							TextColor: FFC088
						Button@NEW_MAP_BUTTON:
							X: PARENT_WIDTH / 2 - WIDTH / 2
							Y: 60
							Width: 140
							Height: 34
							Text: New Map
							Font: Bold
							Background: cyberintel-button
							TextColor: F0A46E
						Button@LOAD_MAP_BUTTON:
							X: PARENT_WIDTH / 2 - WIDTH / 2
							Y: 100
							Width: 140
							Height: 34
							Text: Load Map
							Font: Bold
							Background: cyberintel-button
							TextColor: F0A46E
						Button@BACK_BUTTON:
							X: PARENT_WIDTH / 2 - WIDTH / 2
							Key: escape
							Y: 260
							Width: 140
							Height: 34
							Text: Back
							Font: Bold
							Background: cyberintel-button
							TextColor: F0A46E
		Container@PERFORMANCE_INFO:
			Logic: PerfDebugLogic
			Children:
				Label@PERF_TEXT:
					X: 30
					Y: WINDOW_HEIGHT - 70
					Width: 170
					Height: 40
					Contrast: true
				Background@GRAPH_BG:
					ClickThrough: true
					Background: dialog4
					X: WINDOW_WIDTH - 240
					Y: WINDOW_HEIGHT - 240
					Width: 210
					Height: 210
					Children:
						PerfGraph@GRAPH:
							X: 5
							Y: 5
							Width: 200
							Height: 200
		Background@NEWS_BG:
			X: (WINDOW_WIDTH - WIDTH) / 2
			Y: 35
			Width: 430
			Height: 55
			Children:
				DropDownButton@NEWS_BUTTON:
					Background: newsbutton
					X: 15
					Y: 15
					Width: 400
					Height: 25
					Text: Cameo News
					Font: Bold
		Container@UPDATE_NOTICE:
			X: (WINDOW_WIDTH - WIDTH) / 2
			Y: 95
			Width: 128
			Children:
				Label@A:
					Width: PARENT_WIDTH
					Height: 25
					Align: Center
					Shadow: true
					Text: You are running an outdated version of OpenRA.
				Label@B:
					Y: 20
					Width: PARENT_WIDTH
					Height: 25
					Align: Center
					Shadow: true
					Text: Download the latest version from www.openra.net
		Container@PLAYER_PROFILE_CONTAINER:
			Logic: LoadLocalPlayerProfileLogic
			X: 25
			Y: 25
		# Detached top-right shortcut, mirroring the top-left player-profile card. Statistics
		# are player-career data, so they get a persistent shell button rather than being buried
		# in Extras. Sits clear of the centred news bar and above the right-hand logo.
		Button@STATISTICS_BUTTON:
			X: WINDOW_WIDTH - WIDTH - 25
			Y: 25
			Width: 140
			Height: 34
			Text: Statistics (WIP)
			Font: Bold
			Background: cyberintel-button
			TextColor: F0A46E
