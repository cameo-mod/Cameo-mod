MapFormat: 12

RequiresMod: cameo

Title: AI B1 B7 Weapon Gate

Author: Cameo runtime validation

Tileset: RA_DESERT

MapSize: 98,98

Bounds: 1,1,96,96

Visibility: MissionSelector

Categories: Testing

LockPreview: True

Players:
	PlayerReference@Neutral:
		Name: Neutral
		OwnsWorld: True
		NonCombatant: True
		Faction: Random
	PlayerReference@Creeps:
		Name: Creeps
		NonCombatant: True
		Faction: Random
	PlayerReference@Player:
		Name: Player
		Playable: True
		Required: True
		AllowBots: False
		Faction: td_gdi
		LockSpawn: True
		Enemies: HardBot, GateFoe
	PlayerReference@HardBot:
		Name: HardBot
		Bot: hard
		Faction: japan
		Enemies: Player
	# Static enemy-victim owner for the B1 zone. No bot, no orders: the
	# exorcist is player-owned so nothing in the gate can be ordered to move.
	PlayerReference@GateFoe:
		Name: GateFoe
		NonCombatant: True
		Faction: Random
		Enemies: Player, HardBot

Actors:
	Spawn0: mpspawn
		Owner: Neutral
		Location: 12,12
	Spawn1: mpspawn
		Owner: Neutral
		Location: 84,84

Rules: rules.yaml
