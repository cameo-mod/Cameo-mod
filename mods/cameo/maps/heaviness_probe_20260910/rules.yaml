World:
	LuaScript:
		Scripts: test.lua
	-CrateSpawner:
	-SpawnStartingUnits:
	-MapStartingLocations:
	MapOptions:
		ShortGameEnabled: False

Player:
	-ConquestVictoryConditions:
	Shroud:
		FogCheckboxEnabled: False
		ExploredMapCheckboxEnabled: True
	PlayerResources:
		DefaultCash: 0

^probe_shooter:
	Immobile:
	RevealsShroud:
		Range: 6c0
	BodyOrientation:
		QuantizedFacings: 0
	AttackOmni:
	Armament:
		Weapon: ProbeLegacyLight

probe_legacy_light:
	Inherits: ^probe_shooter

probe_legacy_medium:
	Inherits: ^probe_shooter
	Armament:
		Weapon: ProbeLegacyMedium

probe_legacy_heavy:
	Inherits: ^probe_shooter
	Armament:
		Weapon: ProbeLegacyHeavy

probe_h0:
	Inherits: ^probe_shooter
	Armament:
		Weapon: ProbeH0

probe_h1000:
	Inherits: ^probe_shooter
	Armament:
		Weapon: ProbeH1000

probe_h2000:
	Inherits: ^probe_shooter
	Armament:
		Weapon: ProbeH2000

probe_target:
	Immobile:
	HiddenUnderShroud:
		AlwaysVisibleRelationships: Ally, Neutral, Enemy
	BodyOrientation:
		QuantizedFacings: 0
	ScriptTriggers:
	Health:
		HP: 1000000
	Armor:
		Type: Medium
	Targetable:
		TargetTypes: Ground
	HitShape:
		Type: Circle
			Radius: 1

probe_target_shield:
	Inherits: probe_target
	Armor:
		Type: Shield
