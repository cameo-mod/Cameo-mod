	RenderRangeCircle:
		RangeCircleType: pointdefense
		Color: FF000088
	Armament@pointdefense:
		Weapon: TKMPDLaser
	ActorStatValues:
		Upgrades: tkm_upgrade_natoarsenalupgrade
	RenderSprites:
		Image: tkm_abrams
		PlayerPalette: player_rgba

