####################################################################################################
#		MPSTARTUNITS
####################################################################################################

	StartingUnits@mcvonlyratstkm:
		Class: none
		ClassName: MCV Only
		Factions: tkm
		BaseActor: tkm_mobileconstructionvehicletkm
	StartingUnits@defaulttstkm:
		Class: light
		ClassName: Light Support
		Factions: tkm
		BaseActor: tkm_mobileconstructionvehicletkm
		SupportActors: tkm_rifleman,tkm_rifleman,tkm_rifleman,tkm_rocketeer,tkm_rocketeer,tkm_technicaltank,tkm_technical
	StartingUnits@heavytstkm:
		Class: heavy
		ClassName: Heavy Support
		Factions: tkm
		BaseActor: tkm_mobileconstructionvehicletkm
		SupportActors: tkm_rifleman,tkm_rifleman,tkm_rifleman,tkm_rocketeer,tkm_rocketeer,tkm_technicaltank,tkm_technical,tkm_technical,tkm_technical,tkm_technical

#######################################
# TKM Defaults
#######################################

^uptitanarsenalupgrade:
	GrantConditionOnPrerequisite@titanplating:
		Condition: upspeed
		Prerequisites: tkm_upgrade_titanarsenalupgrade
	DamageMultiplier@titanplatinghealth:
		Modifier: 75
		RequiresCondition: upspeed
	SpeedMultiplier@titanplatingspeed:
		Modifier: 70
		RequiresCondition: upspeed

^tkm_upgrade_semiautoriflesupgrade:
	ActorStatValues:
		Upgrades: tkm_upgrade_berezkaarsenalupgrade, tkm_upgrade_semiautoriflesupgrade

^tkm_upgrade_twinrocketsupgrade:
	ActorStatValues:
		Upgrades: tkm_upgrade_berezkaarsenalupgrade, tkm_upgrade_twinrocketsupgrade

^tkm_upgrade_titanarmorpiercingbulletsupgrade:
	ActorStatValues:
		Upgrades: tkm_upgrade_titanarsenalupgrade, tkm_upgrade_titanarmorpiercingbulletsupgrade

^tkm_upgrade_incendiaryrocketsupgrade:
	ActorStatValues:
		Upgrades: tkm_upgrade_titanarsenalupgrade, tkm_upgrade_incendiaryrocketsupgrade

^tkm_upgrade_infantryupgrade:
	DamageMultiplier@terran_upgrade_infantryweaponslevel1:
		Modifier: 70
		RequiresCondition: tkm_upgrade_infantryupgrade
	FirepowerMultiplier@terran_upgrade_infantryweaponslevel1:
		Modifier: 125
		RequiresCondition: tkm_upgrade_infantryupgrade
	GrantConditionOnPrerequisite@tkm_upgrade_infantryupgrade:
		Condition: tkm_upgrade_infantryupgrade
		Prerequisites: tkm_upgrade_infantryupgrade

#######################################
# TKM MCV and Construction Yard
#######################################

tkmworker:
	Inherits: YRSLAV
	Tooltip:
		Name: Worker
	Targetable@SlaveFaster:
		TargetTypes: SlaveFaster
		RequiresCondition: SlaveFaster <= 3 && !untargetable
	ExternalCondition@SlaveFaster:
		Condition: SlaveFaster
		TotalCap: 3
	Voiced:
		VoiceSet: SlaveWorkerVoice
		RequiresCondition: !freed
	Voiced@2:
		VoiceSet: FreedSlaveVoice
		RequiresCondition: freed
	RenderSprites:
		Image: tkmworker

tkmvan:
	Inherits: ^Soldier
	Inherits@Template: ^HeroInfantryTemplate
	Inherits@EXPERIENCE: ^GainsExperienceRA2
	Inherits@AUTOTARGET: ^AutoTargetAllAssaultMove
	Inherits@DECORATIONS: ^InfantryExperienceHospitalHazmatOverrides
	Inherits@cloak: ^CloakedVehicle
	Inherits@anim: ^RA2Infantry
	Inherits@vo: ^AttackFrontalVoice
	Inherits@infantryweapon: ^tkm_upgrade_infantryupgrade
	Tooltip:
		Name: Van
	Valued:
		Cost: 3500
	Buildable:
		BuildPaletteOrder: 40
		Prerequisites: ~tkm_barracks, tkm_observationvan, ~!tkm_von, ~disabled
		Queue: Infantry, RAInfantry
		Description: actor_ra2snipe.description
		BuildLimit: 1
	Mobile:
		Speed: 75
	Health:
		HP: 40000
	ChangesHealth@SelfHealing:
		Step: 40
	Armament@PRIMARY:
		Weapon: VanSniper
		LocalOffset: 500,0,400
	Armament@GARRISONED: ##########
		Name: garrisoned
		Weapon: VanSniper
	AttackFrontal:
		FacingTolerance: 0
	ActorStatValues:
		Upgrades: tkm_upgrade_titanarmorpiercingbulletsupgrade, tkm_upgrade_infantryupgrade
	Voiced:
		VoiceSet: TSInfantry
	RenderSprites:
		Image: tkm_von

tkmabramspoint:
	Inherits: tkm_abrams
	Tooltip:
		Name: Abrams (Point Defense System)
	Buildable:
		Prerequisites: ~tkm_warfactory, ~tkm_upgrade_pointdefensesystem, tkm_observationvan, ~disabled
