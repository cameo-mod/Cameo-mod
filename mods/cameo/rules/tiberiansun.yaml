#######################################
# TS Defaults
#######################################

^TSSpawnActorsOnSell:
	SoundOnDamageTransition:
		DamagedSounds: expnew01.aud, expnew02.aud, expnew04.aud, expnew05.aud
		DestroyedSounds: expnew03.aud, expnew07.aud, expnew08.aud, expnew11.aud
	SpawnActorsOnSell:
		ActorTypes: tsengineer, tse1, tse1, tse1
	Building:
		BuildSounds: tsplace2.aud

^TSRenderVoxel:
	Inherits: ^RenderVoxel
	RenderVoxels:
		Scale: 15
		NormalsPalette: ts-normals
		PlayerPalette: playerra2
		LightAmbientColor: 0.6, 0.6, 0.6
		LightDiffuseColor: 0.4, 0.4, 0.4
		LightPitch: 142
		LightYaw: 682

^TSInfantry:
	WithDeathAnimation:
		PlayerPalette: playerra2
		DeathTypes:
			DefaultDeath: 1
			BulletDeath: 2
			RippedApartDeath: 2
			SmallExplosionDeath: 4
			ExplosionDeath: 4
			TiberiumDeath: 1
			RA2VirusDeath: 1
	Crushable:
		CrushSound: squish6.aud

^HunterSeekersPower:
	FireArmamentPower@HunterSeeker:
		Names:
			1: Data Worm
		Descriptions:
			1: A self-replicating data worm hijacks a Hunter-Seeker droid and launches it at a designated target.\n  Instantly kills mobile targets\n  Splash damage strong vs Vehicles, Buildings\n  Requires line of sight to target
		Icons:
			1: icon
		IconImage: cabaldataworm
		PauseOnCondition: lowpower || disabled
		Prerequisites:
			1: cabaldataworm
		ChargeInterval: 4500
		ArmamentName: superweapon
		ValidRelationships: Enemy, Neutral, Ally
		EndChargeSpeechNotification: AirstrikeReady
		SelectTargetSpeechNotification: SelectTarget
		InsufficientPowerSpeechNotification: InsufficientPower
		IncomingSpeechNotification: EnemyPlanesApproaching
		IncomingSound: hunter2.aud
		LaunchSound: hunter2.aud
		TargetMustBeVisible: true
		TargetActors: true
		ShowSelectionBoxes: true
		TargetCircleRange: 1c512
		OrderName: HunterSeekerSpawn
		SupportPowerPaletteOrder: 20
	Exit@1:
		ExitCell: 1,0
	Exit@2:
		ExitCell: 1,1
	Exit@3:
		ExitCell: 2,1
	Exit@4:
		ExitCell: 2,0
	Turreted:
	AttackTurreted:
	Armament@HunterSeeker:
		Weapon: TSHSeekerLaunch
		Name: superweapon
	CarrierMaster@HunterSeeker:
		ArmamentNames: superweapon
		Actors: tsprobe
		SpawnIsMissile: true
		UseArmamentTurretFacing: true
		SlaveDisposalOnKill: DoNothing

