td_gdi_promotion_unlockempgrenadier:
	Inherits: ^promotion_upgrade.template
	Tooltip:
		Name: Unlock EMP Grenadier
	Buildable:
		BuildPaletteOrder: 13
		Queue: Promotions
		Description: Allows training of EMP Grenadiers.
		Prerequisites: ~td_gdi_constructionyard, !td_gdi_promotion_unlockempgrenadier, rank1
	RenderSprites:
		Image: td_gdi_empgrenadier
	ProvidesPrerequisite:
		Prerequisite: td_gdi_promotion_unlockempgrenadier

