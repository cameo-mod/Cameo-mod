CNCSS:
	Inherits: ^BoatUnit
	Inherits@Template: ^ScoutShipTemplate
	Inherits@EXPERIENCE: ^GainsExperience
	Inherits@AUTOTARGET: ^AutoTargetGroundAssaultMove
	Inherits@EMP: ^FrontalEMP
	Inherits@sub: ^Submarine
	Inherits@GuerillaTactics: ^GuerillaTactics
	Inherits@AdvancedGuerillaTactics: ^AdvancedGuerillaTactics
	Inherits@BlackMarketUpgrades: ^BlackMarketUpgrades
	Valued:
		Cost: 1600
	Tooltip:
		Name: Nod Attack Submarine
	Buildable:
		BuildPaletteOrder: 20
		Prerequisites: ~cncspen
		Queue: Naval, RANaval
		Description: actor_ra1_soviets_submarine.description
	Mobile:
		Speed: 80
		TurnSpeed: 32
	Health:
		HP: 160000
	ChangesHealth@SelfHealing:
		Step: 64
	Armor:
		Type: Heavy
	Turreted:
		TurnSpeed: 16
		Offset: 512,0,0
	Armament@PRIMARY:
		Weapon: NodTorpTube
		LocalOffset: 256,128,0, 256,-128,0
		RequiresCondition: !td_nod_upgrade_blackmarketupgrades
	Armament@Upgrade:
		Weapon: NodTorpTubeBlackMarket
		LocalOffset: 256,128,0, 256,-128,0
		RequiresCondition: td_nod_upgrade_blackmarketupgrades
	RenderRangeCircle:
	Targetable:
		TargetTypes: Ground, Water, Ship, Submarine
	AttackFrontal:
		FacingTolerance: 0
	Selectable:
		DecorationBounds: 1536, 1536
	DeliversCash:
	Voiced:
		VoiceSet: VehicleVoice
	Cloak@underwater:
	RenderSprites:
		Image: cncss
		PlayerPalette: player_rgba
	ActorStatValues:
		Upgrades: td_nod_upgrade_guerillatactics, td_nod_upgrade_advancedguerillatactics, td_nod_upgrade_blackmarketupgrades

ssmsub:
	Inherits: ^BoatUnit
	Inherits@Template: ^ArtilleryShipTemplate
	Inherits@exp: ^GainsExperienceTD
	Inherits@EXPERIENCE: ^GainsExperience
	Inherits@AUTOTARGET: ^AutoTargetGroundAssaultMove
	Inherits@EMP: ^FrontalEMP
	Inherits@sub: ^Submarine
	Inherits@ElementalWarfare: ^ElementalWarfare
	Inherits@ImprovedArtilleries: ^ImprovedArtilleries
	Inherits@GuerillaTactics: ^GuerillaTactics
	Inherits@AdvancedGuerillaTactics: ^AdvancedGuerillaTactics
	Valued:
		Cost: 2800
	Tooltip:
		Name: Ballistic Missile Submarine
	Buildable:
		BuildPaletteOrder: 50
		Prerequisites: ~cncspen, td_nod_communicationscenter
		Queue: Naval, RANaval
		Description: actor_ra1_soviets_missilesubmarine.description
	Mobile:
		Speed: 60
		TurnSpeed: 24
	Health:
		HP: 200000
	ChangesHealth@SelfHealing:
		Step: 80
	Armor:
		Type: Medium
	Armament:
		Weapon: HonestJohn
		LocalOffset: 800,200,0, 800,-200,0
		MuzzleSequence: muzzle
	WithMuzzleOverlay:
	Targetable:
		TargetTypes: Ground, Water, Ship, Submarine
	AttackFrontal:
		FacingTolerance: 0
	Selectable:
		DecorationBounds: 1536, 1536
	DeliversCash:
	Cloak@underwater:
		CloakDelay: 100
	Voiced:
		VoiceSet: VehicleVoice
	FirepowerMultiplier@BallisticMissileSubBuff:
		Modifier: 200
	FireWarheadsOnDeath:
		Weapon: ArtilleryShell
	AmmoPool:
		Ammo: 2
		AmmoCondition: ammo
	ReloadAmmoPool:
		Delay: 125
		Count: 1
	WithFacingSpriteBody:
		Sequence: idle
		RequiresCondition: ammo == 2
	WithFacingSpriteBody@OneMissile:
		Sequence: idle-one
		RequiresCondition: ammo == 1
	WithFacingSpriteBody@NoMissiles:
		Sequence: idle-empty
		RequiresCondition: !ammo
	RenderSprites:
		Image: ssmsub
	ActorStatValues:
		Upgrades: td_nod_upgrade_elementalwarfare, td_nod_upgrade_improvedartilleries, td_nod_upgrade_guerillatactics, td_nod_upgrade_advancedguerillatactics

nodlasercorvette:
	Inherits: ^BoatUnit
	Inherits@Template: ^BattleShipTemplate
	Inherits@exp: ^GainsExperienceTD
	Inherits@AUTOTARGET: ^AutoTargetAllAssaultMove
	Inherits@EMP: ^TurretEMP
	Inherits@EliteCapacitors: ^EliteCapacitors
	Valued:
		Cost: 2300
	Tooltip:
		Name: Nod Laser Corvette
	Buildable:
		BuildPaletteOrder: 50
		Prerequisites: ~cncspen, td_nod_templeofnod
		Queue: Naval, RANaval
		Description: actor_nodlasercorvette.description
	Mobile:
		Speed: 60
		TurnSpeed: 12
	Health:
		HP: 150000
	ChangesHealth@SelfHealing:
		Step: 60
	Armor:
		Type: Medium
	Turreted@PRIMARY:
		Turret: primary
		Offset: 0,0,0
		TurnSpeed: 1000
	Turreted@SECONDARY:
		Turret: secondary
		Offset: 900,0,200
		TurnSpeed: 24
	Armament@PRIMARY:
		Turret: primary
		Name: primary
		Weapon: CorvetteLaserObelisk
		LocalOffset: 0,0,800
	Armament@SECONDARY:
		Turret: secondary
		Name: secondary
		Weapon: CorvetteDragon
		LocalOffset: 480,-100,40, 480,100,40
		Recoil: 88
		RecoilRecovery: 35
		MuzzleSequence: muzzle
	AttackTurreted:
		Turrets: secondary
		Armaments: secondary
	AttackTurretedCharged:
		Turrets: primary
		Armaments: primary
		PauseOnCondition: disabled
		ChargeLevel: 50
		ChargingCondition: charging
	AmbientSound:
		RequiresCondition: charging
		SoundFiles: obelpowr.aud
		Interval: 30, 40
	RenderRangeCircle:
	WithMuzzleOverlay:
	Selectable:
		DecorationBounds: 2048, 2048
	WithSpriteTurret@SECONDARY:
		Turret: secondary
		Palette: ra_temperat
	DeliversCash:
	RenderSprites:
		PlayerPalette: player_rgba

CNCRSS:
	Inherits: ^BoatUnit
	Inherits@sub: ^Submarine
	Inherits@cargo: ^CargoVehicle
	Valued:
		Cost: 500
	Tooltip:
		Name: Transport Submarine
	Buildable:
		BuildPaletteOrder: 20
		Prerequisites: ~cncspen
		Queue: Naval, RANaval
		Description: Transport Submarine
	Mobile:
		Speed: 150
		RequiresCondition: !notmobile && !disabled
		Locomotor: lcraft
	Health:
		HP: 50000
	Armor:
		Type: Light
	RevealsShroud:
		Range: 5000
	Targetable:
		TargetTypes: Ground, Water, Ship, Submarine
	Selectable:
		DecorationBounds: 1536, 1536
	DeliversCash:
	Cargo:
		Types: Infantry, Hacker, Fremen, Vehicle
		MaxWeight: 5
		AfterLoadDelay: 0
		BeforeUnloadDelay: 0
		AfterUnloadDelay: 0
	GrantConditionOnTerrain@underwater:
		Condition: cancloak
		TerrainTypes: Water
	Cloak@underwater:
		PauseOnCondition: disabled || !cancloak
	RenderSprites:
		PlayerPalette: player_rgba