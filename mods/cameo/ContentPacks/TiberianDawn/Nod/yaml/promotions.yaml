td_nod_promotion_unlockchemicalrocketsoldier:
	Inherits: ^promotion_upgrade.template
	Tooltip:
		Name: Unlock Chemical Rocket Soldier
	Buildable:
		BuildPaletteOrder: 1
		Queue: Promotions
		Description: Allows training of Chemical Rocket Soldiers.
		Prerequisites: ~td_nod_constructionyard, !td_nod_promotion_unlockchemicalrocketsoldier, rank1
	RenderSprites:
		Image: e3chem
	ProvidesPrerequisite:
		Prerequisite: td_nod_promotion_unlockchemicalrocketsoldier

