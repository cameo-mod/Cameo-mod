td_nod_promotion_chemicalrocketsoldier:
	Inherits: ^PromotionUpgradeTemplate
	Tooltip:
		Name: Unlock Chemical Rocket Soldier
	Buildable:
		BuildPaletteOrder: 1
		Queue: Promotions
		Description: Allows training of Chemical Rocket Soldiers.
