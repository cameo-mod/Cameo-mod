tran.nod:
	Inherits: TRAN
	Inherits@GuerillaTactics: ^GuerillaTactics
	Inherits@AdvancedGuerillaTactics: ^AdvancedGuerillaTactics
	Valued:
		Cost: 3100
	Tooltip:
		Name: Nod Chinook Transport
	Buildable:
		BuildPaletteOrder: 10
		Prerequisites: ~hpad.nod
		Queue: Aircraft, RAAircraft
		Description: actor-tran.description
	EjectOnDeath:
		PilotActor: e1.nod
	Cargo:
		UnloadVoice: Move
		Types: Infantry, Hacker, Fremen
		MaxWeight: 8
		InitialUnits: e1.nod, e3.nod, e4, e5, cheme3, tsblackhandlaser, tsstealthsoldier, tsblackhandflamer
	ActorStatValues:
		Upgrades: up_guerillatactics, up_advancedguerillatactics

HELI:
	Inherits: ^Helicopter
	Inherits@Template: ^HelicopterTemplate
	Inherits@EXP: ^GainsExperienceTD
	Inherits@AUTOTARGET: ^AutoTargetAllAssaultMove
	Inherits@AntiInf: ^PrioritizeInfantry
	Inherits@AntiAir: ^PrioritizeAir
	Inherits@AntiDef: ^PrioritizeDefence
	Inherits@GuerillaTactics: ^GuerillaTactics
	Inherits@AdvancedGuerillaTactics: ^AdvancedGuerillaTactics
	Inherits@BlackMarketUpgrades: ^BlackMarketUpgrades
	Inherits@decoration: ^NodRankDecoration
	Inherits@eject: ^AircraftEjectOnDeath
	Valued:
		Cost: 1600
	Tooltip:
		Name: Apache Attack Helicopter
	Buildable:
		BuildPaletteOrder: 20
		Prerequisites: ~hpad.nod
		Queue: Aircraft, RAAircraft
		Description: actor-heli.description
	Aircraft:
		Speed: 160
		TurnSpeed: 32
		RepulsionSpeed: 32
	Health:
		HP: 45000
	Repairable:
		HpPerStep: 2250
	ChangesHealth@SelfHealing:
		Step: 18
	Armament@PRIMARY:
		Weapon: HeliGun
		LocalOffset: 128,-213,-85, 128,213,-85
		MuzzleSequence: muzzle
		PauseOnCondition: !ammo
	Armament@Upgrade:
		Weapon: HeliMissiles
		LocalOffset: 100,-250,-100, 100,250,-100
		MuzzleSequence: muzzle
		PauseOnCondition: !ammo
		RequiresCondition: up_blackmarketupgrades
	AttackAircraft:
		FacingTolerance: 10
		AttackType: Hover
	WithIdleOverlay@ROTORAIR:
		Offset: 0,0,85
		Sequence: rotor
		RequiresCondition: airborne
		PauseOnCondition: disabled
	WithIdleOverlay@ROTORGROUND:
		Offset: 0,0,85
		Sequence: slow-rotor
		RequiresCondition: !airborne
		PauseOnCondition: disabled
	WithMuzzleOverlay:
	SpawnActorOnDeath:
		Actor: HELI.Husk
	EjectOnDeath:
		PilotActor: e5
	SelectionDecorations:
	Selectable:
		DecorationBounds: 1280, 1280
	AmmoPool:
		Ammo: 4
		AmmoCondition: ammo
	ReloadAmmoPool:
		Delay: 8
		Count: 1
	ReloadAmmoDelayMultiplier@up_blackmarketupgrades:
		RequiresCondition: up_blackmarketupgrades
		Modifier: 50
	WithAmmoPipsDecoration:
		Position: BottomLeft
		RequiresSelection: True
		PipCount: 4
	ActorStatValues:
		Upgrades: up_guerillatactics, up_advancedguerillatactics, up_blackmarketupgrades

HELI.Husk:
	Inherits: ^HelicopterHusk
	Tooltip:
		Name: Apache Attack Helicopter
	Aircraft:
		TurnSpeed: 16
		Speed: 186
	WithIdleOverlay:
		Offset: 0,0,85
		Sequence: rotor
	RenderSprites:
		Image: heli

