	GrantConditionOnPrerequisite@up_cyberneticmodifications:
		Condition: up_cyberneticmodifications
		Prerequisites: up_cyberneticmodifications
	Shielded:
		InitialPercentageStrength: 100
		MaxPercentageStrength: 100
		DamageRegenDelay: 125
		RegenAmount: 25
		RegenInterval: 1
		ShieldsUpCondition: armored
