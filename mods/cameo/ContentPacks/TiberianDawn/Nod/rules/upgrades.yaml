		RequiresCondition: up_cyberneticmodifications
	Armor@up_cyberneticmodifications:
		Type: Medium
		RequiresCondition: armored
	DamageMultiplier@up_cyberneticmodifications:
		RequiresCondition: up_cyberneticmodifications
		Modifier: 200
	SpeedMultiplier@up_cyberneticmodifications:
