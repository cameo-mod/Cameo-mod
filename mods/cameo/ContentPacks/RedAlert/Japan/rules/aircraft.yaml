	Inherits@DivineWindProtocol: ^DivineWindProtocol
	Inherits@EnergizedArrows: ^EnergizedArrows
	Inherits@NanoTechRepairs: ^NanoTechRepairs
	Inherits@eject: ^AircraftEjectOnDeath
	Buildable:
		Queue: Aircraft, RAAircraft
		BuildPaletteOrder: 30
		Prerequisites: ~modraafld
		Description: actor-yak.description
	Valued:
		Cost: 1200
	Tooltip:
		Name: Zero Fighter
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	Health:
		HP: 30000
	Repairable:
		HpPerStep: 1500
	ChangesHealth@SelfHealing:
		Step: 30
	Armament@Missiles:
		Weapon: ZeroFighterArrows
		LocalOffset: 85,-300,-85, 85,300,-85
		MuzzleSequence: muzzle
		AmmoUsage: 6
		PauseOnCondition: ammo < 6
		RequiresCondition: !up_energizedarrows
	Armament@MissilesUpgrade:
		Weapon: ZeroFighterArrowsEnergized
		LocalOffset: 85,-300,-85, 85,300,-85
		MuzzleSequence: muzzle
		AmmoUsage: 6
		PauseOnCondition: ammo < 6
		RequiresCondition: up_energizedarrows
	Armament@PRIMARY:
		Weapon: ZeroFighterChainGun
		LocalOffset: 256,213,0, 256,-213,0
		MuzzleSequence: muzzle
		PauseOnCondition: ammo < 6
		RequiresCondition: !up_waveforcebullets
	Armament@Upgrade: ##########
		Weapon: ZeroFighterChainGunWaveforce
		LocalOffset: 256,213,0, 256,-213,0
		MuzzleSequence: muzzle
		PauseOnCondition: ammo < 6
		RequiresCondition: up_waveforcebullets
	FirepowerMultiplier@DualWeapon:
		Modifier: 50
	AttackAircraft:
		FacingTolerance: 40
	Aircraft:
		TurnSpeed: 12
		Speed: 175
	SelectionDecorations:
	WithMuzzleOverlay:
	Contrail:
		Offset: -1000,0,250
	SpawnActorOnDeath:
		Actor: modkami.Husk
	EjectOnDeath:
		PilotActor: RAJE1
	LeavesTrails:
		Offsets: -1000,0,250
		MovingInterval: 2
		Image: smokey
		StationaryInterval: 2
		SpawnAtLastPosition: False
		TrailWhileStationary: True
		Type: CenterPosition
		RequiresCondition: enable-smoke
	Selectable:
		DecorationBounds: 1280, 1280
	Voiced:
		VoiceSet: JapaneseVehicleVoice
	RenderSprites:
		Image: modkami
	AmmoPool:
		Ammo: 24
		AmmoCondition: ammo
	ReloadAmmoPool:
		Delay: 11
		Count: 1
	WithAmmoPipsDecoration:
		Position: BottomLeft
		RequiresSelection: True
		PipCount: 6
	GrantConditionOnDamageState@SmokeTrail:
		Condition: enable-smoke
	ActorStatValues:
		Upgrades: up_waveforcebullets, up_divinewindprotocol, up_energizedarrows, up_nanotechrepairs

