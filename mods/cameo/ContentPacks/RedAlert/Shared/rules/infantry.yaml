ra_cons_molo:
	Inherits: ^Soldier
	Inherits@anim: ^RA2Infantry
	Inherits@Template: ^GrenadierInfantryTemplate
	Inherits@FireInfantry: ^FireInfantry
	Inherits@exp: ^GainsExperienceRA
	Inherits@AUTOTARGET: ^AutoTargetGroundAssaultMove
	Inherits@DECORATIONS: ^InfantryExperienceHospitalHazmatOverrides
	Inherits@AntiInf: ^PrioritizeInfantry
	Inherits@AntiBuil: ^PrioritizeBuilding
	Inherits@VengeanceUpgradeRA1: ^VengeanceUpgradeRA1
	Inherits@SuperOpticsPromotionRA1: ^SuperOpticsPromotionRA1
	Tooltip:
		Name: Molotov Conscript
	Valued:
		Cost: 200
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	Buildable:
		BuildPaletteOrder: 25
		Prerequisites: ~disabled
		Queue: Infantry, RAInfantry
		Description: actor-e2.description
	Mobile:
		Speed: 67
	Health:
		HP: 11000
	ChangesHealth@SelfHealing:
		Step: 11
	Armament:
		Weapon: ConscriptMolotov
		LocalOffset: 0,0,427
		FireDelay: 7
	Armament@GARRISONED:
		Name: garrisoned
		Weapon: ConscriptMolotov
	TakeCover:
		ProneOffset: 180,0,-200
	WithInfantryBody@PARACHUTE:
		StandSequences: parachute
		RequiresCondition: parachute
	FireWarheadsOnDeath:
		Weapon: ConscriptMolotovExplode
	FireWarheadsOnDeath@Vengeance1:
		Weapon: VengeanceActivator1
		RequiresCondition: !up_vengeance.soviet
	FireWarheadsOnDeath@Vengeance2:
		Weapon: VengeanceActivator2
		RequiresCondition: up_vengeance.soviet && !upsubliminal2
	FireWarheadsOnDeath@Vengeance3:
		Weapon: VengeanceActivator3
		RequiresCondition: up_vengeance.soviet && upsubliminal2
	WithDeathAnimation:
		DeathSequencePalette: player_rgba
	Voiced:
		VoiceSet: RussianConscriptVoice
	AttackFrontal:
		Voice: Attack
	RenderSprites:
		PlayerPalette: player_rgba
	ActorStatValues:
		Upgrades: up_promotion_superoptics.soviet, up_doctrine_conscription.soviet, up_vengeance.soviet, up_menofsteel.soviet

