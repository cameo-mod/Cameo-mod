		RequiresCondition: !ra1_soviets_upgrade_vengeance
	FireWarheadsOnDeath@Vengeance2:
		Weapon: VengeanceActivator2
		RequiresCondition: ra1_soviets_upgrade_vengeance && !upsubliminal2
	FireWarheadsOnDeath@Vengeance3:
		Weapon: VengeanceActivator3
		RequiresCondition: ra1_soviets_upgrade_vengeance && upsubliminal2
	WithDeathAnimation:
		DeathSequencePalette: player_rgba
	Voiced:
		VoiceSet: RussianConscriptVoice
	AttackFrontal:
		Voice: Attack
	RenderSprites:
		PlayerPalette: player_rgba
	ActorStatValues:
		Upgrades: ra1_soviets_promotion_infantrysuperoptics, ra1_soviets_doctrine_conscription, ra1_soviets_upgrade_vengeance, ra1_soviets_upgrade_menofsteel

