		Name: Molotov Conscript
	Valued:
		Cost: 200
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	Buildable:
		BuildPaletteOrder: 25
		Prerequisites: ~disabled
		Queue: Infantry, RAInfantry
		Description: actor_e2.description
	Mobile:
		Speed: 67
	Health:
		HP: 11000
	ChangesHealth@SelfHealing:
		Step: 11
	Armament:
		Weapon: ConscriptMolotov
		LocalOffset: 0,0,427
		FireDelay: 7
	Armament@GARRISONED:
		Name: garrisoned
		Weapon: ConscriptMolotov
	TakeCover:
		ProneOffset: 180,0,-200
