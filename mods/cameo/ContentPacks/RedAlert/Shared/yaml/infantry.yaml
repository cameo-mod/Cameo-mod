ra1_allies_rifleinfantry:
	Inherits: ^ra1_allies_rifleinfantry
	Inherits@AdvancedRadarSystems: ^AdvancedRadarSystems
	Inherits@InfantryArmorPlating: ^InfantryArmorPlating
	Inherits@LaserTargetingSystems: ^LaserTargetingSystems
	Inherits@CryoMissiles: ^CryoMissiles
	Buildable:
		Prerequisites: ~ra1_allies_alliedbarracks
		Description: Basic infantry unit.\n  Strong vs Infantry\n  Weak vs Vehicles
	Armament@PRIMARY: ##########
		Weapon: M1Carbine
		LocalOffset: 128,0,256
		RequiresCondition: !ra1_allies_upgrade_cryomissiles
	Armament@GARRISONED: ##########
		Name: garrisoned
		Weapon: M1Carbine
		MuzzleSequence: garrison-muzzle
		RequiresCondition: !ra1_allies_upgrade_cryomissiles
	Armament@Upgrade: ##########
		Weapon: CryoM1Carbine
		LocalOffset: 128,0,256
		RequiresCondition: ra1_allies_upgrade_cryomissiles
	Armament@UpgradeGARRISONED: ##########
		Name: garrisoned
		Weapon: CryoM1Carbine
		MuzzleSequence: garrison-muzzle
		RequiresCondition: ra1_allies_upgrade_cryomissiles
	ActorStatValues:
		Upgrades: ra1_allies_upgrade_advancedradarsystems, ra1_allies_upgrade_infantryarmorplating, ra1_allies_upgrade_lasertargetingsystems, ra1_allies_upgrade_cryomissiles, ra1_allies_upgrade_gpssatellitesupport

ra1_soviets_molotovconscript:
	Inherits: ^Soldier
	Inherits@anim: ^RA2Infantry
	Inherits@Template: ^GrenadierInfantryTemplate
	Inherits@FireInfantry: ^FireInfantry
	Inherits@exp: ^GainsExperienceRA
	Inherits@AUTOTARGET: ^AutoTargetGroundAssaultMove
	Inherits@DECORATIONS: ^InfantryExperienceHospitalHazmatOverrides
	Inherits@AntiInf: ^PrioritizeInfantry
	Inherits@AntiBuil: ^PrioritizeBuilding
	Inherits@VengeanceUpgradeRA1: ^VengeanceUpgradeRA1
	Inherits@SuperOpticsPromotionRA1: ^SuperOpticsPromotionRA1
