ra1_allies_chronovortex:
	Inherits: ^RiftBase
	EditorOnlyTooltip:
		Name: (ra1_allies_chronovortex)
	RenderSprites:
		Image: vortexanim
		Palette: ra_temperat
	PeriodicExplosion:
		Weapon: ra1_allies_chronovortex
	KillsSelf:
		Delay: 425
	# required for spawning actor on death
	Health:
		HP: 1
	WithSpriteBody:
		StartSequence: spawn
	AmbientSound:
		SoundFiles: rift1.aud, rift2.aud, rift3.aud
		Interval: 50
	SpawnActorOnDeath:
		Actor: ra1_allies_chronovortexfade
		SkipMakeAnimations: false
	RevealsShroud:
		Range: 10000
		Type: CenterPosition

ra1_allies_chronovortexfade:
	Inherits: ra1_allies_chronovortex
	WithSpriteBody:
		Sequence: dead
	WithMakeAnimation:
		Sequence: fade
	KillsSelf:
		Delay: 25
	-SpawnActorOnDeath:
	-PeriodicExplosion:
	-AmbientSound:

