		DefaultAttackSequence: shoot
	Cloak:
	RenderSprites:
		Image: e1sniper
		PlayerPalette: playerra
	WithDeathAnimation:
		DeathSequencePalette: raplayer
	-MustBeDestroyed:
	ActorStatValues:
		Upgrades: up_advancedradarsystems, up_infantryarmorplating, up_lasertargetingsystems, up_cryomissiles, up_gpssatellitesupport

