		Image: badr
	ActorStatValues:
		Upgrades: up_doctrine_heavyarmor.soviet, up_afterburners.soviet, up_stalinium.soviet

YAK:
	Inherits: ^RANeutralPlane
	Inherits@Template: ^FighterTemplate
	Inherits@exp: ^GainsExperienceRA
	Inherits@AUTOTARGET: ^AutoTargetAllAssaultMove
	Inherits@AntiInf: ^PrioritizeInfantry
	Inherits@AntiAir: ^PrioritizeAir
	Inherits@HeavyArmorDoctrineRA1: ^HeavyArmorDoctrineRA1
	Inherits@IncendiaryBulletsUpgradeRA1: ^IncendiaryBulletsUpgradeRA1
	Inherits@StaliniumTeamUpgradeRA1: ^StaliniumTeamUpgradeRA1
	Inherits@eject: ^AircraftEjectOnDeath
	Buildable:
		Queue: Aircraft, RAAircraft
		BuildPaletteOrder: 30
		Prerequisites: ~raafld, ~!up_yaktesla.soviet, ~!up_yakarmored.soviet, ~!up_yaknuclear.soviet
		Description: actor-yak.description
	Valued:
		Cost: 800
	Tooltip:
		Name: Yak Scout Plane
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	Health:
		HP: 32000
	Repairable:
		HpPerStep: 1600
	ChangesHealth@SelfHealing:
		Step: 32
	Armament@BOMBS:
		Weapon: YakNapalm
		LocalOffset: 0,-256,-32, 0,256,-32
		AmmoUsage: 4
		PauseOnCondition: ammo < 4
	Armament@PRIMARY:
		Weapon: YakChainGun
		LocalOffset: 256,-213,0
		MuzzleSequence: muzzle
		PauseOnCondition: ammo < 4
		RequiresCondition: !up_incendiarybullets.soviet
	Armament@SECONDARY:
		Name: secondary
		Weapon: YakChainGun
		LocalOffset: 256,213,0
		MuzzleSequence: muzzle
		PauseOnCondition: ammo < 4
		RequiresCondition: !up_incendiarybullets.soviet
	Armament@Upgrade1:
		Weapon: IncendiaryYakChainGun
		LocalOffset: 256,-213,0
		MuzzleSequence: muzzle
		PauseOnCondition: ammo < 4
		RequiresCondition: up_incendiarybullets.soviet
	Armament@Upgrade2:
		Name: secondary
		Weapon: IncendiaryYakChainGun
		LocalOffset: 256,213,0
		MuzzleSequence: muzzle
		PauseOnCondition: ammo < 4
		RequiresCondition: up_incendiarybullets.soviet
	FirepowerMultiplier@DualWeapon:
		Modifier: 25
	AttackAircraft:
		FacingTolerance: 100
	Aircraft:
		TurnSpeed: 11
		Speed: 170
	SelectionDecorations:
	WithMuzzleOverlay:
	Contrail:
		Offset: -853,0,0
	SpawnActorOnDeath:
		Actor: YAK.Husk
	EjectOnDeath:
		PilotActor: RAE2
	LeavesTrails:
		Offsets: -853,0,0
		MovingInterval: 2
		Image: smokey
		StationaryInterval: 2
		SpawnAtLastPosition: False
		TrailWhileStationary: True
		Type: CenterPosition
		RequiresCondition: enable-smoke
	Selectable:
		DecorationBounds: 1280, 1280, 0, 128
	Voiced:
		VoiceSet: RussianVehicleVoice
	AmmoPool:
		Ammo: 64
		AmmoCondition: ammo
	ReloadAmmoPool:
		Delay: 8
		Count: 1
	WithAmmoPipsDecoration:
		Position: BottomLeft
		RequiresSelection: True
		PipCount: 8
	GrantConditionOnDamageState@SmokeTrail:
		Condition: enable-smoke
	RenderSprites:
		PlayerPalette: raplayer
	ActorStatValues:
		Upgrades: up_doctrine_heavyarmor.soviet, up_incendiarybullets.soviet, up_stalinium.soviet

