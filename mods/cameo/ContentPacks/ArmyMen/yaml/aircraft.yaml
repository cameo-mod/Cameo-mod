army_helicopter:
	Inherits: ^Helicopter
	Inherits@Template: ^HelicopterTemplate
	Inherits@exp: ^GainsExperienceRA
	Inherits@AUTOTARGET: ^AutoTargetGroundAssaultMove
	Inherits@AntiInf: ^PrioritizeInfantry
	Inherits@AntiAir: ^PrioritizeAir
	Inherits@eject: ^AircraftEjectOnDeath
	Buildable:
		BuildPaletteOrder: 20
		Prerequisites: ~army_garage_lvl2
		Queue: Aircraft, RAAircraft, Vehicle, RAVehicle
		Description: actor_mh60.description
	Valued:
		Cost: 1000
	Tooltip:
		Name: Chopper
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	Health:
		HP: 50000
	Repairable:
		HpPerStep: 2500
	ChangesHealth@SelfHealing:
		Step: 20
	Armament@PRIMARY:
		Weapon: armymen_chopper_chaingun
		LocalOffset: 85,-213,-85, 85,213,-85
		MuzzleSequence: muzzle
		PauseOnCondition: !ammo
	Armament@SECONDARY:
		Name: secondary
		Weapon: armymen_chopper_chaingun
		LocalOffset: 85,213,-85, 85,-213,-85
		MuzzleSequence: muzzle
		PauseOnCondition: !ammo
	# FirepowerMultiplier@DualWeapon:
		# Modifier: 25
	AttackAircraft:
		FacingTolerance: 10
		AttackType: Hover
	Aircraft:
		TurnSpeed: 26
		Speed: 130
	WithIdleOverlay@ROTORAIR:
		Sequence: rotor
		RequiresCondition: airborne
		PauseOnCondition: disabled
	WithIdleOverlay@ROTORGROUND:
		Sequence: slow-rotor
		RequiresCondition: !airborne
		PauseOnCondition: disabled
	SelectionDecorations:
	WithMuzzleOverlay:
	SpawnActorOnDeath:
		Actor: army_helicopter.Husk
	EjectOnDeath:
		PilotActor: army_grunt
	LeavesTrails:
		Offsets: -427,0,0
		Image: smokey
		MovingInterval: 3
		StationaryInterval: 3
		SpawnAtLastPosition: False
		TrailWhileStationary: True
		Type: CenterPosition
		RequiresCondition: enable-smoke
	Selectable:
		DecorationBounds: 1440, 1440
	Voiced:
		VoiceSet: Armymen_Chopper
	Parachutable:
		FallRate: 20
		KilledOnImpassableTerrain: true
		GroundCorpseSequence:
		GroundCorpsePalette:
		WaterImpactSound: splash9.aud
		WaterCorpseSequence: small_splash
		ParachutingCondition: parachute
	WithParachute:
		ShadowImage: parach_shadow
		ShadowSequence: idle
		Image: parach
		Sequence: idle
		OpeningSequence: open
		Offset: 0,0,427
		RequiresCondition: parachute
	GrantConditionOnDamageState@SmokeTrail:
		Condition: enable-smoke
	AmmoPool:
		Ammo: 6
		AmmoCondition: ammo
	ReloadAmmoPool:
		Delay: 6
		Count: 1
	WithAmmoPipsDecoration:
		Position: BottomLeft
		RequiresSelection: True
		PipCount: 6
	RenderSprites:
		PlayerPalette: player_rgba
army_helicopter.Husk:
	Inherits: ^LargeHelicopterHusk
	Tooltip:
		Name: Chopper
	Aircraft:
		TurnSpeed: 20
		Speed: 140
	RenderSprites:
		Image: army_helicopter
		PlayerPalette: player_rgba
