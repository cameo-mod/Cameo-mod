army_barracks:
	Inherits: ^ArmymenBuilding
	Inherits@shape: ^3x2Shape
	Inherits@ra1_soviets_barracks: ^IsBarrack
	Inherits@plug: ^BuildingPlugProducer
	Tooltip:
		Name: Soldier Mold Facility
	Buildable:
		Prerequisites: ~army_hq
		Description: Trains infantry units.
	Building:
		Footprint: xxx xxx ===
		Dimensions: 3,3
		LocalCenterOffset: 0,-512,0
	RallyPoint:
		Path: 0,2
	Exit@1:
		SpawnOffset: -700,800,0
		ExitCell: 0,2
	Exit@2:
		SpawnOffset: 100,1200,0
		ExitCell: 1,3
	SelectionDecorations:
	GivesBuildableArea:
		AreaTypes: building, cityi
	WithDeathAnimation:
		DeathSequencePalette: playerra2
		DeathPaletteIsPlayerPalette: true
	Power:
		Amount: 0
	WithIdleOverlay@upgraded:
		Sequence: idle-upgraded
		RequiresCondition: upgraded
	WithProductionDoorOverlay:
		RequiresCondition: !upgraded && !build-incomplete
		Sequence: build-door
	WithProductionDoorOverlay@upgraded:
		RequiresCondition: upgraded
		Sequence: build-door-upgraded
	Pluggable:
		Offset: 0,0
		Conditions:
			army_barracks_upgrade_lvl2: upgraded
		Requirements:
			army_barracks_upgrade_lvl2: !build-incomplete && !army_barracks_upgrade_lvl2
	ProvidesPrerequisite@lvl2:
		Prerequisite: army_barracks_upgrade_lvl2_available
		RequiresCondition: !upgraded
	ProvidesPrerequisite@army_barracks_lvl2:
		Prerequisite: army_barracks_lvl2
		RequiresCondition: upgraded


army_barracks_upgrade_lvl2:
	Inherits: ^BuildingPlug
	Tooltip:
		Name: Barracks Lvl2
