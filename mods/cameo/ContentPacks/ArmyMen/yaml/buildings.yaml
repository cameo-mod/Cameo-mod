^ArmymenBuilding:
	Inherits@BB: ^BaseBuilding
	RenderSprites:
		PlayerPalette: player_rgba
	WithDeathAnimation:
		DeathSequencePalette: player_rgba
	Building:
		BuildSounds: uplace.wav
		UndeploySounds: uselbuil.wav
	SoundOnDamageTransition:
		DamagedSounds: gdamag1a.wav, gdamag1b.wav, gdamag1c.wav, gdamag1d.wav, gdamag1e.wav
		DestroyedSounds: bgendiea.wav, bgendieb.wav, bgendiec.wav, bgendied.wav, bgendiee.wav, bgendief.wav


army_hq:
	Inherits: ^ArmymenBuilding
	Inherits@conyard: ^Conyard
	Inherits@shape: ^4x3Shape
	Inherits@plug: ^BuildingPlugProducer
	Tooltip:
		Name: Army Men Headquarters
	Building:
		Footprint: xxxx xxxx xxxx
		Dimensions: 4,3
	Transforms:
		IntoActor: army_dozer
		Offset: 1,1
		Facing: 432
	WithIdleOverlay@lvl2:
		Sequence: idle-lvl2
		RequiresCondition: army_hq_upgrade_lvl2 && !army_hq_upgrade_lvl3
	WithIdleOverlay@lvl3:
		Sequence: idle-lvl3
		RequiresCondition: army_hq_upgrade_lvl3
	Exit@1:
		SpawnOffset: 213,-128,0
		ExitCell: 1,2
	ProvidesPrerequisite@lvl2:
		Prerequisite: army_hq_upgrade_lvl2_available
		RequiresCondition: !army_hq_upgrade_lvl2
	ProvidesPrerequisite@lvl3:
		Prerequisite: army_hq_upgrade_lvl3_available
		RequiresCondition: army_hq_upgrade_lvl2 && !army_hq_upgrade_lvl3
	ProvidesPrerequisite@army_hq_lvl2:
		Prerequisite: army_hq_lvl2
		RequiresCondition: army_hq_upgrade_lvl2
	ProvidesPrerequisite@army_hq_lvl2_3:
		Prerequisite: army_hq_lvl2
		RequiresCondition: army_hq_upgrade_lvl3
	ProvidesPrerequisite@army_hq_lvl3:
		Prerequisite: army_hq_lvl3
		RequiresCondition: army_hq_upgrade_lvl3
	Pluggable:
		Offset: 0,0
		Conditions:
			army_hq_upgrade_lvl2: army_hq_upgrade_lvl2
			army_hq_upgrade_lvl3: army_hq_upgrade_lvl3
		Requirements:
			army_hq_upgrade_lvl2: !build-incomplete && !army_hq_upgrade_lvl2
			army_hq_upgrade_lvl3: !build-incomplete && !army_hq_upgrade_lvl3 && army_hq_upgrade_lvl2
	Power:
		Amount: 100
	Voiced:
		VoiceSet: Armymen_HQ
army_hq_upgrade_lvl2:
	Inherits: ^BuildingPlug
	Tooltip:
		Name: HQ Lvl2
	Valued:
		Cost: 1000
	Buildable:
		BuildPaletteOrder: 80
		Queue: BuildingAddons
		Prerequisites: ~army_hq, army_barracks, army_garage
		Description: Unlocks Tier 2 Buildings
	Plug:
		Type: army_hq_upgrade_lvl2
	RenderSprites:
		Image: army_hq_lvl2

army_hq_upgrade_lvl3:
	Inherits: ^BuildingPlug
	Tooltip:
		Name: HQ Lvl3
	Valued:
		Cost: 2500
	Buildable:
		BuildPaletteOrder: 80
		Queue: BuildingAddons
		Prerequisites: ~army_hq, army_hq_upgrade_lvl3_available, army_barracks_lvl2, army_garage_lvl2
		Description: Unlocks Advanced Tech
	Plug:
		Type: army_hq_upgrade_lvl3
	RenderSprites:
		Image: army_hq_lvl3


