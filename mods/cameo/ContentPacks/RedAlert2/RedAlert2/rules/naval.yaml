ra2sqd:
	Inherits: ^SeaCreature
	Inherits@Template: ^ScoutShipTemplate
	Inherits@EXPERIENCE: ^GainsExperienceRA2
	Inherits@AUTOTARGET: ^AutoTargetGroundAssaultMove
	Inherits@sub: ^Submarine
	Inherits@vo: ^AttackFrontalVoice
	Valued:
		Cost: 1000
	Tooltip:
		Name: actor-sqd.name
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	Buildable:
		BuildPaletteOrder: 80
		Prerequisites: ~yrygyard
		Queue: Naval, RANaval
		Description: actor-sqd.description
	Mobile:
		Speed: 120
		TurnSpeed: 48
	Health:
		HP: 30000
	ChangesHealth@SelfHealing:
		Step: 12
	Armor:
		Type: Medium
	Turreted:
		TurnSpeed: 24
		Offset: 512,0,0
	Armament@PRIMARY:
		Weapon: SquidPunch
		LocalOffset: 208,0,48
	Armament@SECONDARY:
		Name: secondary
		Weapon: SquidGrab
		LocalOffset: 208,0,48
	AttackFrontal:
		FacingTolerance: 2
	AutoTarget:
		ScanRadius: 10
		InitialStance: AttackAnything
	AutoTargetPriority@SQUIDGRAB:
		ValidTargets: SquidGrab
		Priority: 10
	DeliversCash:
		Payload: 250
	Cloak@underwater:
		CloakDelay: 75
		CloakSound: vnavupa.wav
		UncloakSound: vnavupa.wav
	Targetable:
		TargetTypes: Ground, Water, Ship, Submarine, Squid, Infantry
	WithInfantryBody:
		MinIdleDelay: 1
		MaxIdleDelay: 2
		DefaultAttackSequence: shoot
		IdleSequences: idle
		StandSequences: stand
	AttackFrontal:
	InfectorOld:
		ArmamentNames: secondary
		Damage: 1000
		DamageInterval: 1
		DamageTypes: DefaultDeath
		DamageSounds: gexpwama.wav, gexpwamb.wav
		KillState: Critical
		Voice: Attack
		StartSequence: grabing
		Sequence: grab
		Palette: playerra2
		IsPlayerPalette: true
	Voiced:
		VoiceSet: GiantSquidVoice
	DeathSounds:
	RenderSprites:
		PlayerPalette: playerra2

