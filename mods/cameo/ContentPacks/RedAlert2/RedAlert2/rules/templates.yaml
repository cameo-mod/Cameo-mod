^RA2YuriChaosGasEmitters:
	Inherits@EnemyInProximity: ^EnemyInProximity
	SpeedMultiplier@ra2_yuri_upgrade_chaosgasemitters1:
		Modifier: 110
		RequiresCondition: ra2_yuri_upgrade_chaosgasemitters && EnemyInProximity
	SpeedMultiplier@ra2_yuri_upgrade_chaosgasemitters2:
		Modifier: 105
		RequiresCondition: ra2_yuri_upgrade_chaosgasemitters && !EnemyInProximity
	DamageMultiplier@ra2_yuri_upgrade_chaosgasemitters1:
		Modifier: 90
		RequiresCondition: ra2_yuri_upgrade_chaosgasemitters && EnemyInProximity
	DamageMultiplier@ra2_yuri_upgrade_chaosgasemitters2:
		Modifier: 95
		RequiresCondition: ra2_yuri_upgrade_chaosgasemitters && !EnemyInProximity
	FireWarheads@Tesla:
		Weapons: RA2Dronegas
		Interval: 1
		RequiresCondition: chaosgasemitters && !chaosgasemitterscooldown && EnemyInMaxProximity
	GrantTimedCondition@chaosgasemitterscooldown:
		RequiresCondition: chaosgasemitters
		PauseOnCondition: !chaosgasemitters
		Condition: chaosgasemitterscooldown
		Duration: 5
	GrantConditionOnDamage@chaosgasemitters:
		RequiresCondition: ra2_yuri_upgrade_chaosgasemitters && !disabled
		Condition: chaosgasemitters
		Duration: 10
		PlayerRelationship: Ally, Neutral, Enemy
	ChangesPhysicalState@chaosgasemitters:
		PhysicalStateName: EnemyProximity
		Amount: -10000
		Delay: 1
		RequiresCondition: chaosgasemitters && !chaosgasemitterscooldown && EnemyInMaxProximity
	PhysicalStateBar@EnemyProximity:
		RequiresCondition: ra2_yuri_upgrade_chaosgasemitters
	WithPhysicalStateColoredOverlay@EnemyProximity:
		RequiresCondition: ra2_yuri_upgrade_chaosgasemitters
	GrantConditionOnPrerequisite@ra2_yuri_upgrade_chaosgasemitters:
		Condition: ra2_yuri_upgrade_chaosgasemitters
		Prerequisites: ra2_yuri_upgrade_chaosgasemitters
	ActorStatValues:
		Upgrades: ra2_yuri_upgrade_chaosgasemitters

^RA2YuriPsionicShields:
	Inherits@EnemyInProximity: ^EnemyInProximity
	DamageMultiplier@ra2_yuri_upgrade_psionicshields:
		Modifier: 75
		RequiresCondition: ra2_yuri_upgrade_psionicshields
	Armor@shielded:
		Type: Shield
		RequiresCondition: shielded
	GrantCondition@shieldpermanent:
		Condition: shieldpermanent
		RequiresCondition: ra2_yuri_upgrade_psionicshields
	Shielded:
		DamageRegenDelay: 125
		RegenAmount: 10
		RegenInterval: 1
		ShieldsUpCondition: shielded
		SelectionBarColor: 8888FFFF
		RequiresCondition: !disabled && ((ra2_yuri_upgrade_psionicshields && EnemyInProximity) || shieldgen || shielded)
	ChangesShield@shielddischarge:
		Delay: 10
	GrantTimedCondition@supershielded:
		Condition: supershielded
		Duration: 40
		RevokeAfterDurationOnly: true
		RequiresCondition: AlliedShieldFull
	ChangesPhysicalState@AlliedShieldDeplete:
		PhysicalStateName: AlliedShield
		Amount: -10000
		Delay: 1
		RequiresCondition: AlliedShieldFull && !supershielded
	GrantConditionOnPhysicalState@AlliedShieldFull:
		PhysicalStateName: AlliedShield
		Condition: AlliedShieldFull
		UpperValue: 10000
		LowerValue: 10000
	WithRangeCircle@psionicshielded:
		Range: 5000
		Color: 0000FF88
		RequiresCondition: psionicshielded || supershielded
	PhysicalStateAura@AlliedShield:
		PhysicalStateName: AlliedShield
		Range: 5000
		AmountPerTick: 250
		Interval: 1
		ValidRelationships: Ally
		RequiresCondition: ra2_yuri_upgrade_psionicshields && EnemyInProximity
	PhysicalStateAura@psionicshielded:
		PhysicalStateName: AlliedShield
		Range: 5000
		AmountPerTick: 500
		Interval: 1
		ValidRelationships: Ally
		RequiresCondition: psionicshielded
	GrantTimedCondition@shieldedcooldown:
		Condition: shieldedcooldown
		Duration: 40
		RevokeAfterDurationOnly: true
		RequiresCondition: psionicshields && !psionicshieldscooldown && EnemyInMaxProximity
	GrantTimedCondition@psionicshielded:
		Condition: psionicshielded
		Duration: 40
		RevokeAfterDurationOnly: true
		RequiresCondition: psionicshields && !psionicshieldscooldown && !shieldedcooldown && EnemyInMaxProximity
	GrantTimedCondition@psionicshieldscooldown:
		RequiresCondition: psionicshields
		PauseOnCondition: !psionicshields
		Condition: psionicshieldscooldown
		Duration: 5
	GrantConditionOnDamage@psionicshields:
		RequiresCondition: ra2_yuri_upgrade_psionicshields && !disabled
		Condition: psionicshields
		Duration: 10
		PlayerRelationship: Ally, Neutral, Enemy
	ChangesPhysicalState@psionicshields:
		PhysicalStateName: EnemyProximity
		Amount: -10000
		Delay: 1
		RequiresCondition: psionicshields && !psionicshieldscooldown && EnemyInMaxProximity
	PhysicalStateBar@EnemyProximity:
		RequiresCondition: ra2_yuri_upgrade_psionicshields
	WithPhysicalStateColoredOverlay@EnemyProximity:
		RequiresCondition: ra2_yuri_upgrade_psionicshields
	GrantConditionOnPrerequisite@ra2_yuri_upgrade_psionicshields:
		Condition: ra2_yuri_upgrade_psionicshields
		Prerequisites: ra2_yuri_upgrade_psionicshields
	ActorStatValues:
		Upgrades: ra2_yuri_upgrade_psionicshields

^RA2YuriGatlingPower:
	GrantConditionOnAttack@gatling:
		Condition: gatling
		ArmamentNames: primary, garrisoned
		RequiredShotsPerInstance: 12, 24
		MaximumInstances: 2
		RevokeDelay: 25
		RevokeAll: false
		IsCyclic: false
		RevokeOnNewTarget: false
		RequiresCondition: !rank-elite
	GrantConditionOnAttack@elitegatling:
		Condition: gatling
		ArmamentNames: primary, garrisoned
		RequiredShotsPerInstance: 6, 12
		MaximumInstances: 2
		RevokeDelay: 25
		RevokeAll: false
		IsCyclic: false
		RevokeOnNewTarget: false
		RequiresCondition: rank-elite
	FirepowerMultiplier@ra2_yuri_upgrade_gatlingpower:
