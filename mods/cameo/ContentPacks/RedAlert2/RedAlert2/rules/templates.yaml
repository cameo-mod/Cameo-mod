	RangeMultiplier@ra2_yuri_upgrade_gatlingpower:
		Modifier: 110
		RequiresCondition: ra2_yuri_upgrade_gatlingpower
	GrantConditionOnPrerequisite@ra2_yuri_upgrade_gatlingpower:
		Condition: ra2_yuri_upgrade_gatlingpower
		Prerequisites: ra2_yuri_upgrade_gatlingpower

