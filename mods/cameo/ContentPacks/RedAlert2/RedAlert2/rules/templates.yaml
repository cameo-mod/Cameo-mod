		Condition: ionpulseplating
		Duration: 10
		PlayerRelationship: Ally, Neutral, Enemy
	ChangesPhysicalState@ionpulseplating:
		PhysicalStateName: EnemyProximity
		Amount: -10000
		Delay: 1
		RequiresCondition: ionpulseplating && !ionpulseplatingcooldown && !IonPulseDischargeCooldown && EnemyInMaxProximity
