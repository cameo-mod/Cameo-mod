		Weapon: RA2SCUD_rad
		EmptyWeapon: RA2SCUD_rad
		RequiresCondition: ra2_soviets_upgrade_radiationshells && !airborne
	SpawnedExplodes@fire:
		Weapon: RA2SCUD_fire
		EmptyWeapon: RA2SCUD_fire
		RequiresCondition: ra2_soviets_upgrade_fireshells && !airborne
	SpawnedExplodes@tesla:
		Weapon: RA2SCUD_tesla
		EmptyWeapon: RA2SCUD_tesla
		RequiresCondition: ra2_soviets_upgrade_teslashells && !airborne
