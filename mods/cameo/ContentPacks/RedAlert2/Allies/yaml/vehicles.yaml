		Condition: triggered
		RequiresCondition: ifv-demo && !disabled
	KillsSelf@ivan:
		RequiresCondition: ifv-demo && (triggered || invulnerability)
	FireWarheadsOnDeath@ivan:
		Weapon: RA2DemoBomb
		EmptyWeapon: RA2DemoBomb
		RequiresCondition: ifv-demo && !disabled
	###################
	#	Turret Voxel
	###################
	WithSpriteTurret@default:
		Sequence: turret-missile
		RequiresCondition: !ifv-mg && !ifv-hmg && !ifv-repair && !ifv-ra1_allies_alliedsniper && !ifv-flak && !ifv-tesla && !ifv-hero && !ifv-chem && !ifv-fire && !ifv-cannon && !ifv-deso && !ifv-demo && !ifv-chrono && !ifv-plasma && !ifv-litlaser && !ifv-medlaser && !ifv-greelaser && !ifv-misslaser && !ifv-chem && !ifv-thrax && !ifv-sonic && !ifv-fremen && !ifv-healer && !ifv-spy && !ifv-thief
	WithSpriteTurret@mg:
		Sequence: turret-mg
		RequiresCondition: ifv-mg || ifv-hmg || ifv-ra1_allies_alliedsniper || ifv-flak || ifv-hero || ifv-cannon || ifv-plasma || ifv-litlaser || ifv-medlaser || ifv-greelaser || ifv-chem || ifv-fremen || ifv-thief
	WithSpriteTurret@flame:
		Sequence: turret-flame
		RequiresCondition: ifv-chem || ifv-fire
	WithSpriteTurret@engineer:
		Sequence: turret-repair
		RequiresCondition: ifv-repair
	WithSpriteTurret@hitech:
		Sequence: turret-hitech
		RequiresCondition: ifv-chrono || ifv-misslaser || ifv-sonic || ifv-healer || ifv-spy
	WithSpriteTurret@tesla:
		Sequence: turret-tesla
		RequiresCondition: ifv-tesla
	WithSpriteTurret@bomb:
		Sequence: turret-bomb
		RequiresCondition: ifv-demo
	###############
	Tooltip@MG:
		Name: Machine Gun IFV
		RequiresCondition: ifv-mg || ifv-thief
	Tooltip@HMG:
		Name: Heavy Machine Gun IFV
		RequiresCondition: ifv-hmg
	Tooltip@MISS:
		Name: Missile IFV
		RequiresCondition: ifv-miss
	Tooltip@REP:
		Name: Repair IFV
		RequiresCondition: ifv-repair
	Tooltip@SNIPE:
