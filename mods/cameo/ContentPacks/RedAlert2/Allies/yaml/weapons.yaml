	Inherits@xra2roktgun0: ^Warhead_Bullet_Medium
	Inherits@xra2roktgun1: ^Projectile_Bullet_Medium
	Inherits@xra2roktgun2: ^Effect_Bullet_Medium_RA2
	ReloadDelay: 14
	Range: 5000
	Report: irocatta.wav
	ValidTargets: Ground, Water, Air
	Warhead@Bullet_Medium:
		ValidTargets: Ground, Air, Water
		Damage: 2000
	-Warhead@EffectAir:
	# Pinned: this weapon stacks TWO projectile templates, so the hitscan
	# ^Projectile_Bullet_* would take the type and orphan the other one's
	# guidance fields. Keeps today's resolved type verbatim.
	Projectile: Bullet
	Warhead@Bullet_Medium_Flat:
		ValidTargets: Ground, Air, Water
		Damage: 8000
		PercentageScale: 2488
	-Warhead@Bullet_Medium:
	Warhead@LightMissilePercentage: AreaDamagePercentage
	Warhead@Smudge: LeaveSmudge
	Warhead@DuneRock: LeaveSmudge
	Warhead@RA2Crater: LeaveSmudge
	Warhead@DuneSand: LeaveSmudge
	Warhead@SmallArmsPercentage: AreaDamagePercentage
	Warhead@FlakWeaponPercentage: AreaDamagePercentage
	Projectile:
		Arm: 0
		Blockable: false
		AllowSnapping: true
		Shadow: true
		HorizontalRateOfTurn: 40
		VerticalRateOfTurn: 40
		TrailImage: smokey
		TrailInterval: 1
		MaximumLaunchSpeed: 300
		MinimumLaunchSpeed: 300
		Speed: 10000
		CloseEnough: 600
		Acceleration: 4
		HomingActivationDelay: 1
		RangeLimit: 20000
		PointDefenseTypes: Missile
	Warhead@DuneRock:
		SmudgeType: RockCrater
		InvalidTargets: Vehicle, Structure, wall, Husk, Creep
	Warhead@DuneSand:
