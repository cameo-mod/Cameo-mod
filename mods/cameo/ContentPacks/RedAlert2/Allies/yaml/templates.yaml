^RA2AlliedPrismaticBarrier:
	Inherits@EnemyInProximity: ^EnemyInProximity
	GrantTimedCondition@shroudedcooldown:
		Condition: shroudedcooldown
		Duration: 40
		RevokeAfterDurationOnly: true
		RequiresCondition: prismaticbarrier && !prismaticbarriercooldown && EnemyInMaxProximity
	GrantTimedCondition@prismaticbarrier:
		Condition: shrouded
		Duration: 40
		RevokeAfterDurationOnly: true
		RequiresCondition: prismaticbarrier && !prismaticbarriercooldown && !shroudedcooldown && EnemyInMaxProximity
	GrantTimedCondition@prismaticbarriercooldown:
		RequiresCondition: prismaticbarrier
		PauseOnCondition: !prismaticbarrier
		Condition: prismaticbarriercooldown
		Duration: 10
	GrantConditionOnDamage@prismaticbarrier:
		RequiresCondition: ra2_allies_upgrade_prismaticbarrier && !disabled
		Condition: prismaticbarrier
		Duration: 20
		PlayerRelationship: Ally, Neutral, Enemy
	ChangesPhysicalState@prismaticbarrier:
		PhysicalStateName: EnemyProximity
		Amount: -10000
		Delay: 1
		RequiresCondition: prismaticbarrier && !prismaticbarriercooldown && !shroudedcooldown && EnemyInMaxProximity
	PhysicalStateBar@EnemyProximity:
		RequiresCondition: ra2_allies_upgrade_ionpulseplating || ra2_allies_upgrade_prismaticbarrier
	WithPhysicalStateColoredOverlay@EnemyProximity:
		RequiresCondition: ra2_allies_upgrade_ionpulseplating || ra2_allies_upgrade_prismaticbarrier
	GrantConditionOnPrerequisite@ra2_allies_upgrade_prismaticbarrier:
		Condition: ra2_allies_upgrade_prismaticbarrier
		Prerequisites: ra2_allies_upgrade_prismaticbarrier
	ActorStatValues:
		Upgrades: ra2_allies_upgrade_prismaticbarrier

