^RA2Defense:
	Inherits: ^RA2Building
	Inherits: ^BasicDefense
	Inherits@exp: ^GainsExperienceRA2
	WithIdleOverlay@shrouded:
		Image: shrouded_overlay
	-GivesBuildableArea:
	-CommandBarBlacklist:
	-AcceptsDeliveredCash:

^RA2ASpawnActorsOnSell:
