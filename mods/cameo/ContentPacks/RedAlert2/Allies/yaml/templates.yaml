^RA2DefaultWeap:
	Inherits: ^RA2Building
	Inherits@shape: ^4x3Shape
	Inherits@td_gdi_weaponsfactory: ^IsWeaponFactory
	Tooltip:
		Name: War Factory
	Building:
		Footprint: xxxx= xxxx= =xxx=
		Dimensions: 5,3
	RallyPoint:
		Path: 5,2
	Exit@1:
		ExitCell: 4,2
	WithExitOverlay@front:
		Sequence: build-door
		RequiresCondition: !build-incomplete
	WithExitOverlay@top:
		Sequence: build-top
		RequiresCondition: !build-incomplete

