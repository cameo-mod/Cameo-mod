^RA2AlliedChromiumIonPulsePlatings:
	Inherits@EnemyInProximity: ^EnemyInProximity
	DamageMultiplier@ra2_allies_upgrade_ionpulseplating:
		RequiresCondition: ra2_allies_upgrade_ionpulseplating
		Modifier: 90
	GrantTimedCondition@IonPulseDischargeCooldown:
		Condition: IonPulseDischargeCooldown
		Duration: 40
		RevokeAfterDurationOnly: true
		RequiresCondition: ionpulseplating && !ionpulseplatingcooldown && EnemyInMaxProximity
	FireWarheads@IonPulseDischarge:
		Weapons: IonPulseDischarge
		Interval: 125
		RequiresCondition: ionpulseplating && !ionpulseplatingcooldown && !IonPulseDischargeCooldown && EnemyInMaxProximity
	GrantTimedCondition@ionpulseplatingcooldown:
		RequiresCondition: ionpulseplating
		PauseOnCondition: !ionpulseplating
		Condition: ionpulseplatingcooldown
		Duration: 5
	GrantConditionOnDamage@ionpulseplating:
		RequiresCondition: ra2_allies_upgrade_ionpulseplating && !disabled
		Condition: ionpulseplating
		Duration: 10
		PlayerRelationship: Ally, Neutral, Enemy
	ChangesPhysicalState@ionpulseplating:
		PhysicalStateName: EnemyProximity
		Amount: -10000
		Delay: 1
		RequiresCondition: ionpulseplating && !ionpulseplatingcooldown && !IonPulseDischargeCooldown && EnemyInMaxProximity
	PhysicalStateBar@EnemyProximity:
		RequiresCondition: ra2_allies_upgrade_ionpulseplating || ra2_allies_upgrade_prismaticbarrier
	WithPhysicalStateColoredOverlay@EnemyProximity:
		RequiresCondition: ra2_allies_upgrade_ionpulseplating || ra2_allies_upgrade_prismaticbarrier
	GrantConditionOnPrerequisite@ra2_allies_upgrade_ionpulseplating:
		Condition: ra2_allies_upgrade_ionpulseplating
		Prerequisites: ra2_allies_upgrade_ionpulseplating
	ActorStatValues:
		Upgrades: ra2_allies_upgrade_ionpulseplating

