## CABAL missile projectile template. TS-authentic launch (near-vertical,
## replicating Shattered Paradise's 255 = 90 degrees) with a turn rate fast
## enough not to overshoot close targets (DESIGN 3), plus the blue smoke
## trail that carries the CABAL colour identity. Every CABAL missile weapon
## inherits this LAST so its projectile settings win.
^CabalMissile:
	Projectile: Missile
		MinimumLaunchAngle: 255
		MaximumLaunchAngle: 255
		HorizontalRateOfTurn: 80
		VerticalRateOfTurn: 80
		CruiseAltitude: 6000
		TerrainHeightAware: true
		TrailImage: cabal_rockettrail
		TrailInterval: 1
	Warhead@Effect: CreateEffect
		Image: cabal_missileexplosion
		Explosions: idle
		ImpactSounds: expnew12.aud
		ValidTargets: Ground, Ship, Air
