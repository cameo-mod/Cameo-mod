		AmmoCondition: ammo
		ReloadCount: 3
	ReloadAmmoPool:
		Delay: 25
		Count: 1
	SpawnActorOnDeath:
		Actor: cabal_hunterkillermk1_husk
	WithAmmoPipsDecoration:
		Position: BottomLeft
		RequiresSelection: True
		PipCount: 4
	RenderSprites:
		Image: cabal_hunterkillermk1
		PlayerPalette: player_rgba

cabal_hunterkillermk2:
	Inherits: ^Helicopter
	Inherits@Template: ^SpaceshipTemplate
	Inherits@EXPERIENCE: ^GainsExperienceTD
	Inherits@decoration: ^CABALRankDecoration
	Inherits@AUTOTARGET: ^AutoTargetAllAssaultMove
	Inherits@OVERCHARGE: ^cabal_upgrade_overchargedservos
	Valued:
		Cost: 3000
	Tooltip:
		Name: Overkill Fortress
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	Buildable:
		BuildPaletteOrder: 20
		Prerequisites: ~cabal_helipad, cabal_techcenter
		Queue: Aircraft, RAAircraft
		Description: Heavy carrier with drone swarm\nand a big moving laser.\n  Strong vs Vehicles, Buildings\n  Weak vs Infantry, Aircraft
	Aircraft:
		Speed: 50
		TurnSpeed: 10
	Health:
		HP: 300000
	Repairable:
		HpPerStep: 15000
	ChangesHealth@SelfHealing:
		Step: 120
	CarrierMaster:
		ArmamentNames: primary
		Actors: cabal_hunterkillermk2_drone, cabal_hunterkillermk2_drone, cabal_hunterkillermk2_drone
		RearmTicks: 25
		RespawnTicks: 75
		InstaRepair: true
		SlaveDisposalOnKill: KillSlaves
		SpawnAllAtOnce: false
	Armament@drones:
		Name: primary
		Weapon: CabalOverkillDroneLauncher
	Armament@charge:
		Name: charge
		Weapon: CabalOverkillCharge
		LocalOffset: 1500,0,-250
		PauseOnCondition: discharged
	Armament:
		Name: secondary
		Weapon: CabalOverkillLaser
		LocalOffset: 1500,0,-250
		PauseOnCondition: !charged
		ReloadingCondition: discharged
	AmmoPool:
		Armaments: secondary
		Ammo: 100
		InitialAmmo: 0
		AmmoCondition: charged
	ReloadAmmoPoolCA@charged:
		Count: 100
		Delay: 50
		RequiresCondition: charging
	ReloadAmmoPoolCA@discharge:
		Count: -1
		Delay: 1
		RequiresCondition: charged && !charging
	GrantConditionOnAttack@charged:
		Condition: charging
		RequiredShotsPerInstance: 1
		ArmamentNames: charge
		RevokeDelay: 50
		RevokeOnNewTarget: true
	WithAmmoPipsDecoration:
		PipCount: 10
		FullSequence: pip-red
		Position: BottomLeft
		RequiresSelection: true
	Turreted:
	AttackAircraft:
		Armaments: primary, secondary, charge
		Voice: Attack
		FacingTolerance: 40
		PauseOnCondition: disabled
	SelectionDecorations:
	Selectable:
		DecorationBounds: 1536, 1536
	Voiced:
		VoiceSet: TSScrin
	DeathSounds:
		VolumeMultiplier: 2
	SpawnActorOnDeath:
		Actor: cabal_hunterkillermk2_husk
	RenderSprites:
		Image: cabal_hunterkillermk2
		PlayerPalette: player_rgba

