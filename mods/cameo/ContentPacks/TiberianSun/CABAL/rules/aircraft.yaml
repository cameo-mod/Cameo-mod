cabal_overkillcarryall:
	Inherits: ^Helicopter
	Inherits@EXPERIENCE: ^GainsExperienceTD
	Inherits@decoration: ^CABALRankDecoration
	Inherits@AUTOTARGET: ^AutoTargetAllAssaultMove
	Inherits@OVERCHARGE: ^cabal_upgrade_overchargedservos
	Valued:
		Cost: 1750
	Tooltip:
		Name: Overkill Carryall
	Selectable:
		Bounds: 1280, 1024
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	Buildable:
		Queue: Aircraft, RAAircraft
		BuildPaletteOrder: 60
		Prerequisites: ~cabal_helipad
		Description: VTOL aircraft capable of lifting\nand transporting vehicles.\n  Unarmed
	Aircraft:
		TurnSpeed: 29
		Speed: 149
		InitialFacing: 0
		TakeoffSounds: dropup1.aud
		LandingSounds: dropdwn1.aud
		TakeOffOnResupply: true
		CanSlide: false
	Carryall:
		Voice: Move
		LocalOffset: 0,0,-317
		BeforeLoadDelay: 10
		BeforeUnloadDelay: 10
	Health:
		HP: 47500
	Armor:
		Type: Light
	RenderSprites:
	SpawnActorOnDeath:
		Actor: cabal_overkillcarryall_husk
	Voiced:
		VoiceSet: TSHeli
	RenderSprites:
		Image: cabal_overkillcarryall
		PlayerPalette: player_rgba
	Armament@PRIMARY:
		Weapon: TSHunterKillerLasers
		LocalOffset: 0,0,0
	AttackAircraft:
		FacingTolerance: 80
		PersistentTargeting: false
		Voice: Attack
		PauseOnCondition: disabled
		AttackType: Hover

cabal_hunterkillermk2:
	Inherits: ^Helicopter
	Inherits@reload: ^RearmableAircraft
	Inherits@Template: ^BomberTemplate
	Inherits@EXPERIENCE: ^GainsExperienceTD
	Inherits@decoration: ^CABALRankDecoration
	Inherits@AUTOTARGET: ^AutoTargetAllAssaultMove
	Inherits@OVERCHARGE: ^cabal_upgrade_overchargedservos
	Valued:
		Cost: 2400
	Tooltip:
		Name: Hunter Killer MK2
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	Buildable:
		BuildPaletteOrder: 20
		Prerequisites: ~cabal_helipad, cabal_techcenter
		Queue: Aircraft, RAAircraft
		Description: Advanced fighter-bomber craft\nwith twin plasma cannons.\n  Strong vs Buildings, Vehicles\n  Weak vs Infantry, Aircraft
	Aircraft:
		Speed: 145
		TurnSpeed: 29
		TakeoffSounds: orcaup1.aud
		LandingSounds: orcadwn1.aud
		AltitudeVelocity: 128
		CanSlide: false
		TakeOffOnResupply: true
	Health:
		HP: 60000
	Repairable:
		HpPerStep: 3000
	ChangesHealth@SelfHealing:
		Step: 24
	Armament@PRIMARY:
		Weapon: TSHunterKillerLasers
		LocalOffset: 0,0,0
		PauseOnCondition: !ammo
	Armament@PRIMARY2:
		Weapon: TSHellfireTwin
		LocalOffset: 25,-100,0, 25,100,0
		PauseOnCondition: !ammo
	AttackAircraft:
		Voice: Attack
		FacingTolerance: 80
		PersistentTargeting: false
		PauseOnCondition: disabled
	SelectionDecorations:
	Selectable:
		DecorationBounds: 1536, 1536
	Voiced:
		VoiceSet: ts_nod_bansheefighter
	AmmoPool:
		Ammo: 24
		ReloadCount: 4
		AmmoCondition: ammo
	DeathSounds:
		VolumeMultiplier: 2
	SpawnActorOnDeath:
		Actor: cabal_hunterkillermk2_husk
	WithAmmoPipsDecoration:
		Position: BottomLeft
		RequiresSelection: True
		PipCount: 4
	ActorStatValues:
		Upgrades: ts_nod_upgrade_mobilityspecialization, ts_nod_upgrade_advancedtiberiumrefinement
	RenderSprites:
		Image: cabal_hunterkillermk2
		PlayerPalette: player_rgba

