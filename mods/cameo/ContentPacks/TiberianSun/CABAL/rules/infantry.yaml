	Voiced:
		VoiceSet: TSCyborg
	-TemporaryOwnerManager:
	RenderSprites:
		PlayerPalette: playerra2
		Image: tscabalengi
	-TakeCover:
	-DamagedByTerrain:
	-SpawnActorOnDeath:
	Valued:
		Cost: 800
	Health:
		HP: 20000
	Mobile:
		TurnSpeed: 20
		Speed: 50
	ChangesHealth@SelfHealing:
		Step: 20
	Armament@REPAIRBEAM:
		Name: primary
		Weapon: CabalEngineerRepairBeam
