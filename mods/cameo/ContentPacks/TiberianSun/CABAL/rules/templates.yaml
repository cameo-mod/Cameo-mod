^TSCyborgDualArmorHeavy:
	Armor:
		Type: Heavy
	Armor@Secondary:
		Type: Shield

^TSCyborgs:
	Inherits@MC: ^MCImmune
	Inherits@HackableRobot: ^HackableRobot
	Inherits@EMPfrontal: ^FrontalEMP
	Inherits@EMP: ^UnitDisable
	WithInfantryBody:
		RequiresCondition: !cydamaged
		DefaultAttackSequence: attack
	WithInfantryBody@damaged:
		MoveSequence: crippled-run
		DefaultAttackSequence: crippled-attack
		StandSequences: crippled-stand
		RequiresCondition: cydamaged
	Crushable:
		CrushClasses: vehicle
	ExternalCondition@EMP:
		TotalCap: 1
		Condition: empdisable
	TimedConditionBar@EMP:
		Condition: empdisable
		Color: FFFFFF
	GrantCondition@disable:
		RequiresCondition: ReaperTrap || chronobeamed || leaflet || empdisable
	WithColoredOverlay@leaflet:
		RequiresCondition: leaflet || empdisable
	Targetable@HEAL:
		TargetTypes: Heal, Repair, Healing
	Targetable:
		TargetTypes: Ground, Infantry, Cyborg
	GrantConditionOnPrerequisite@MACHINESHOP:
		Condition: hospital
		Prerequisites: machshop

