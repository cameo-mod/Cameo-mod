cabal_radar:
	Inherits: ts_nod_radar
	Buildable:
		Prerequisites: ~cabal_constructionyard, cabal_refinery
	RenderSprites:
		PlayerPalette: playerra2
		Image: cabal_radar
	ProvidesPrerequisite@robotcontrol:
