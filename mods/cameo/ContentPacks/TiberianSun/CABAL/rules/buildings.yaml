cabal_refinery:
	Inherits: ^BaseBuilding
	Inherits@sell: ^TSSpawnActorsOnSell
	Inherits@ref: ^Refinery
	HitShape:
		Type: Rectangle
			TopLeft: -1536, -512
			BottomRight: 1536, 853
	HitShape@TOP:
		Type: Rectangle
			TopLeft: -512, -1450
			BottomRight: 896, -512
	Valued:
		Cost: 1500
	Tooltip:
		Name: CABAL Refinery
	Buildable:
		BuildPaletteOrder: 20
		Prerequisites: ~cabal_constructionyard, cabal_powerplant
		Queue: Building, RABuilding
		Description: Processes raw Tiberium\ninto useable resources
	Building:
		Footprint: _x_ xxx === ===
		Dimensions: 3,4
		LocalCenterOffset: 0,-512,0
	Refinery:
