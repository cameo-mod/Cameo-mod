		AmmoCondition: ammo
	ReloadAmmoPool:
		Delay: 110
		Count: 1
	RenderSprites:
		Image: cabal_plasmasub
		PlayerPalette: player_rgba
	ActorStatValues:
		Upgrades: naxis_upgrade_wunderwaffe

cabal_radar_cruiser:
