	AttackFrontal:
		Voice: Attack
		FacingTolerance: 5
	WithMuzzleOverlay:
	SelectionDecorations:
	Selectable:
		DecorationBounds: 1536, 1536
	DeliversCash:
		Payload: 250
	Voiced:
		VoiceSet: TSCABALVehicles
	RenderSprites:
		Image: cabal_radar_cruiser
		PlayerPalette: player_rgba
	MindControllerCA:
		ArmamentNames: primary
		ExperienceFromControl: 100
		TicksToControl: 125
		TicksToRevoke: 25
		Capacity: 8
		RequiresCondition: !disabled
		ControllingCondition: controlling
	WithRangeCircle@MC:
		Range: 8000
		Type: mindcontrol
		Color: 663399b0
