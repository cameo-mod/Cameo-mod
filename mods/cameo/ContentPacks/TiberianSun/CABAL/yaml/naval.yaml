	Valued:
		Cost: 2500
	Tooltip:
		Name: CABAL Sensor Cruiser
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	Health:
		HP: 200000
	ChangesHealth@SelfHealing:
		Step: 24
	Armor:
		Type: Medium
	Mobile:
		Speed: 60
		TurnSpeed: 24
	Turreted:
		TurnSpeed: 24
		Offset: 512,0,0
	Armament@Anim:
		Weapon: TSCABALempdisable.anim
		RequiresCondition: end_disable == 0
		LocalOffset: -128,0,256
	Armament@End:
		Weapon: TSCABALempdisable.end
		RequiresCondition: end_disable >= 1
		LocalOffset: -128,0,256
