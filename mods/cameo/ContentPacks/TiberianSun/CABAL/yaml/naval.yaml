cabal_lazerboat:
	Inherits: ^BoatUnit
	Inherits@Template: ^ScoutShipTemplate
	Inherits@exp: ^GainsExperienceRA
	Inherits@AUTOTARGET: ^AutoTargetGroundAssaultMove
	Inherits@EMP: ^FrontalEMP
	Inherits@AntiAir: ^PrioritizeAir
	Inherits@REINFORCED: ^CabalUpgradeReinforcedChassis
	Inherits@OVERCHARGE: ^CabalUpgradeOverchargedServosVehicle
	Buildable:
		BuildPaletteOrder: 20
		Prerequisites: ~cabal_navalyard
		Queue: Naval, RANaval
		Description: Siege light boat, attacks air and ground, long range aganist ground, can attack submarines
	Valued:
		Cost: 1500
	Tooltip:
		Name: Laser Boat
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	Health:
		HP: 60000
	ChangesHealth@SelfHealing:
		Step: 24
	Armor:
		Type: Medium
	Mobile:
		Speed: 120
		TurnSpeed: 24
	Turreted:
		TurnSpeed: 24
		Offset: 512,0,0
	Armament@PRIMARY:
		Weapon: CabalLaserBoatLaser
		LocalOffset: 350,-30,250, 350,30,250
		Recoil: 128
		RecoilRecovery: 26
	Armament@AA:
		Weapon: CabalLaserBoatLaserAA
		LocalOffset: 350,-30,250, 350,30,250
		Recoil: 128
		RecoilRecovery: 26
	Armament@SECONDARY:
		Name: secondary
		Weapon: DepthCharge
		MuzzleSequence: muzzle
	AttackFrontal:
		Voice: Attack
		FacingTolerance: 5
	WithMuzzleOverlay:
	SelectionDecorations:
	Selectable:
		DecorationBounds: 1536, 1536
	DeliversCash:
		Payload: 250
	Voiced:
		VoiceSet: TSCABALVehicles
	RenderSprites:
		Image: cabal_lazerboat
		PlayerPalette: player_rgba

cabal_plasmasub:
