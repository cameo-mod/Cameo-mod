	Inherits@AUTOTARGET: ^AutoTargetAllAssaultMove
	Inherits@EMP: ^FrontalEMP
	Inherits@sub: ^Submarine
	Inherits@REINFORCED: ^CabalUpgradeReinforcedChassis
	Inherits@OVERCHARGE: ^CabalUpgradeOverchargedServosVehicle
	Valued:
		Cost: 2500
	Tooltip:
		Name: Plasma Submarine
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	Buildable:
		BuildPaletteOrder: 50
		Prerequisites: ~cabal_navalyard, cabal_radar
		Queue: Naval, RANaval
		Description: actor_ra1_soviets_missilesubmarine.description
	Mobile:
		Speed: 60
		TurnSpeed: 24
	Health:
		HP: 200000
	ChangesHealth@SelfHealing:
		Step: 80
	Armor:
		Type: Medium
	Armament:
		Weapon: CabalSubmarinePlasma
		LocalOffset: 800,200,0, 800,-200,0
	WithMuzzleOverlay:
	Targetable:
		TargetTypes: Ground, Water, Ship, Submarine
	AttackFrontal:
		FacingTolerance: 0
	Selectable:
		DecorationBounds: 1536, 1536
	DeliversCash:
		Payload: 1000
	Cloak@underwater:
		CloakDelay: 100
	Voiced:
		VoiceSet: TSCABALVehicles
	FirepowerMultiplier@BallisticMissileSubBuff:
		Modifier: 200
	FireWarheadsOnDeath:
