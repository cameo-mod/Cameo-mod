ts_gdi_powerplant:
	Inherits: ^BaseBuilding
	Inherits@shape: ^2x2Shape
	Inherits@sell: ^TSSpawnActorsOnSell
	Inherits@power: ^PowerPlant
	Inherits: ^BuildingPlugProducer
	Tooltip:
		Name: GDI Power Plant
	Valued:
		Cost: 500
	Health:
		HP: 150000
	Armor:
		Type: Wood
	Power:
		Amount: 150
	Buildable:
		BuildPaletteOrder: 10
		Queue: Building, RABuilding
		Description: template_power.description
		Prerequisites: ~ts_gdi_constructionyard
	Building:
		Footprint: == xx
		Dimensions: 2,2
	RevealsShroud:
		Range: 4c0
	Selectable:
		Bounds: 2048, 2048
	ScalePowerWithHealth:
	AcceptsDeliveredExperience: ##########
		ValidTypes: building ##########
	WithIdleOverlay@LIGHTS:
		RequiresCondition: !build-incomplete && !disabled
		Sequence: idle-lights
	WithIdleOverlay@PLUG:
		RequiresCondition: !build-incomplete
		PauseOnCondition: disabled
		Sequence: idle-plug
	WithIdleOverlay@PLUG2:
		RequiresCondition: powerupgrade
		PauseOnCondition: disabled
		Sequence: idle-powrupa
	WithIdleOverlay@PLUG3:
		RequiresCondition: powerupgrade
		PauseOnCondition: disabled
		Sequence: idle-powrupb
	ProvidesPrerequisite:
		Prerequisite: gdipowerupgradeavailable
		RequiresCondition: !powerupgrade
	DamageMultiplier@powerupgrade:
		Modifier: 50
		RequiresCondition: powerupgrade
	PowerMultiplier@powerupgrade:
		Modifier: 200
		RequiresCondition: powerupgrade
	Pluggable:
		Offset: 0,0
		Conditions:
			ts_gdi_powerplant: powerupgrade
		Requirements:
			ts_gdi_powerplant: !build-incomplete && !powerupgrade
	ProvidesPrerequisite@buildingname:
	RenderSprites:
		PlayerPalette: playerra2

