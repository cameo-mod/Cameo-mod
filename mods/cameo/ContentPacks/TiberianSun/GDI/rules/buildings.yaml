ts_gdi_constructionyard:
	Inherits: ^BaseBuilding
	Inherits@shape: ^4x3Shape
	Inherits@sell: ^TSSpawnActorsOnSell
	Inherits@conyard: ^Conyard
	Selectable:
		Bounds: 3072, 2048
	Valued:
		Cost: 2500
	Tooltip:
		Name: Construction Yard (GDI)
	Building:
		Footprint: _xx_ xxxx _xx_
		Dimensions: 4,3
		LocalCenterOffset: 0,-512,0
	Health:
		HP: 1000000
	Transforms:
		RequiresCondition: factundeploy
		PauseOnCondition: being-demolished || build-incomplete
		IntoActor: ts_gdi_mobileconstructionvehicle
		Offset: 1,1
		Facing: 432
	TransformsIntoMobile:
		RequiresCondition: factundeploy
		Locomotor: heavywheeled
		RequiresForceMove: true
		RedeployAfterMove: true
	TransformsIntoPassenger:
		RequiresCondition: factundeploy
		CargoType: Vehicle
		RequiresForceMove: true
	TransformsIntoRepairable:
		RequiresCondition: factundeploy
		RepairActors: fix,rafix,2100rr,scshieldbattery,ra2_soviets_servicedepot,ra2_allies_alliedservicedepot,c1fix,c2fix,c1rafix,c2rafix,c12100rr,c22100rr,cscshieldbattery,cra2nadept,cra2gadept ##########
		RequiresForceMove: true
	TransferTimedExternalConditionOnTransform:
		Condition: invulnerability
	GrantConditionOnPrerequisite@GLOBALFACTUNDEPLOY:
		Condition: factundeploy
		Prerequisites: global-factundeploy
	WithProductionOverlay@WELDING:
		RequiresCondition: !build-incomplete
		Queues: Building, Defence, RABuilding, RADefence
		Sequence: build
	BaseProvider:
		Range: 14c0
	ProvidesPrerequisite@tsoilderrick:
		Prerequisite: tsoilderrick
	WithIdleOverlay@TOP:
		RequiresCondition: !build-incomplete
		Sequence: idle-top
	WithIdleOverlay@SIDE:
		RequiresCondition: !build-incomplete
		Sequence: idle-side
	WithIdleOverlay@FRONT:
		RequiresCondition: !build-incomplete
		Sequence: idle-front
	WithBuildingPlacedOverlay:
		RequiresCondition: !build-incomplete
	Selectable:
		Bounds: 3072, 2560, 0, 0
	Power:
		Amount: 0
	ProvidesPrerequisite@buildingname:
	ProvidesPrerequisite@fact.tsgdi:
		Prerequisite: fact.tsgdi
	RenderSprites:
		Image: tsgtcnst
		PlayerPalette: playerra2

