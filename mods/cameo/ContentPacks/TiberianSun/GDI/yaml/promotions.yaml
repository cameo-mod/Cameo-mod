ts_gdi_promotion_wolverinemkii:
	Inherits: ^PromotionUpgradeTemplate
	Tooltip:
		Name: Unlock Wolverine MKII
	Buildable:
		BuildPaletteOrder: 1
		Queue: Promotions
		Description: Allows construction of Wolverines MKII.
		Prerequisites: ~fact.tsgdi, !ts_gdi_promotion_wolverinemkii, rank1
	RenderSprites:
		Image: ts_gdi_wolverinemkii
	ProvidesPrerequisite:
		Prerequisite: ts_gdi_promotion_wolverinemkii

