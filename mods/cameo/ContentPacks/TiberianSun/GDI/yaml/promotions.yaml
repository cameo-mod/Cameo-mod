ts_gdi_promotion_unlockwolverinemkii:
	Inherits: ^promotion_upgrade.template
	Tooltip:
		Name: Unlock Wolverine MKII
	Buildable:
		BuildPaletteOrder: 1
		Queue: Promotions
		Description: Allows construction of Wolverines MKII.
		Prerequisites: ~fact.tsgdi, !ts_gdi_promotion_unlockwolverinemkii, rank1
	RenderSprites:
		Image: ts_gdi_wolverinemkii
	ProvidesPrerequisite:
		Prerequisite: ts_gdi_promotion_unlockwolverinemkii

