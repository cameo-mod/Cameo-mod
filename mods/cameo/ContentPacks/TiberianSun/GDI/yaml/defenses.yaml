ts_gdi_ioncannonuplink:
	Inherits: ^BuildingPlug
	Valued:
		Cost: 1500
	Tooltip:
		Name: Ion Cannon Uplink
	Buildable:
		Queue: BuildingAddons
		BuildPaletteOrder: 10
		BuildDuration: 1500
		BuildDurationModifier: 100
		Prerequisites: ~ts_gdi_upgradecenter, !ionc, !droppod, ~techlevel.superweapons
		Description: Unlocks the Ion Cannon superweapon.
	Plug:
		Type: ioncannon
	Power:
		Amount: -100
	RenderSprites:
		Image: ts_gdi_ioncannonuplink
		PlayerPalette: playerra2

ts_gdi_droppoduplink:
	Inherits: ^BuildingPlug
	Valued:
		Cost: 1000
	Tooltip:
		Name: Drop Pod Uplink
	Buildable:
		Queue: BuildingAddons
		BuildPaletteOrder: 20
		BuildDuration: 1500
		BuildDurationModifier: 100
