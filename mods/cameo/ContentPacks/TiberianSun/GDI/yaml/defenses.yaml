ts_gdi_empulsecannon:
	Inherits: ^Defense
	Inherits@Template: ^AdvancedDefenseTemplate
	Inherits@shape: ^2x2Shape
	Inherits@sell: ^TSSpawnActorsOnSell
	Inherits@AUTOTARGET: ^AutoTargetGround
	Inherits@EMP: ^TurretEMP
	Selectable:
		Bounds: 2048, 2048
	Buildable:
		BuildPaletteOrder: 140
		Prerequisites: ~ts_gdi_constructionyard, ts_gdi_techcenter
		Queue: Defence, RADefence
		BuildDurationModifier: 40
		Description: actor_ts_gdi_empulsecannon.description
		BuildLimit: 1
	Valued:
		Cost: 2000
	Tooltip:
		Name: E.M. Pulse Cannon
	Building:
		Footprint: xx xx
		Dimensions: 2,2
	Health:
		HP: 250000
	Armor:
		Type: Concrete
	RevealsShroud:
		Range: 7c0
	Power:
		Amount: -100
	ProvidesPrerequisite@buildingname:
	Armament@PRIMARY:
		Weapon: TSEMPZapWeapon
		LocalOffset: 100,0,600
	Turreted:
	WithSpriteTurret:
		RequiresCondition: !build-incomplete
		Sequence: turret
	AttackTurreted:
		OpportunityFire: false
		PersistentTargeting: false
	DetonateWeaponPower@Emp:
		AllowMultiple: false
		OrderName: SteelEmpCannon
		PauseOnCondition: disabled
		Prerequisites:
			1: ts_gdi_empulsecannon
		IconImage: tsntpuls
		Icons:
			1: icon2
		Cursor: ioncannon
		ChargeInterval: 6000
		ActivationDelay: 50
		ActivationSequence:
		Names:
			1: Emp Disable
		Weapons:
			1: SteelEmpBomb
		Descriptions:
			1: power_ioncannon.description
		BeginChargeSpeechNotification: IonCannonCharging
		EndChargeSpeechNotification: IonCannonReady
		EndChargeSound:
		SelectTargetSpeechNotification: SelectTarget
		InsufficientPowerSpeechNotification: InsufficientPower
		DisplayRadarPing: True
		DisplayTimerRelationships: Ally, Neutral, Enemy
		CameraActor: camera.small
		CameraRange: 6000
		CameraRemoveDelay: 125
		TargetCircleRanges:
			1: 6000
		TargetCircleColor: ff000080
		LaunchSound:
		IncomingSound:
	SupportPowerChargeBar:
	# AttackOrderPower:
	# 	OrderName: EMPPower
	# 	PauseOnCondition: disabled || lowpower
	# 	Cursor: attackmove
	# 	Icon: emp
	# 	ChargeInterval: 3000
	# 	Name: E.M. Pulse
	# 	Description: Fires a pulse blast which disables\nall mechanical units in the area.
	# 	EndChargeSpeechNotification: EmPulseCannonReady
	# 	SelectTargetSpeechNotification: SelectTarget
	RenderRangeCircle:
	RenderSprites:
		PlayerPalette: playerra2
		Image: tsntpuls

