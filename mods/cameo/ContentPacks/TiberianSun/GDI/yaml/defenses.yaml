ts_gdi_upgradecenter:
	Inherits: ^BaseBuilding
	Inherits@shape: ^3x2Shape
	Inherits@sell: ^TSSpawnActorsOnSell
	Inherits@SW: ^PrimarySuperweapon
	Inherits@plugproducer: ^BuildingPlugProducer
	Buildable:
		Queue: Building, RABuilding
		BuildPaletteOrder: 160
		Prerequisites: ~ts_gdi_constructionyard, ts_gdi_techcenter, !tsionc, ~techlevel.superweapons
		Description: actor_ts_gdi_upgradecenter.description
	Tooltip:
		Name: Upgrade Center
	Building:
		Footprint: xxx xxx
		Dimensions: 3,2
		LocalCenterOffset: 0,-512,0
	Pluggable:
		Conditions:
			ioncannon: ionc
			droppod: droppod
		Requirements:
			ioncannon: !build-incomplete && !ionc && !droppod
			droppod: !build-incomplete && !droppod && !ionc
		EditorOptions:
			ioncannon: Ion Cannon
			droppod: Drop Pod Reinforcements
	Selectable:
		Bounds: 2048, 2048
	RevealsShroud:
		Range: 5c0
	ProvidesPrerequisite@buildingname:
	WithIdleOverlay@DISH:
		RequiresCondition: !build-incomplete
		PauseOnCondition: lowpower || disabled
		Sequence: idle-dish
	WithIdleOverlay@LIGHTS:
		RequiresCondition: !build-incomplete && !lowpower && !disabled
		Sequence: idle-lights
	WithIdleOverlay@STRIP:
		RequiresCondition: !build-incomplete && !lowpower && !disabled
		Sequence: idle-strip
	WithIdleOverlay@ioncannona:
		RequiresCondition: !build-incomplete && ionc
		PauseOnCondition: lowpower || disabled
		Sequence: idle-ioncannona
	WithIdleOverlay@ioncannonb:
		RequiresCondition: !build-incomplete && ionc
		PauseOnCondition: lowpower || disabled
		Sequence: idle-ioncannonb
	WithIdleOverlay@hunterseekera:
		RequiresCondition: !build-incomplete && droppod
		PauseOnCondition: lowpower || disabled
		Sequence: idle-hunterseekera
	WithIdleOverlay@hunterseekerb:
		RequiresCondition: !build-incomplete && droppod
		PauseOnCondition: lowpower || disabled
		Sequence: idle-hunterseekerb
	IonCannonPower:
		AllowMultiple: True
		RequiresCondition: ionc
		PauseOnCondition: lowpower || disabled
		Prerequisites:
			1: ~techlevel.superweapons
		Icons:
			1: ioncannon
		Cursor: ioncannon
		ChargeInterval: 7500
		WeaponDelay: 0
		Weapon: TSIonCannon
		Effect: tsioncannon
		EffectSequence: targeting
		EffectPalette: ra2effect
		Names:
			1: power_ioncannon.name
		Descriptions:
			1: power_ioncannon.description
		BeginChargeSpeechNotification: IonCannonCharging
		EndChargeSpeechNotification: IonCannonReady
		EndChargeTextNotification: Ion Cannon ready.
		SelectTargetSpeechNotification: SelectTarget
		SelectTargetTextNotification: Select target.
		InsufficientPowerSpeechNotification: InsufficientPower
		DisplayTimerRelationships: Ally, Neutral, Enemy
		DisplayRadarPing: True
		CameraRange: 6000
		CameraRemoveDelay: 125
		CameraActor: CAMERA.small
		SupportPowerPaletteOrder: 20
		TargetCircleRanges:
			1: 6000
		TargetCircleColor: ff000080
	DropPodsPower:
		RequiresCondition: droppod
		PauseOnCondition: lowpower || disabled
		Prerequisites:
			1: ~techlevel.superweapons
		IconImage: droppod
		Icons:
			1: droppod
		Cursor: ability
		ChargeInterval: 4500
		UnitTypes: TSDPODE1, TSDPODE2
		Weapon: TSDroppodSpawner
		Names:
			1: Drop Pods
		Descriptions:
			1: Deploys elite infantry from orbit.
		SelectTargetSpeechNotification: SelectTarget
		SelectTargetTextNotification: Select target.
		LaunchSpeechNotification: ReinforcementsArrived
		DisplayRadarPing: True
		DisplayTimerRelationships: Ally, Neutral, Enemy
		CameraActor: CAMERA.small
		CameraRemoveDelay: 60
		SupportPowerPaletteOrder: 30
	ProvidesPrerequisite@swlimit:
		Prerequisite: tsionc
	RenderSprites:
		PlayerPalette: playerra2

