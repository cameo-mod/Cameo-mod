forgotten_carryall:
	Inherits: ^Helicopter
	Inherits@Voxel: ^TSRenderVoxel
	Inherits@ChemicalFuel: ^ChemicalFuel
	Inherits@JunkArmor: ^JunkArmor
	Inherits@Unity: ^Unity
	Valued:
		Cost: 750
	Tooltip:
		Name: Carryall
	Selectable:
		Bounds: 1280, 1024
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	Buildable:
		Queue: Aircraft, RAAircraft
		BuildPaletteOrder: 60
		Prerequisites: ~forgotten_helipad, forgotten_servicedepot
		Description: VTOL aircraft capable of lifting\nand transporting vehicles.\n  Unarmed
	Aircraft:
		TurnSpeed: 80
		Speed: 149
		InitialFacing: 0
		TakeoffSounds: dropup1.aud
		LandingSounds: dropdwn1.aud
	Carryall:
		Voice: Move
		LocalOffset: 0,0,-317
		BeforeLoadDelay: 10
		BeforeUnloadDelay: 10
	-WithShadow:
	Health:
		HP: 17500
	Armor:
		Type: Light
	RenderSprites:
	SpawnActorOnDeath:
		Actor: ts_gdi_carryall_husk
	WithVoxelBody:
	Voiced:
		VoiceSet: TSHeli
	RenderVoxels:
		Scale: 15
		Image: ts_gdi_carryall
	RenderSprites:
		Image: ts_gdi_carryall
	ActorStatValues:
		Upgrades: forgotten_upgrade_chemicalfuel, forgotten_upgrade_junkarmor, forgotten_upgrade_unity

forgotten_cobracopter:
	Inherits: ^Helicopter
	Inherits@Template: ^HelicopterTemplate
	Inherits@EXPERIENCE: ^GainsExperienceTD
	Inherits@decoration: ^ForgottenRankDecoration
	Inherits@AUTOTARGET: ^AutoTargetAllAssaultMove
	Inherits@PromotionUnitBuff: ^PromotionUnitBuff
	Inherits@ChemicalWeapons: ^ChemicalWeapons
	Inherits@ChemicalFuel: ^ChemicalFuel
	Inherits@JunkArmor: ^JunkArmor
	Inherits@TiberiumBoosters: ^TiberiumBoosters
	Inherits@Unity: ^Unity
	Valued:
		Cost: 2000
	Tooltip:
		Name: Cobra Copter
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	Buildable:
		BuildPaletteOrder: 20
		Prerequisites: ~forgotten_helipad, ~forgotten_promotion_cobrahelicopter
		Queue: Aircraft, RAAircraft
		Description: Anti-armor support gunship.  Strong vs Tanks, Aircraft. Weak vs Anti-air defenses.
	Aircraft:
		TurnSpeed: 66
		Speed: 165
	Health:
		HP: 32500
	Repairable:
		HpPerStep: 1625
	ChangesHealth@SelfHealing:
		Step: 13
	Armament@PRIMARY:
		Weapon: TSCobraMissile
		LocalOffset: 0,121,271, 0,-121,271
		PauseOnCondition: !ammo
		RequiresCondition: !forgotten_upgrade_chemicalweapons
	Armament@SECONDARY:
		Weapon: TSChemCobraMissile
		LocalOffset: 0,121,271, 0,-121,271
		PauseOnCondition: !ammo
		RequiresCondition: forgotten_upgrade_chemicalweapons
	AttackAircraft:
		FacingTolerance: 80
		PersistentTargeting: false
		Voice: Attack
		PauseOnCondition: disabled
		AttackType: Hover
	SelectionDecorations:
	Selectable:
		DecorationBounds: 1536, 1536
	Voiced:
		VoiceSet: ts_nod_bansheefighter
	AmmoPool:
		Ammo: 12
		AmmoCondition: ammo
		ReloadCount: 3
	ReloadAmmoPool:
		Delay: 25
		Count: 1
	SpawnActorOnDeath:
		Actor: forgotten_cobracopter_husk
	WithIdleOverlay@ROTORAIR:
		Offset: 42,0,400
		Sequence: rotor
		RequiresCondition: airborne
		PauseOnCondition: disabled
	WithIdleOverlay@ROTORGROUND:
		Offset: 42,0,400
		Sequence: slow-rotor
		RequiresCondition: !airborne
		PauseOnCondition: disabled
	WithAmmoPipsDecoration:
		Position: BottomLeft
		RequiresSelection: True
		PipCount: 4
	RenderSprites:
		Image: forgotten_cobracopter
		PlayerPalette: player_rgba
	EjectOnDeath:
		PilotActor: forgotten_mutant
	ActorStatValues:
		Upgrades: forgotten_upgrade_chemicalweapons, forgotten_upgrade_chemicalfuel, forgotten_upgrade_junkarmor, forgotten_upgrade_tiberiumboosters, forgotten_upgrade_unity

