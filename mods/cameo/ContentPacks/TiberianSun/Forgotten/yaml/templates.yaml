^Unity:
	GrantConditionOnPrerequisite@forgotten_upgrade_unity:
		Condition: forgotten_upgrade_unity
		Prerequisites: forgotten_upgrade_unity
	ProximityExternalCondition@Unity:
		Range: 7500
		ValidRelationships: Ally
		Condition: Unity
		RequiresCondition: forgotten_upgrade_unity
	# WithRangeCircle@Unity:
	# 	Range: 7500
	# 	Type: Unity
	# 	Color: 88888888
	# 	RequiresCondition: forgotten_upgrade_unity
	ExternalCondition@Unity:
		Condition: Unity
	DamageMultiplier@Unity1:
		Modifier: 98
		RequiresCondition: Unity == 1
	DamageMultiplier@Unity2:
		Modifier: 96
		RequiresCondition: Unity == 2
	DamageMultiplier@Unity3:
		Modifier: 94
		RequiresCondition: Unity == 3
	DamageMultiplier@Unity4:
		Modifier: 92
		RequiresCondition: Unity == 4
	DamageMultiplier@Unity5:
		Modifier: 90
		RequiresCondition: Unity == 5
	DamageMultiplier@Unity6:
		Modifier: 88
		RequiresCondition: Unity == 6
	DamageMultiplier@Unity7:
		Modifier: 86
		RequiresCondition: Unity == 7
	DamageMultiplier@Unity8:
		Modifier: 84
		RequiresCondition: Unity == 8
	DamageMultiplier@Unity9:
		Modifier: 82
		RequiresCondition: Unity == 9
	DamageMultiplier@Unity10:
