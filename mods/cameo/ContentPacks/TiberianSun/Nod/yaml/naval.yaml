ts_nod_cruiser:
	Inherits: ^BoatUnit
	Inherits@Template: ^ArtilleryShipTemplate
	Inherits@EXPERIENCE: ^GainsExperienceTD
	Inherits@decoration: ^NodRankDecoration
	Inherits@AUTOTARGET: ^AutoTargetGroundAssaultMove
	Inherits@EMP: ^TurretEMP
	Valued:
		Cost: 4000
	Tooltip:
		Name: Nod Battleship
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	Buildable:
		BuildPaletteOrder: 50
		Prerequisites: ~ts_nod_navalyard, ts_nod_techcenter
		Queue: Naval, RANaval
		Description: actor_ra1_allies_cruiser.description
	Mobile:
		Speed: 40
		TurnSpeed: 8
	Health:
		HP: 350000
	ChangesHealth@SelfHealing:
		Step: 90
	Armor:
		Type: Superheavy
	Turreted@PRIMARY:
		Turret: primary
		Offset: 1300,-200,226
		TurnSpeed: 8
	Turreted@SECONDARY:
		Turret: secondary
		Offset: 1300,200,226
		TurnSpeed: 8
	Turreted@TERCERA:
		Turret: tercera
		Offset: -1400,-200,226
		TurnSpeed: 8
	Turreted@CUARTA:
		Turret: cuarta
		Offset: -1400,200,226
		TurnSpeed: 8
	Turreted@QUINTA:
		Turret: quinta
		Offset: -1840,0,356
		TurnSpeed: 8
	Armament@PRIMARY:
		Turret: primary
		Weapon: 8Inch
		LocalOffset: 480,-100,40, 480,100,40
		Recoil: 175
		RecoilRecovery: 35
		MuzzleSequence: muzzle
		MuzzlePalette: ra2effect
	Armament@SECONDARY:
		Name: secondary
		Turret: secondary
		Weapon: 8Inch
		LocalOffset: 480,-100,40, 480,100,40
		Recoil: 175
		RecoilRecovery: 35
		MuzzleSequence: muzzle
		MuzzlePalette: ra2effect
	Armament@TERCERA:
		Turret: tercera
		Weapon: 8Inch
		LocalOffset: 480,-100,40, 480,100,40
		Recoil: 175
		RecoilRecovery: 35
		MuzzleSequence: muzzle
		MuzzlePalette: ra2effect
	Armament@CUARTA:
		Turret: cuarta
		Weapon: 8Inch
		LocalOffset: 480,-100,40, 480,100,40
		Recoil: 175
		RecoilRecovery: 35
		MuzzleSequence: muzzle
		MuzzlePalette: ra2effect
	Armament@QUINTA:
		Turret: quinta
		Weapon: 8Inch
		LocalOffset: 480,-100,40, 480,100,40
		Recoil: 175
		RecoilRecovery: 35
		MuzzleSequence: muzzle
		MuzzlePalette: ra2effect
	AttackTurreted:
		Turrets: primary, secondary, tercera, cuarta, quinta
	WithMuzzleOverlay:
	WithSpriteTurret:
	Selectable:
		DecorationBounds: 2048, 2048
	WithSpriteTurret@PRIMARY:
		Turret: primary
	WithSpriteTurret@SECONDARY:
		Turret: secondary
	WithSpriteTurret@TERCERA:
		Turret: tercera
	WithSpriteTurret@CUARTA:
		Turret: cuarta
	WithSpriteTurret@QUINTA:
		Turret: quinta
	DeliversCash:
		Payload: 500
	Voiced:
		VoiceSet: TSVehicle
	RenderSprites:
		Image: ts_nod_cruiser
		PlayerPalette: player_rgba

ts_nod_rayboat:
