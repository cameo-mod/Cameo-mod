ts_nod_lightinfantry:
	Inherits: TSE1
	Inherits@TiberiumLenses: ^TiberiumLenses
	Inherits@InfiltrationKit: ^InfiltrationKit
	Buildable:
		Queue: Infantry, RAInfantry
		Prerequisites: ~ts_nod_handof
	Armament@PRIMARY:
		Weapon: TSMinigun
		RequiresCondition: !ts_nod_upgrade_tiberiumlenses
		LocalOffset: 128,0,256
	Armament@UPGRADE:
		Weapon: TSLasergun
		RequiresCondition: ts_nod_upgrade_tiberiumlenses
		LocalOffset: 128,0,256
	Armament@GARRISONED: ##########
		Name: garrisoned
		Weapon: TSMinigun
		RequiresCondition: !ts_nod_upgrade_tiberiumlenses
	Armament@UPGRADEGARRISONED: ##########
		Name: garrisoned
		Weapon: TSLasergun
		RequiresCondition: ts_nod_upgrade_tiberiumlenses
	Cloak@ts_nod_upgrade_infiltrationkit:
		DetectionTypes: GroundCloak
		InitialDelay: 125
		CloakDelay: 75
		CloakSound: cloak5.aud
		UncloakSound: cloak5.aud
		PauseOnCondition: cloak-force-disabled || base-reveal || disabled
		IsPlayerPalette: true
		RequiresCondition: ts_nod_upgrade_infiltrationkit
	RenderSprites:
		PlayerPalette: playerra2
		Image: ts_nod_lightinfantry
	ActorStatValues:
		Upgrades: ts_nod_upgrade_tiberiumlenses, ts_nod_upgrade_infiltrationkit

ts_nod_engineer:
	Inherits: TSENGINEER
