	Buildable:
		Queue: Infantry, RAInfantry
		Prerequisites: ~ts_nod_handof
	RenderSprites:
		Image: tsengineer
	Voiced:
		VoiceSet: TSInfantry
	-TemporaryOwnerManager:
	RenderSprites:
		PlayerPalette: playerra2
		Image: altengi

ts_nod_rocketinfantry:
	Inherits: TSE3
	Inherits@TiberiumCoreMissiles: ^TiberiumCoreMissiles
	Buildable:
		BuildPaletteOrder: 20
		Prerequisites: ~ts_nod_handof
		Queue: Infantry, RAInfantry
		Description: Anti-tank/anti-aircraft infantry. \n  Strong vs Tanks, Aircraft\n  Weak vs Infantry
	Armament@PRIMARY: ##########
		Weapon: TSBazooka
		LocalOffset: 256,43,341
		FireDelay: 5
		RequiresCondition: !ts_nod_upgrade_tiberiumcoremissiles
	Armament@GARRISONED: ##########
		Name: garrisoned
		Weapon: TSBazooka
		RequiresCondition: !ts_nod_upgrade_tiberiumcoremissiles
	Armament@UPGRADE: ##########
		Weapon: TSTibBazooka
		LocalOffset: 256,43,341
		FireDelay: 5
		RequiresCondition: ts_nod_upgrade_tiberiumcoremissiles
	Armament@GARRISONEDUPGRADE: ##########
		Name: garrisoned
		Weapon: TSTibBazooka
		RequiresCondition: ts_nod_upgrade_tiberiumcoremissiles
	RenderSprites:
		Image: TSE3
		PlayerPalette: playerra2
	ActorStatValues:
		Upgrades: ts_nod_upgrade_tiberiumcoremissiles

ts_nod_elitecadre:
	Inherits: ^Soldier
	Inherits@Template: ^AntiTankAntiAirInfantryTemplate
	Inherits@EXPERIENCE: ^GainsExperienceTD
	Inherits@decoration: ^GDIRankDecoration
	Inherits@AUTOTARGET: ^AutoTargetAllAssaultMove
	Inherits@DECORATIONS: ^InfantryExperienceHospitalHazmatOverrides
	Inherits@anim: ^TSInfantry
	Inherits@vo: ^AttackFrontalVoice
	Inherits@TiberiumLenses: ^TiberiumLenses
	Inherits@AuxiliaryWeapon: ^AuxiliaryWeapon
	Valued:
		Cost: 450
	Tooltip:
		Name: Elite Cadre
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	Buildable:
		BuildPaletteOsrder: 50
		Prerequisites: ~ts_nod_handof, ts_nod_radar
		Queue: Infantry, RAInfantry
		Description: Elite Infantry of NOD used to fight high technology enemies \n  Strong vs Infantry, Air, Vehicles\n  Weak vs Siege, Heavy armor
	Mobile:
		Speed: 55
	Health:
		HP: 20000
	ChangesHealth@SelfHealing:
		Step: 20
	Armament@PRIMARY:
		Weapon: elitecadregun
		RequiresCondition: !ts_nod_upgrade_tiberiumlenses
		LocalOffset: 128,0,256
	Armament@UPGRADE:
		Weapon: laserelitecadregun
		RequiresCondition: ts_nod_upgrade_tiberiumlenses
		LocalOffset: 128,0,256
	Armament@GARRISONED: ##########
		Name: garrisoned
		Weapon: elitecadregun
		RequiresCondition: !ts_nod_upgrade_tiberiumlenses
	Armament@GARRISONEDUPGRADE: ##########
		Name: garrisoned
		Weapon: laserelitecadregun
		RequiresCondition: ts_nod_upgrade_tiberiumlenses
	Armament@SECONDARY:
		Weapon: TSCadreGrenade
		RequiresCondition: ts_nod_upgrade_auxiliaryweapon
		LocalOffset: 128,0,256
	Armament@GARRISONEDSECONDARY: ##########
		Name: garrisoned
		Weapon: TSCadreGrenade
		RequiresCondition: ts_nod_upgrade_auxiliaryweapon
	TakeCover:
		ProneOffset: 180,0,-200
	Voiced:
		VoiceSet: TSRocket
	WithInfantryBody:
		RequiresCondition: !cydamaged
		DefaultAttackSequence: attack
	WithInfantryBody@damaged:
		MoveSequence: crippled-run
		DefaultAttackSequence: crippled-attack
		StandSequences: crippled-stand
		RequiresCondition: cydamaged
	GrantConditionOnDamageState@damaged:
		Condition: cydamaged
		ValidDamageStates: Critical
	RenderSprites:
		PlayerPalette: ra2player
	WithDeathAnimation:
		DeathSequencePalette: ra2player
		CrushedSequencePalette: ra2effect
	RenderSprites:
		PlayerPalette: playerra2
	ActorStatValues:
		Upgrades: ts_nod_upgrade_tiberiumlenses, ts_nod_upgrade_auxiliaryweapon

