^TSTDHARV:
	Inherits: ^Tank
	Inherits@Template: ^HarvesterTemplate
	Inherits@selection: ^SelectableEconomicUnit
	Inherits@harv: ^Harvester
	Tooltip:
		Name: Tiberium Harvester
	Valued:
		Cost: 1000
	Harvester:
		BaleLoadDelay: 4
		BaleUnloadDelay: 1
		EmptyCondition: no-tiberium
	StoresResources:
		Capacity: 45
	Mobile:
		Speed: 60
		TurnSpeed: 12
	Health:
		HP: 150000
	Repairable:
		HpPerStep: 7500
	ChangesHealth@SelfHealing:
		Step: 60
	Armor:
		Type: Heavy
	WithHarvestAnimation:
	WithDockingAnimation:
	FireWarheadsOnDeath:
		RequiresCondition: !no-tiberium
		Weapon: TiberiumExplosion
	FireWarheadsOnDeath@empty:
		RequiresCondition: no-tiberium
		Weapon: UnitExplodeHarvEmpty
	SelectionDecorations:
	RenderSprites:
		Image: harv

^TSRA2Defense:
	Inherits: ^RA2Building
	Inherits@2: ^BasicDefense
	Inherits@exp: ^GainsExperienceRA2
	WithIdleOverlay@shrouded:
		Image: shrouded_overlay
	-GivesBuildableArea:
	-CommandBarBlacklist:
	-AcceptsDeliveredCash:

^TSTiberiumCloakAnimation:
	Cloak:
		CloakStyle: Palette
		CloakedPalette: cloak_stealth
		IsPlayerPalette: true
		EffectImage: stealthfade
		EffectPalette: greenspark
		CloakEffectSequence: reversed
		UncloakEffectSequence: idle
		EffectTracksActor: True
