		Weapon: TunnelDisappear
		InitialDelay: 595
	GivesExperience:
		PlayerExperienceModifier: 0

^TSCyborgs:
	Inherits@MC: ^MCImmune
	Inherits@HackableRobot: ^HackableRobot
	Inherits@EMPfrontal: ^FrontalEMP
	Inherits@EMP: ^UnitDisable
	WithInfantryBody:
		RequiresCondition: !cydamaged
		DefaultAttackSequence: attack
	WithInfantryBody@damaged:
		MoveSequence: crippled-run
		DefaultAttackSequence: crippled-attack
		StandSequences: crippled-stand
		RequiresCondition: cydamaged
	Crushable:
		CrushClasses: vehicle
	ExternalCondition@EMP:
		TotalCap: 1
		Condition: empdisable
	TimedConditionBar@EMP:
		Condition: empdisable
		Color: FFFFFF
	GrantCondition@disable:
		RequiresCondition: ReaperTrap || chronobeamed || leaflet || empdisable
	WithColoredOverlay@leaflet:
		RequiresCondition: leaflet || empdisable
	Targetable@HEAL:
		TargetTypes: Heal, Repair, Healing
	Targetable:
		TargetTypes: Ground, Infantry, Cyborg
	GrantConditionOnPrerequisite@MACHINESHOP:
		Condition: hospital
		Prerequisites: machshop

^SubterraneanVoxelVehicle:
	RevealsShroud:
		RequiresCondition: !submerged
	WithVoxelBody:
		RequiresCondition: !submerged
	Targetable:
		RequiresCondition: !submerged && !chronobeamed
	Targetable@UNDERGROUND:
		TargetTypes: Underground
		RequiresCondition: submerged
	GrantConditionOnSubterraneanLayer:
		Condition: submerged
		SubterraneanTransitionPalette: tseffect
		SubterraneanTransitionImage: tsdig
		SubterraneanTransitionSequence: idle
		SubterraneanTransitionSound: subdril1.aud
	WithDecoration@UNDERGROUND:
		RequiresCondition: submerged
		Position: Center
		Image: gpsdot
		Sequence: Vehicle
		RequiresSelection: false
		Palette: player
		IsPlayerPalette: true
	AnnounceOnSeen@subterranean:
		PingRadar: true
		Notification: SubterraneanUnitDetected
	GrantCondition@untargetable:
		Condition: untargetable
		RequiresCondition: chronobeamed || invulnerability || submerged

