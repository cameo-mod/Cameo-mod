OILB.TS:
	Inherits: OILB.Building
	Inherits@cashtrickler: ^CashTricklerWithExperience
	Inherits@cashtricklerlimit: ^CashTricklerLimited
	Tooltip:
		Name: Tiberium Pump
	Buildable:
		Queue: Building, RABuilding
		Prerequisites: ~tsoilderrick, tstek, derricklimit
		Description: Provides Passive income
		IconPalette: ra2
	RenderSprites:
		Image: tibpump
	-WithMakeAnimation:
	WithIdleOverlay@PLATFORM:
		RequiresCondition: !build-incomplete
		Sequence: idle-platform
	WithIdleOverlay@LIGHTS:
		RequiresCondition: !build-incomplete
		Sequence: idle-lights
	RenderSprites:
		PlayerPalette: playerra2

OILB.TS.MUTANT:
	Inherits: OILB.TS
	Inherits@cashtrickler: ^LargeCashTricklerWithExperience
	Inherits@cashtricklerlimit: ^CashTricklerLimited
	Inherits@shape: ^3x4Shape
	Tooltip:
		Name: Tiberium Extractor
	Buildable:
		BuildLimit: 1
		Queue: Building, RABuilding
		Prerequisites: ~tsfgttech, derricklimit
	SeedsResource:
		ResourceType: Tiberium
		Interval: 50
		MaxRange: 250
	-WithIdleOverlay@PLATFORM:
	WithIdleOverlay@LIGHTS:
		Sequence: anim
		Palette: tseffect
	RenderSprites:
		Image: tibdrill
		PlayerPalette: playerra2

