	Power:
		Amount: -45
	Health:
		HP: 45000
	ChangesHealth@SelfHealing:
		Step: 18
	Mobile:
		Speed: 45
		TurnSpeed: 18
	Buildable:
		BuildPaletteOrder: 40
		Prerequisites: ~wc2_human_blacksmith
