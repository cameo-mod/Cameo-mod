# Ogre also has built-in ogremage stuff so that ogremage's upgrades and spells will be applied to already-built ogres, just as in WC2.
wc2_runes:
	Inherits: ^Mine
	RenderSprites:
		Image: wc2_effect_runes
	-WithSpriteBody:
	GrantPeriodicCondition:
		Condition: cond_show
		ActiveDuration: 14
		CooldownDuration: 138
		StartsGranted: True
	WithIdleOverlay:
		Sequence: idle
		RequiresCondition: cond_show
	FireWarheadsOnDeath:
		Weapon: wc2ogremageRunes_Hit
	Mine:
		AvoidFriendly: false
		BlockFriendly: false
	-Immobile:
	Mobile:
		Locomotor: wheeled
		Speed: 1
		PauseOnCondition: dontmove
	GrantCondition@dontmove:
		Condition: dontmove
	RejectsOrders:
	Health:
		HP: 10000
	KillsSelf:
		Delay: 1000
		RemoveInstead: true
	DamageMultiplier@Runes:
		Modifier: 0

