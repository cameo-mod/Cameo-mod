wc2_human_peasant:
	Inherits@WC2INFANTRY: ^WC2Infantry
	Inherits@WC2Template: ^wc2_peasant
	Inherits@WC2HShieldUpg: ^wc2_h_str_shield
	Tooltip:
		Name: Peasant
	Buildable:
		Prerequisites: ~wc2_human_townhall, wc2_human_elven_lumber_mill
		Description: Harvester.
	Armament:
		Weapon: wc2peasantsmack
		FireDelay: 7
	-WithInfantryBody:
	WithHarvesterSpriteBody:
		ImageByFullness: wc2_human_peasant, wc2_human_peasantgold
	WithMoveAnimation:
		MoveSequence: run
	Voiced:
		VoiceSet: wc2voicehumanpeasant
	-DamagedByTerrain:
	ActorStatValues:
		Upgrades: wc2_h_str_shield, wc2_h_str_shield2

wc2_human_militia2:
	Inherits@WC2INFANTRY: ^WC2Infantry
