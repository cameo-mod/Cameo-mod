	Inherits@WC2HShieldUpg: ^wc2_h_str_shield
	Inherits@WC2Template: ^wc2_peasant
	Tooltip:
		Name: Militia Peasant
	Valued:
		Cost: 300
	Power:
		Amount: -15
	Mobile:
		Speed: 90
	Health:
		HP: 20000
	Repairable:
		HpPerStep: 1000
