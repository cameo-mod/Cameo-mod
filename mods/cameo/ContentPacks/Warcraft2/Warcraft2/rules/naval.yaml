		Description: Stealthed attack vessel.
	Tooltip:
		Name: Gnomish Submarine
	Armament@PRIMARY:
		Weapon: wc2submarineFire
		LocalOffset: 208,0,48
		MuzzleSequence: muzzle
		FireDelay: 7
