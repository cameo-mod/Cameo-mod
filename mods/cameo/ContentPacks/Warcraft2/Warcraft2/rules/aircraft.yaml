		Queue: Infantry, RAInfantry
		Description: Fast, weak scouting unit.
	Aircraft:
		InitialFacing: 896
		TurnSpeed: 2048
		Speed: 350
		IdealSeparation: 1c0
		RepulsionSpeed: 10
	Health:
		HP: 30000
	Armor:
