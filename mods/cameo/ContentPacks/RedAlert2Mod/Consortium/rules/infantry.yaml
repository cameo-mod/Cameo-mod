qinf.steel:
	Inherits: ^Soldier
	Inherits@Template: ^HeavyInfantryTemplate
	Inherits@EXPERIENCE: ^GainsExperienceRA2
	Inherits@AUTOTARGET: ^AutoTargetAllAssaultMove
	Inherits@DECORATIONS: ^InfantryExperienceHospitalHazmatOverrides
	Inherits@anim: ^RA2Infantry
	Inherits@editorhack: ^DeployableInfantryEditor
	Inherits@vo: ^AttackFrontalVoice
	Inherits@bot: ^SiegeMode
	Inherits@AntiVeh: ^PrioritizeVehicle
	Inherits@AntiTank: ^PrioritizeTank
	Inherits@AntiAir: ^PrioritizeAir
	Inherits@SteelConsortiumNaniteInfusion: ^SteelConsortiumNaniteInfusionInfantry
	Inherits@quantum: ^QuantumWeaponsEMP
	Valued:
		Cost: 1150
	Tooltip:
		Name: Quantum Missile Trooper
	Buildable:
		BuildPaletteOrder: 20
		Prerequisites: ~qacst.steel, qatech.steel
		Queue: Infantry, RAInfantry
		Description: actor-ggi.description
	Mobile:
		Speed: 48
	Health:
		HP: 64000
	ChangesHealth@SelfHealing:
		Step: 64
	RangeMultiplier@deployed:
		Modifier: 125
		RequiresCondition: deployed
	RevealsShroudMultiplier@shrouded:
		Modifier: 125
		RequiresCondition: deployed
	DamageMultiplier@deployed:
		Modifier: 75
		RequiresCondition: deployed
	RenderRangeCircle:
	RevealOnFire:
		ArmamentNames: primary, deployed
	Armament@PRIMARY:
		Weapon: SteelInfRailgun
		LocalOffset: 384,64,384
		RequiresCondition: !deployed && !rank-elite && !up_empquantumweapons.steel
	Armament@PRIMARYELITE:
		Weapon: SteelInfRailgunE
		LocalOffset: 384,64,384
		RequiresCondition: !deployed && rank-elite && !up_empquantumweapons.steel
	Armament@UpgradePRIMARY:
		Weapon: SteelInfRailgunEMP
		LocalOffset: 384,64,384
		RequiresCondition: !deployed && !rank-elite && up_empquantumweapons.steel
	Armament@UpgradePRIMARYELITE:
		Weapon: SteelInfRailgunEMPE
		LocalOffset: 384,64,384
		RequiresCondition: !deployed && rank-elite && up_empquantumweapons.steel
	Armament@BOTAA:
		Weapon: aadeploytargeting.8c0
		Name: targeting
		RequiresCondition: botmicro
	Armament@DEPLOYED:
		Name: deployed
		Weapon: SteelInfRailgun
		Turret: deploy
		LocalOffset: 384,64,384
		RequiresCondition: deployed && !rank-elite && !up_empquantumweapons.steel
	Armament@DEPLOYEDELITE:
		Name: deployed
		Weapon: SteelInfRailgunE
		Turret: deploy
		LocalOffset: 384,64,384
		RequiresCondition: deployed && rank-elite && !up_empquantumweapons.steel
	Armament@UpgradeDEPLOYED:
		Name: deployed
		Weapon: SteelInfRailgunEMP
		Turret: deploy
		LocalOffset: 384,64,384
		RequiresCondition: deployed && !rank-elite && up_empquantumweapons.steel
	Armament@UpgradeDEPLOYEDELITE:
		Name: deployed
		Weapon: SteelInfRailgunEMPE
		Turret: deploy
		LocalOffset: 384,64,384
		RequiresCondition: deployed && rank-elite && up_empquantumweapons.steel
	Armament@GARRISONED:
		Name: garrisoned
		Weapon: SteelInfRailgun
		RequiresCondition: !rank-elite && !up_empquantumweapons.steel
	Armament@GARRISONEDELITE:
		Name: garrisoned
		Weapon: SteelInfRailgunE
		RequiresCondition: rank-elite && !up_empquantumweapons.steel
	Armament@UpgradeGARRISONED:
		Name: garrisoned
		Weapon: SteelInfRailgunEMP
		RequiresCondition: !rank-elite && up_empquantumweapons.steel
	Armament@UpgradeGARRISONEDELITE:
		Name: garrisoned
		Weapon: SteelInfRailgunEMPE
		RequiresCondition: rank-elite && up_empquantumweapons.steel
	AttackFrontal:
		Armaments: primary, targeting
		RequiresCondition: undeployed
		FacingTolerance: 2
	AttackTurreted@deployed:
		Armaments: deployed
		Turrets: deploy
		PauseOnCondition: disabled
		RequiresCondition: deployed
		Voice: Attack
	Turreted:
		Turret: deploy
		RealignDelay: -1
		TurnSpeed: 1023
		InitialFacing: 368
	WithSpriteTurret@idle:
		Turret: deploy
		Sequence: deployed
		RequiresCondition: deployed && !animate-turret
	WithSpriteTurret@animated:
		Turret: deploy
		Sequence: shoot-deployed
		RequiresCondition: deployed && animate-turret
	WithSpriteBody:
		Sequence: dot
		Name: dot
		RequiresCondition: !undeployed
	GrantConditionOnAttack:
		Condition: animate-turret
		RevokeDelay: 5
		ArmamentNames: deployed
	WithInfantryBody:
		-DefaultAttackSequence:
		AttackSequences:
			primary: shoot
		RequiresCondition: undeployed
	WithMakeAnimation:
		Sequence: deploy
		BodyNames: dot
	GrantConditionOnDeploy:
		Facing: 384
		DeploySounds: iggidepa.wav
		UndeploySounds: iggidepa.wav
		RequiresCondition: !parachute
		Voice: Deploy
	Crushable:
		RequiresCondition: undeployed
	Crushable@deployed:
		CrushClasses: vehicle
		RequiresCondition: !undeployed
	Voiced:
		VoiceSet: SteelSentinelVoice
	QuantizeFacingsFromSequence:
		Sequence: stand
	RenderSprites:
		PlayerPalette: playerra2cons
	ActorStatValues:
		Upgrades: up_naniteinfusion.steel, up_empquantumweapons.steel, up_shielresistance.steel

