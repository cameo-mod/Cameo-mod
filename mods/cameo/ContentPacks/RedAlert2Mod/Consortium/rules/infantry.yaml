fedinf.steel:
	Inherits: ^Soldier
	Inherits@Template: ^AntiTankAntiAirInfantryTemplate
	Inherits@EXPERIENCE: ^GainsExperienceRA2
	Inherits@AUTOTARGET: ^AutoTargetAllAssaultMove
	Inherits@DECORATIONS: ^InfantryExperienceHospitalHazmatOverrides
	Inherits@anim: ^RA2Infantry
	Inherits@vo: ^AttackFrontalVoice
	Inherits@AntiInf: ^PrioritizeInfantry
	Inherits@SteelConsortiumPulseWeapons: ^SteelConsortiumPulseWeapons
	Inherits@SteelConsortiumNaniteInfusion: ^SteelConsortiumNaniteInfusionInfantry
	Inherits@SteelConsortiumResonanceAmmo: ^SteelConsortiumResonanceAmmo
	Valued:
		Cost: 200
	Tooltip:
		Name: Clone Trooper
	Buildable:
		BuildPaletteOrder: 10
		Prerequisites: ~qacst.steel, qabarr.steel
		Queue: Infantry, RAInfantry
		Description: template-scout-infantry.description
	Mobile:
		Speed: 57
	Health:
		HP: 17000
	ChangesHealth@SelfHealing:
		Step: 17
	Armament@PRIMARY:
		Weapon: SteelCloneGun
		RequiresCondition: !rank-elite
	Armament@ELITE:
		Weapon: SteelCloneGunE
		RequiresCondition: rank-elite
	Armament@GARRISONED:
		Name: garrisoned
		Weapon: SteelCloneGun
		MuzzleSequence: muzzle
		MuzzlePalette: ra2effect
		RequiresCondition: !rank-elite
	Armament@GARRISONEDELITE:
		Name: garrisoned
		Weapon: SteelCloneGunE
		MuzzleSequence: muzzle
		MuzzlePalette: ra2effect
		RequiresCondition: rank-elite
	Armament@UpgradePRIMARY:
		Weapon: SteelCloneGunResonance
		RequiresCondition: !rank-elite && up_resonanceammo.steel
	Armament@UpgradeELITE:
		Weapon: SteelCloneGunEResonance
		RequiresCondition: rank-elite && up_resonanceammo.steel
	Armament@UpgradeGARRISONED:
		Name: garrisoned
		Weapon: SteelCloneGunResonance
		MuzzleSequence: muzzle
		MuzzlePalette: ra2effect
		RequiresCondition: !rank-elite && up_resonanceammo.steel
	Armament@UpgradeGARRISONEDELITE:
		Name: garrisoned
		Weapon: SteelCloneGunEResonance
		MuzzleSequence: muzzle
		MuzzlePalette: ra2effect
		RequiresCondition: rank-elite && up_resonanceammo.steel
	FirepowerMultiplier@up_pulseweapons.steel:
		Modifier: 160
	RangeMultiplier@up_pulseweapons.steel:
		Modifier: 130
	AttackFrontal:
		FacingTolerance: 0
	Voiced:
		VoiceSet: SteelCloneVoice
	RenderSprites:
		PlayerPalette: playerra2cons
	ActorStatValues:
		Upgrades: up_pulseweapons.steel, up_naniteinfusion.steel, up_resonanceammo.steel, up_shielresistance.steel

