steel_twister:
	Inherits: ^RANeutralPlane
	Inherits@Template: ^FighterTemplate
	Inherits@EXPERIENCE: ^GainsExperienceRA2
	Inherits@AUTOTARGET: ^AutoTargetAllAssaultMove
	Inherits@SteelConsortiumNaniteInfusion: ^SteelConsortiumNaniteInfusion
	Inherits@SteelConsortiumFerrocrete: ^SteelConsortiumFerrocrete
	Tooltip:
		Name: Twister
	Valued:
		Cost: 1000
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	Buildable:
		BuildPaletteOrder: 100
		Prerequisites: ~steel_conpad
		Queue: Aircraft, RAAircraft
		Description: actor-falc.description
	Aircraft:
		CruiseAltitude: 2560
		TurnSpeed: 10
		Speed: 150
		IdleTurnSpeed: 10
		IdleSpeed: 100
		TakeoffSounds: twisSounda.wav, twisSoundb.wav
		LandingSounds: twisSounda.wav, twisSoundb.wav
		CanHover: false
		CanSlide: false
		VTOL: true
		Voice: Move
	Health:
		HP: 50000
	Repairable:
		HpPerStep: 2500
	ChangesHealth@SelfHealing:
		Step: 50
	Armament@PRIMARY:
		Name: primary
		Weapon: SteelTwisterMissiles
		LocalOffset: 425,-250,-225, 425,250,-225, 425,-150,-225, 425,150,-225, 425,0,-225
		LocalYaw: 100, -100, 50, -50, 0
		PauseOnCondition: !ammo
		RequiresCondition: !rank-elite
	Armament@PRIMARYELITE:
		Name: primary
		Weapon: SteelTwisterMissilesE
		LocalOffset: 425,-250,-225, 425,250,-225, 425,-150,-225, 425,150,-225, 425,0,-225
		LocalYaw: 100, -100, 50, -50, 0
		PauseOnCondition: !ammo
		RequiresCondition: rank-elite
	AmmoPool:
		Ammo: 10
		AmmoCondition: ammo
	ReloadAmmoPool:
		Delay: 42
		Count: 1
	SpawnActorOnDeath:
		Actor: steel_twister.Husk
	SelectionDecorations:
	Selectable:
		DecorationBounds: 1280, 1024
	Contrail@1:
		Offset: -100,256,0
		TrailLength: 15
	Contrail@2:
		Offset: -100,-256,0
		TrailLength: 15
	Voiced:
		VoiceSet: SteelAircraftVoice
	DeathSounds:
	AttackAircraft:
		Voice: Attack
		FacingTolerance: 80
	WithAmmoPipsDecoration:
		Position: BottomLeft
		RequiresSelection: true
		PipCount: 10
	RenderSprites:
		PlayerPalette: playerra2cons
	ActorStatValues:
		Upgrades: upsteel_naniteinfusion, upsteel_ferrocrete, upsteel_shielresistance

