latin_syndicate_hindtransport:
	Inherits: ^Helicopter
	Inherits@Template: ^HelicopterTemplate
	Inherits@cargo: ^CargoAircraft
	Inherits@EXPERIENCE: ^GainsExperienceRA2
	Inherits@AUTOTARGET: ^AutoTargetAllAssaultMove
	Inherits@gat: ^GatlingSpeedUpUnitBehavior
	Inherits@uprecover: ^LatinCashrecover
	Valued:
		Cost: 2500
	Tooltip:
		Name: ra1_soviet_hindattackhelicopter Transport
	Buildable:
		BuildPaletteOrder: 97
		Prerequisites: ~latin_syndicate_airstation
		Queue: Aircraft, RAAircraft
		IconPalette: ra2cameo
		Description: actor_ra2hind.description
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	Aircraft:
		TurnSpeed: 18
		Speed: 90
		RepulsionSpeed: 18
	Health:
		HP: 95000
	Repairable:
		HpPerStep: 4750
	ChangesHealth@SelfHealing:
		Step: 38
	Armament@PRIMARY:
		Weapon: BlackHawkCannon
		LocalOffset: 128,-213,-85, 128,213,-85
		MuzzleSequence: muzzle
		MuzzlePalette: ra2effect
	GrantConditionOnAttack@gatling:
		RequiresCondition: !rank-elite && latin_syndicate_upgrade_yuristolentechchainguns
	GrantConditionOnAttack@elitegatling:
		RequiresCondition: rank-elite && latin_syndicate_upgrade_yuristolentechchainguns
	GrantConditionOnPrerequisite@latin_syndicate_upgrade_yuristolentechchainguns:
		Condition: latin_syndicate_upgrade_yuristolentechchainguns
		Prerequisites: latin_syndicate_upgrade_yuristolentechchainguns
	WithMuzzleOverlay:
	AttackAircraft:
		FacingTolerance: 80
	WithIdleOverlay@ROTORAIR:
		Offset: 0,0,20
		Sequence: rotor
		RequiresCondition: airborne
		PauseOnCondition: disabled
	WithIdleOverlay@ROTORGROUND:
		Offset: 0,0,20
		Sequence: slow-rotor
		RequiresCondition: !airborne
		PauseOnCondition: disabled
	SpawnActorOnDeath:
		Actor: ra2hind_husk.latin
	Selectable:
		DecorationBounds: 1280, 1024
	Carryall:
		LocalOffset: 0,0,-256
	Voiced:
		VoiceSet: SiegeChopperVoice
	DeathSounds:
	RenderSprites:
		Image: ra2hind
		PlayerPalette: playerra2
	FirepowerMultiplier@FirerateCompensation:
		Modifier: 75
	ActorStatValues:
		Upgrades: latin_syndicate_upgrade_cashrecovery, latin_syndicate_upgrade_sovietstolentechindustrialmethods, latin_syndicate_upgrade_alliedstolentechextramissilesandmiraging, latin_syndicate_upgrade_yuristolentechchainguns

ra2hind_husk.latin:
	Inherits: ^LargeHelicopterHusk
	Tooltip:
		Name: ra1_soviet_hindattackhelicopter Transport
	Aircraft:
		TurnSpeed: 17
		Speed: 85
	RenderSprites:
		Image: ra2hind
		PlayerPalette: playerra2

