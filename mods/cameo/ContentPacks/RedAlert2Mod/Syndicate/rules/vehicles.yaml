latinscrapcar:
	Inherits: ^CivilianVehicle
	RenderSprites:
		Image: latinscrapcar
		PlayerPalette: playerra2
	TransformOnCapture:
		IntoActor: latinscrapcar_demo
		CaptureTypes: bombcar
	TransformOnCapture@driveby:
		IntoActor: latinscrapcar_driveby
		CaptureTypes: driveby
	Capturable:
		Types: bombcar, driveby
		ValidRelationships: Enemy, Neutral, Ally

latinscrapcar_demo:
	Inherits: ^CivilianSuicideVehicle
	Inherits@vo: ^AttackFrontalVoice
	Inherits@EMP: ^FrontalEMP
	RenderSprites:
		Image: latinscrapcar
		PlayerPalette: playerra2

latinscrapcar_driveby:
	Inherits: ^CivilianDriveByVehicle
	Inherits@vo: ^AttackFrontalVoice
	Inherits@EMP: ^FrontalEMP
	Cargo:
		InitialUnits: latin_mili, latin_narco, latin_fthrow
	RenderSprites:
		Image: latinscrapcar
		PlayerPalette: playerra2

latinscrapcar2:
	Inherits: ^CivilianVehicle
	RenderSprites:
		Image: ra2car
		PlayerPalette: playerra2
	TransformOnCapture:
		IntoActor: latinscrapcar2_demo
		CaptureTypes: bombcar
	TransformOnCapture@driveby:
		IntoActor: latinscrapcar2_driveby
		CaptureTypes: driveby
	Capturable:
		Types: bombcar, driveby
		ValidRelationships: Enemy, Neutral, Ally

latinscrapcar2_demo:
	Inherits: ^CivilianSuicideVehicle
	Inherits@vo: ^AttackFrontalVoice
	Inherits@EMP: ^FrontalEMP
	RenderSprites:
		Image: latinscrapcar2
		PlayerPalette: playerra2

latinscrapcar2_driveby:
	Inherits: ^CivilianDriveByVehicle
	Inherits@vo: ^AttackFrontalVoice
	Inherits@EMP: ^FrontalEMP
	Cargo:
		InitialUnits: latin_mili, latin_monkey, latin_tkiller
	RenderSprites:
		Image: latinscrapcar2
		PlayerPalette: playerra2

