latin_cgcnst:
	Inherits: ra2gacnst
	Inherits@sell: ^SyndicateSpawnActorsOnSell
	Tooltip:
		Name: Syndicate Construction Yard
	Transforms:
		IntoActor: latin_mcv
	WithIdleOverlay@fans:
	WithIdleOverlay@top:
		Sequence: idle-top
		RequiresCondition: !build-incomplete
	WithIdleOverlay@normal:
		Sequence: idle-normal
		RequiresCondition: !build-incomplete
	WithBuildingPlacedOverlay:
		Sequence: build
	Targetable@TechStealerInfiltrate:
		TargetTypes: TechStealerInfiltrate
	InfiltrateForSupportPower:
		Proxy: latin_cgcnst.infiltrated
		Types: TechStealerInfiltrate

latin_cgcnst.infiltrated:
	Inherits: ^researched_upgrade.template
	Tooltip:
		Name: Stolen Syndicate Buildings Plans
	Buildable:
		Description:
	RenderSprites:
	ProvidesPrerequisite@buildingname:
		Prerequisite: latin_cgcnst
	RenderSprites:
		Image: latin_cgcnst

latin_cgweap:
	Inherits: ^RA2DefaultWeap
	Inherits@sell: ^SyndicateSpawnActorsOnSell
	Tooltip:
		Name: Syndicate Factory
	Buildable:
		Prerequisites: ~latin_cgcnst, latin_cgauto
	WithIdleOverlay@lights:
		Sequence: idle-lights
		RequiresCondition: !build-incomplete
	WithIdleOverlay@lights2:
		Sequence: idle-lights2
		RequiresCondition: !build-incomplete
	WithIdleOverlay@bib:
		Sequence: bib

