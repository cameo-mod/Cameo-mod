cgcnst.latin:
	Inherits: ra2gacnst
	Inherits@sell: ^SyndicateSpawnActorsOnSell
	Tooltip:
		Name: Syndicate Construction Yard
	Transforms:
		IntoActor: mcv.latin
	WithIdleOverlay@fans:
	WithIdleOverlay@top:
		Sequence: idle-top
		RequiresCondition: !build-incomplete
	WithIdleOverlay@normal:
		Sequence: idle-normal
		RequiresCondition: !build-incomplete
	WithBuildingPlacedOverlay:
		Sequence: build
	Targetable@TechStealerInfiltrate:
		TargetTypes: TechStealerInfiltrate
	InfiltrateForSupportPower:
		Proxy: cgcnst_infiltrated.latin
		Types: TechStealerInfiltrate

