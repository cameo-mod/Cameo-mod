		Name: primary
		Weapon: RA2120mm
		Recoil: 128
		RecoilRecovery: 38
		LocalOffset: 720,0,80
		MuzzleSequence: muzzle
		MuzzlePalette: ra2effect
		RequiresCondition: !rank-elite
	Armament@elite:
		Name: primary
		Weapon: RA2120mm_elite
		Recoil: 128
		RecoilRecovery: 38
		LocalOffset: 720,0,80
		MuzzleSequence: muzzle-2
		MuzzlePalette: ra2effect
