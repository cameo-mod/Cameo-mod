conyard_infiltrated.nax:
	Inherits: ^researched_upgrade.template
	Tooltip:
		Name: Stolen Naxis Buildings Plans
	Buildable:
		Description:
	RenderSprites:
	ProvidesPrerequisite@buildingname:
		Prerequisite: conyard.nax
	RenderSprites:
		Image: conyard.nax

up_resurrection.nax:
	Inherits: ^researched_upgrade.template
	Tooltip:
		Name: Resurrection
	Valued:
		Cost: 7500
	Buildable:
		BuildPaletteOrder: 100
		Queue: Research
		Description: Infantry killed by small arms leave corpses that can resurrect as zombies.
		Prerequisites: ~tech.nax, ~disabled
	RenderSprites:
		Image: undead.nax

up_me262.nax:
	Inherits: ^unit_upgrade_template
	Tooltip:
		Name: Unlock Me 262
	Buildable:
		Description: Upgrades the BF 109 to the Me 262
		Prerequisites: ~radar.nax, !up_me262.nax
	RenderSprites:
		Image: me262.nax

miniv2.nax:
	Inherits: ^ShootableMissile
	Inherits@Wunderwaffe: ^Wunderwaffe
	CruiseMissile:
		MaxAltitude: 2500
		MinAirborneAltitude: 125
		LaunchAngle: 125
		Speed: 250
		TurnSpeed: 25
		LaunchSounds: vbooat1a.wav
		MaxTargetMovement: 10000
		TrackTarget: true
		AirborneCondition: airborne
	LeavesTrails:
		Image: ra2_smokey
		Palette: ra2effect
		MovingInterval: 1
		Type: CenterPosition
		SpawnAtLastPosition: false
		Offsets: -450, 0, 0
	SpawnedExplodes:
		Weapon: YRBoomerSCUD
		EmptyWeapon: YRBoomerSCUD
		#RequiresCondition: !airborne
	MissileSpawnerSlave:
	RenderSprites:
		PlayerPalette: playerra2
	WithFacingSpriteBody:
	ActorStatValues:
		Upgrades: up_wunderwaffe.futu

sarubia_bomb.nax:
	Inherits: ^ShootableMissile
	Inherits@Wunderwaffe: ^Wunderwaffe
	Health:
		HP: 15000
	BallisticMissileCA:
		LaunchAngle: 5
		Speed: 80
		LaunchSounds: vdesatta.wav, vdesattb.wav
	MissileSpawnerSlave:
	SpawnedExplodes:
		Weapon: NaxiJadgDestroyer
		EmptyWeapon: NaxiJadgDestroyer
	RenderSprites:
		Image: sarubia_bomb.nax
		PlayerPalette: playerra2
	WithFacingSpriteBody:
	WithShadow:
	Mine:
		CrushClasses: mine
		DetonateClasses: mine
		BlockFriendly: true
	ActorStatValues:
		Upgrades: up_wunderwaffe.futu
