miniv2.nax:
	Inherits: ^ShootableMissile
	Inherits@Wunderwaffe: ^Wunderwaffe
	CruiseMissile:
		MaxAltitude: 2500
		MinAirborneAltitude: 125
		LaunchAngle: 125
		Speed: 250
		TurnSpeed: 25
		LaunchSounds: vbooat1a.wav
		MaxTargetMovement: 10000
		TrackTarget: true
		AirborneCondition: airborne
	LeavesTrails:
		Image: ra2_smokey
		Palette: ra2effect
		MovingInterval: 1
		Type: CenterPosition
		SpawnAtLastPosition: false
		Offsets: -450, 0, 0
	SpawnedExplodes:
		Weapon: YRBoomerSCUD
		EmptyWeapon: YRBoomerSCUD
		#RequiresCondition: !airborne
	MissileSpawnerSlave:
	RenderSprites:
		PlayerPalette: playerra2
	WithFacingSpriteBody:
	ActorStatValues:
		Upgrades: up_wunderwaffe.nax

sarubia_bomb.nax:
	Inherits: ^ShootableMissile
	Inherits@Wunderwaffe: ^Wunderwaffe
	Health:
		HP: 15000
	BallisticMissileCA:
		LaunchAngle: 5
		Speed: 80
		LaunchSounds: vdesatta.wav, vdesattb.wav
	MissileSpawnerSlave:
	SpawnedExplodes:
		Weapon: NaxiJadgDestroyer
		EmptyWeapon: NaxiJadgDestroyer
	RenderSprites:
		Image: sarubia_bomb.nax
