enforcer.futu:
	Inherits: ^Soldier
	Inherits@Template: ^MeleeInfantryTemplate
	Inherits@EXPERIENCE: ^GainsExperienceRA2
	Inherits@AUTOTARGET: ^AutoTargetAllAssaultMove
	Inherits@DECORATIONS: ^InfantryExperienceHospitalHazmatOverrides
	Inherits@anim: ^RA2Infantry
	Inherits@editorhack: ^DeployableInfantryEditor
	Inherits@vo: ^AttackFrontalVoice
	Inherits@bot: ^SiegeMode
	Inherits@AntiInf: ^PrioritizeInfantry
	Inherits@VOICES: ^WithFeedbackVoiceLines
	Inherits@FutureTechEqualizerUpgrades: ^FutureTechEqualizerUpgrades
	Tooltip:
		Name: Enforcer
	Valued:
		Cost: 300
	Buildable:
		BuildPaletteOrder: 20
		Prerequisites: ~egpile.futu
		Queue: Infantry, RAInfantry
		Description: actor_futu_enforcer.description
	Mobile:
		Speed: 60
	Health:
		HP: 30000
	ChangesHealth@SelfHealing:
		Step: 30
	AutoTarget:
		InitialStance: Defend
	RenderRangeCircle:
		RequiresCondition: deployed
	RevealOnFire:
		ArmamentNames: primary, deployed
	Armament@PRIMARY:
		Weapon: FutureEnforcerShotgun
		RequiresCondition: !deployed && !rank-elite
		LocalOffset: 128,0,256
	Armament@PRIMARY2:
		Name: deployed
		Weapon: FutureEnforcerShotgunDeployed
		RequiresCondition: deployed && !rank-elite
		LocalOffset: 128,0,256
		Turret: deploy
	Armament@GARRISONED:
		Name: garrisoned
		Weapon: FutureEnforcerShotgunDeployed
		RequiresCondition: !rank-elite
	Armament@ELITE:
		Weapon: FutureEnforcerShotgunE
		RequiresCondition: !deployed && rank-elite
		LocalOffset: 128,0,256
	Armament@ELITE2:
		Name: deployed
		Weapon: FutureEnforcerShotgunDeployedE
		RequiresCondition: deployed && rank-elite
		LocalOffset: 128,0,256
		Turret: deploy
	Armament@GARRISONEDELITE:
		Name: garrisoned
		Weapon: FutureEnforcerShotgunDeployedE
		RequiresCondition: rank-elite
	Armament@BOTAA:
		Weapon: aadeploytargeting.8c0
		Name: targeting
		RequiresCondition: botmicro
	AttackFrontal:
		Armaments: primary, targeting
		RequiresCondition: undeployed
		FacingTolerance: 2
	AttackTurreted@deployed:
		Armaments: deployed
		Turrets: deploy
		PauseOnCondition: disabled
		RequiresCondition: deployed
		Voice: Attack
	Turreted:
		Turret: deploy
		RealignDelay: -1
		TurnSpeed: 1023
		InitialFacing: 368
	WithSpriteTurret@idle:
		Turret: deploy
		Sequence: deployed
		RequiresCondition: deployed && !animate-turret
	WithSpriteTurret@animated:
		Turret: deploy
		Sequence: shoot-deployed
		RequiresCondition: deployed && animate-turret
	WithSpriteBody:
		Sequence: dot
		Name: dot
		RequiresCondition: !undeployed
	GrantConditionOnAttack:
		Condition: animate-turret
		RevokeDelay: 5
		ArmamentNames: deployed
	WithInfantryBody:
		-DefaultAttackSequence:
		AttackSequences:
			primary: shoot
		RequiresCondition: undeployed
	WithMakeAnimation:
		Sequence: deploy
		BodyNames: dot
	GrantConditionOnDeploy:
		Facing: 384
		DeploySounds: iggidepa.wav
		UndeploySounds: iggidepa.wav
		RequiresCondition: !parachute
		Voice: Deploy
	TakeCover:
		RequiresCondition: undeployed
	Crushable:
		RequiresCondition: undeployed
	Crushable@deployed:
		CrushClasses: vehicle
		RequiresCondition: !undeployed
	DamageMultiplier@deployed:
		Modifier: 60
		RequiresCondition: deployed
	Voiced:
		VoiceSet: GGIVoice
	QuantizeFacingsFromSequence:
		Sequence: stand
	ActorStatValues:
		Upgrades: ra2_allies_upgrade_assaultsquadtraining, ra2_allies_upgrade_vanguardtraining, ra2_allies_upgrade_infiltratorstraining, ra2_allies_upgrade_elitegi, ra2_allies_upgrade_thunderboltmissiles

