^TKMSpawnActorsOnSell:
	SoundOnDamageTransition:
		DamagedSounds: expnew01.aud, expnew02.aud, expnew04.aud, expnew05.aud
		DestroyedSounds: expnew03.aud, expnew07.aud, expnew08.aud, expnew11.aud
	SpawnActorsOnSell:
		ActorTypes: tkm_engineer, tkm_rifleman, tkm_rifleman, tkm_rifleman
	Building:
		BuildSounds: tsplace2.aud

####################################################################################################
#		TKM Upgrade and Inherits
####################################################################################################

^upberezkacloakupgrade:
	GrantConditionOnPrerequisite@berezkacloak:
		Condition: upspeed
		Prerequisites: tkm_upgrade_berezkaarsenalupgrade
	SpeedMultiplier@berezkacloak:
		Modifier: 150
		RequiresCondition: upspeed

^tkm_upgrade_pointdefensesystem:
	GrantConditionOnPrerequisite@tkm_upgrade_pointdefensesystem:
		Condition: tkm_upgrade_pointdefensesystem
		Prerequisites: tkm_upgrade_pointdefensesystem

^tkm_upgrade_semiautoriflesupgrade:
	ActorStatValues:
		Upgrades: tkm_upgrade_berezkaarsenalupgrade, tkm_upgrade_semiautoriflesupgrade

^tkm_upgrade_twinrocketsupgrade:
	ActorStatValues:
		Upgrades: tkm_upgrade_berezkaarsenalupgrade, tkm_upgrade_twinrocketsupgrade

^tkm_upgrade_titanarmorpiercingbulletsupgrade:
	ActorStatValues:
		Upgrades: tkm_upgrade_natoarsenalupgrade, tkm_upgrade_titanarmorpiercingbulletsupgrade

^tkm_upgrade_incendiaryrocketsupgrade:
	ActorStatValues:
		Upgrades: tkm_upgrade_natoarsenalupgrade, tkm_upgrade_incendiaryrocketsupgrade

^tkm_upgrade_infantryupgrade:
	DamageMultiplier@terran_upgrade_infantryweaponslevel1:
		Modifier: 70
		RequiresCondition: tkm_upgrade_infantryupgrade
	FirepowerMultiplier@terran_upgrade_infantryweaponslevel1:
		Modifier: 125
		RequiresCondition: tkm_upgrade_infantryupgrade
	GrantConditionOnPrerequisite@tkm_upgrade_infantryupgrade:
		Condition: tkm_upgrade_infantryupgrade
		Prerequisites: tkm_upgrade_infantryupgrade

