tkm_upgrade_berezkaarsenalupgrade:
	Inherits: ^researched_upgrade_template
	Tooltip:
		Name: Berezka Arsenal Upgrade
	Valued:
		Cost: 1000
	Buildable:
		BuildPaletteOrder: 80
		Queue: Upgrades
		Description: Commits to the Berezka Upgrade Tree, which focuses on cloak and hit and run units. Enables cloak for Basic Infantry Units and increase their movespeed.
		Prerequisites: ~tkm_constructionyard, ~!tkm_upgrade_berezkaarsenalupgrade, ~!tkm_upgrade_titanarsenalupgrade, ~!tkm_upgrade_natoarsenalupgrade
	RenderSprites:
		Image: berezkaupgradeicon
	ProductionIconMutualExclusion:
		Group: tkm_arsenal_choice
		OutlineColor: 22C55E
	ProvidesPrerequisite:
