	Inherits@fx_cover1: ^Effect_Flame_Heavy
	# SF VERIFIER weapon (maintainer 2026-07-20): SmallArms + Chaingun +
	# Laser triad, 4000 each = 12000 @ reload 50 = 240 DPS (WC 1.0), exactly
