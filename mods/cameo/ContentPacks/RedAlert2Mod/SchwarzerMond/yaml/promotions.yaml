##############################################
# Schwarzer Mond 3x4 Promotion Grid
# (maintainer's final layout 2026-07-17 — ROADMAP P2 RESOLVED)
# Column 1 (left):   Infantry
# Column 2 (middle): Vehicles/Tanks
# Column 3 (right):  Aircraft/Artillery/Support
# Tier ladder: rank1 = T1/T2, rank2 = T2/T3, rank3 = T3, rank4 = capstones.
# The promotion gates the OPTION; each unit keeps its tech prerequisites.
##############################################

# Column 1 — Infantry

schwarzermond_promotion_noidmg:
	Inherits: ^PromotionUpgradeTemplate
	Tooltip:
		Name: Unlock Noid MG
	Buildable:
		BuildPaletteOrder: 1
		Queue: Promotions
		Description: Unlocks the Noid MG Armor walker.
		Prerequisites: ~schwarzermond_constructionyard, !schwarzermond_promotion_noidmg, rank1
	RenderSprites:
		Image: schwarzermond_noidmgarmor
