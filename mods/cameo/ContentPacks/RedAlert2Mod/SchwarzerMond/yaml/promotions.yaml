schwarzermond_promotion_bermensch:
	Inherits: ^promotion_upgrade.template
	Tooltip:
		Name: Unlock Übermensch
	Buildable:
		BuildPaletteOrder: 1
		Queue: Promotions
		Description: Unlocks the Übermensch infantry unit.
		Prerequisites: ~schwarzermond_constructionyard, !schwarzermond_promotion_bermensch, rank1
	RenderSprites:
		Image: schwarzermond_ubermensch
	ProvidesPrerequisite:

