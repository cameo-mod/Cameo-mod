		Name: Cryptofascism
	Valued:
		Cost: 5000
	Buildable:
		BuildPaletteOrder: 90
		Queue: Research
		Description: Every Schwarzer Mond unit generates 1 credit per second, and every enemy killed mints MoonCoin worth 25% of the victim's value.
			The Reich pays its soldiers in MoonCoin, the official memecoin of the Reichsmark 2.0 blockchain. High Command holds 94% of the supply in a cold wallet labelled NOT A RUG, has announced that the chart only goes up, and reminds all personnel that selling is treason. Casualties are not losses, they are liquidity events.
		Prerequisites: ~schwarzermond_techcenter, !schwarzermond_upgrade_cryptofascism
