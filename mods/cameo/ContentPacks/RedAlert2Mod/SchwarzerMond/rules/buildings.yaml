meteorray.nax2:
	Inherits: ^RA2Building
	Inherits@SW: ^PrimarySuperweapon
	Inherits@shape: ^3x3Shape
	Inherits@sell: ^SpaceNaxisSpawnActorsOnSell
	Tooltip:
		Name: Meteor Traction Ray
	Buildable:
		BuildPaletteOrder: 100
		Prerequisites: ~conyard.nax2, tech.nax2, !meteorray.nax2, ~techlevel.superweapons
		Queue: Defence, RADefence
		Description: actor_namisl.description
	Building:
		Footprint: xxx xxx xxx
		Dimensions: 3,3
	SelectionDecorations:
	DetonateWeaponPowerCA:
		AllowMultiple: true
		OrderName: NaxiMeteor
		PauseOnCondition: disabled
		Prerequisites:
			1: ~techlevel.superweapons
		IconImage: ra2namisl
		Icons:
			1: icon2
		Cursor: ability
		ChargeInterval: 10500
		ActivationDelay: 50
		ActivationSequence:
		Names:
			1: Meteor Blitzkrieg
		Descriptions:
			1: Throw some meteors to ground.
		Weapons:
			1: NaxiMeteorBlitzkriegActivate
		EndChargeSound: snukread.wav
		EndChargeSpeechNotification: NuclearWeaponAvailable
		EndChargeTextNotification: Meteor Strike ready.
		SelectTargetSpeechNotification: SelectTarget
		SelectTargetTextNotification: Select target.
		InsufficientPowerSpeechNotification: InsufficientPower
		LaunchSpeechNotification: NuclearWeaponLaunched
		LaunchTextNotification: Warning: Meteor Strike launched.
		IncomingSpeechNotification: NuclearWarheadApproaching
		IncomingTextNotification: Warning: Meteor Strike launched.
		LaunchSound: snuksire.wav
		IncomingSound: snuksire.wav
		DisplayRadarPing: True
		DisplayTimerRelationships: Ally, Neutral, Enemy
		CameraRemoveDelay: 500
		Duration: 250
		ActiveCondition: active
		ArrowSequence: arrow
		ClockSequence: clocklarge
		CircleSequence: circles
		DisplayBeacon: true
		BeaconPosters:
			1: atomic
		TargetCircleRanges:
			1: 10000
		TargetCircleColors: ff000080
		BeaconActor: BLASTRADIUS.atomic
		CameraRange: 10000
	SupportPowerChargeBar:
	WithSupportPowerActivationAnimation:
	ProvidesPrerequisite@swlimit:
		Prerequisite: meteorray.nax2

