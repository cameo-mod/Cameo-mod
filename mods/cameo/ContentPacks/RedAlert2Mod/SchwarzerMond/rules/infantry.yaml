uber.nax2:
	Inherits: ^Soldier
	Inherits@Template: ^HeavyInfantryTemplate
	Inherits@EXPERIENCE: ^GainsExperienceRA2
	Inherits@AUTOTARGET: ^AutoTargetAllAssaultMove
	Inherits@DECORATIONS: ^InfantryExperienceHospitalHazmatOverrides
	Inherits@anim: ^RA2Infantry
	Inherits@vo: ^AttackFrontalVoice
	Inherits@PUpgrade: ^NaxiGreenPlasmaUpgrade
	Valued:
		Cost: 700
	Tooltip:
		Name: Übermensch
	Buildable:
		BuildPaletteOrder: 30
		Prerequisites: ~tech.nax2
		Queue: Infantry, RAInfantry
		Description: template-scout-infantry.description
	Mobile:
		Speed: 64
	Health:
		HP: 64000
	ChangesHealth@SelfHealing:
		Step: 64
	Armament@PRIMARY:
		Weapon: ÜbermenschLaser
		LocalOffset: 500,0,400
		RequiresCondition: !rank-elite
	Armament@ELITE:
		Weapon: ÜbermenschLaserE
		LocalOffset: 500,0,400
		RequiresCondition: rank-elite
	Armament@GARRISONED:
		Name: garrisoned
		Weapon: ÜbermenschLaser
		RequiresCondition: !rank-elite
	Armament@GARRISONEDELITE:
		Name: garrisoned
		Weapon: ÜbermenschLaserE
		RequiresCondition: rank-elite
	AttackFrontal:
		FacingTolerance: 0
	Crushable:
		CrushClasses: vehicle
	Voiced:
		VoiceSet: NaxiUbermenVoice

