armor_mg.nax2:
	Inherits: ^Walker
	Inherits@Template: ^HeavyInfantryTemplate
	Inherits@anim: ^RA2Vehicle
	Inherits@EXPERIENCE: ^GainsExperienceRA2
	Inherits@AUTOTARGET: ^AutoTargetAllAssaultMove
	Inherits@detect: ^GenericGroundDetector
	Inherits@vo: ^AttackFrontalVoice
	Inherits@EMP: ^FrontalEMP
	Inherits@MC: ^MCImmune
	Inherits@HackableRobot: ^HackableRobot
	Inherits@LUpgrade: ^NaxiYellowLaserUpgrade
	Selectable:
		Bounds: 600, 600, 0, -125
	Valued:
		Cost: 500
	Tooltip:
		Name: Noid MG Armor
	Buildable:
		BuildPaletteOrder: 75
		Prerequisites: ~radar.nax2
		Queue: Infantry, RAInfantry
		Description: actor-aamecha.description
	Mobile:
		Speed: 40
		TurnSpeed: 16
		Locomotor: tracked
	Health:
		HP: 50000
	Repairable:
		HpPerStep: 2500
	ChangesHealth@SelfHealing:
		Step: 50
	Armor:
		Type: Superheavy
	Armament@PRIMARY:
		Weapon: NaxiMP40Laser
		LocalOffset: 500,0,400
		RequiresCondition: !rank-elite && !up_ylaser.nax2
	Armament@ELITE:
		Weapon: NaxiMP40LaserE
		LocalOffset: 500,0,400
		RequiresCondition: rank-elite && !up_ylaser.nax2
	Armament@PRIMARY_UP:
		Weapon: Lunar_YellowMP40Laser
		LocalOffset: 500,0,400
		RequiresCondition: !rank-elite && up_ylaser.nax2
	Armament@ELITE_UP:
		Weapon: Lunar_YellowMP40LaserE
		LocalOffset: 500,0,400
		RequiresCondition: rank-elite && up_ylaser.nax2
	AttackFrontal:
		FacingTolerance: 20
	WithInfantryBody:
		IdleSequences: idle1, idle2
		MinIdleDelay: 90
		MaxIdleDelay: 270
		DefaultAttackSequence: shoot
	BodyOrientation:
		QuantizedFacings: 32
	-QuantizeFacingsFromSequence:
	Passenger:
		Weight: 1
	Voiced:
		VoiceSet: NaxiRobotVoice
	RenderSprites:
		PlayerPalette: playerra2
