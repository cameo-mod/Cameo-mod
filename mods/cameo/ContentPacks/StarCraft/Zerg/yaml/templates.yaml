		# TerrainTypes: ZergSoil ##########

^SCBREEDFASTER:
	ExternalCondition@Fasterbreed:
		Condition: SCFASTERBREED
	ProvidesPrerequisite@fasterbreed:
		Prerequisite: SCFASTERBREED
		RequiresCondition: SCFASTERBREED
	ProductionTimeMultiplier@fasterbreed:
		Prerequisites: SCFASTERBREED
		Multiplier: 75
		Queue: SCZergInfantry

^ZergBurrow:
	Inherits@cloak: ^CloakedVehicleWithUpgrade
	Inherits@bot: ^SiegeMode
	AttackFrontal:
		FacingTolerance: 0
		RequiresCondition: undeployed
	WithSpriteBody@deployed:
		Sequence: deployed
		Name: deployed
		RequiresCondition: !undeployed
	WithInfantryBody:
		RequiresCondition: undeployed
	WithMakeAnimation:
		BodyNames: deployed
		Sequence: deploy
		Name: deployed
		RequiresCondition: undeployed
	GrantConditionOnDeploy:
		DeploySounds: zburrowup.wav
		UndeploySounds: zburrowdown.wav
		RequiresCondition: !parachute
	Cloak:
		InitialDelay: 50
		CloakDelay: 50
		RequiresCondition: deployed
		CloakStyle: Alpha
		IsPlayerPalette: true
	IssueOrderToBot@AI:
		OrderTrigger: BecomingIdle
		OrderChance: 50
		OrderInterval: 1000
		RequiresCondition: botmicro

^ZergDoubleSpawner:
	ProductionCostMultiplier@ZergDoubleSpawner:
