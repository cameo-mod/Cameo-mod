	Power:
		Amount: 200
	ProvidesPrerequisite@buildingname:
	Buildable:
		Prerequisites: ~sccommandcenter
		Queue: Building, RABuilding
		Description: actor-scsupplydepot.description
	Building:
		Footprint: xx xx
		Dimensions: 2,2
		BuildSounds: tscupd00.aud
	Health:
		HP: 200000
	StoresResources:
		Capacity: 4000
	RevealsShroud:
		Range: 5c0
	WithResourceStoragePipsDecoration:
		Position: BottomLeft
		RequiresSelection: true
		PipCount: 10
		FullSequence: pip-yellow
	WithIdleOverlay@fans:
		RequiresCondition: supplydepotupg
		Sequence: fans
		Palette: greyscale
	DamageMultiplier@supplydepotupg:
		RequiresCondition: supplydepotupg
		Modifier: 50
	StoresPlayerResources@supplydepotupg:
		Capacity: 4000
		RequiresCondition: supplydepotupg
	GrantConditionOnPrerequisite@upsupplydepot1:
		Condition: upsupplydepot1
		Prerequisites: upsupplydepot1
	PowerMultiplier@upsupplydepot1:
		Modifier: 150
		RequiresCondition: upsupplydepot1 && !upsupplydepot2
	GrantConditionOnPrerequisite@upsupplydepot2:
		Condition: upsupplydepot2
		Prerequisites: upsupplydepot2
	PowerMultiplier@upsupplydepot2:
		Modifier: 200
		RequiresCondition: upsupplydepot2
	ProvidesPrerequisite:
		Prerequisite: supplydepotupgradeavailable
		RequiresCondition: !supplydepotupg
	PowerMultiplier@supplydepotupg:
		Modifier: 200
		RequiresCondition: supplydepotupg
	Pluggable:
		Offset: 0,0
		Conditions:
			scsupplydepot: supplydepotupg
		Requirements:
			scsupplydepot: !build-incomplete && !supplydepotupg
	WithBuildingBib:
	Voiced:
		VoiceSet: SCSupplyCenterVoice
	RenderSprites:
		PlayerPalette: player_rgba
	ActorStatValues:
		Upgrades: upsupplydepot1, upsupplydepot2

