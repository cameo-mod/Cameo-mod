sc_zerg_larva:
	Inherits: ^Soldier
	Tooltip:
		Name: Zerg Larva
	Buildable:
		Description: actor-sc_zerg_larva.description
	Valued:
		Cost: 50
	Mobile:
		Speed: 1
		CanTurnWhileDisabled: False
		ImmovableCondition: disable_movement
		RequireForceMoveCondition: disable_movement
		Locomotor: foot
	Health:
		HP: 10000
	Armor:
		Type: Light
	RevealsShroud:
		Range: 1c0
	GrantConditionAfterDelay:
		Condition: disable_movement
		ShowSelectionBar: false
		Delay: 10
	WithInfantryBody:
		IdleSequences: idle
		DefaultAttackSequence: idle
		RequiresCondition: !sc_zerg_egg
	WithSpriteBody@egg:
		Name: egg
		Sequence: makeunit
		IsPlayerPalette: True
		RequiresCondition: sc_zerg_egg
	ExternalCondition@EGG:
		Condition: sc_zerg_egg
	WithDeathAnimation:
		UseDeathTypeSuffix: False
	Voiced:
		VoiceSet: SCBroodlingVoice
	-DeathSounds@NORMAL:
	-SpawnActorOnDeath@SCSWARMLING:
	-WithDeathAnimation:
	-DamagedByTerrain:
	-Crushable:
	-TakeCover:
	-ActorLostNotification:
	DroneSpawnerSlave:
	-MapEditorData:
	HitShape:
		Type: Circle
			Radius: 256
	RejectsOrders:
	RejectsMoveToAttack:
	-Selectable:
	Interactable:
	SpeedMultiplier@static:
		Modifier: 0
		RequiresCondition: stopmove
	SpeedMultiplier@egg:
		Modifier: 0
		RequiresCondition: sc_zerg_egg
	GrantConditionOnMovement@static:
		ValidMovementTypes: Horizontal, Vertical, Turn
		Condition: stopmove
	Wanders:
		MinMoveDelay: 150
		MaxMoveDelay: 750
		PauseOnCondition: sc_zerg_egg
	RenderSprites:
		PlayerPalette: player_rgba

