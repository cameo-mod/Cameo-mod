^Effect_MissileAP_Heavy_Rocket_SC:
	Inherits: ^Effect_MissileAP_Heavy
	-Warhead@DuneRock:
	-Warhead@DuneSand:
	-Warhead@RA2Crater:
	-Warhead@Concrete:
