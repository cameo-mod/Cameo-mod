^SCRocket:
	Inherits@wh: ^Warhead_MissileAP_Heavy
	Inherits@proj: ^Projectile_Missile_Heavy_Rocket_SC
	Inherits@fx: ^Effect_MissileAP_Heavy_Rocket_SC
	ReloadDelay: 50
	Range: 5000
	Report: ROCKET1.WAV
	Warhead@EffectAir:
		ImpactSounds: EXPLLG2.WAV
	Warhead@Effect:
		ImpactSounds: EXPLSML1.WAV

^Effect_Explosion_Large_SC:
	Inherits: ^Effect_MissileHE_Medium
	Warhead@Effect: CreateEffect
		Explosions: ra2_large_explosion
		ExplosionPalette: ra2effect
		ImpactSounds: gexpbara.wav, gexpbarb.wav, gexpbarc.wav
		ValidTargets: Ground, Ship
		ImpactActors: false
	Warhead@EffectWater: CreateEffect
		Explosions: ra2_large_watersplash
		ExplosionPalette: ra2effect
		ImpactSounds: gexpwasa.wav
		ValidTargets: Water, Underwater
		InvalidTargets: Ship, Structure, Bridge

^Effect_Watersplash_Huge_SC:
	Inherits: ^Effect_MissileAP_Heavy
	-Warhead@Effect:
	-Warhead@EffectAir:
	Warhead@EffectWater: CreateEffect
		Explosions: ra2_huge_watersplash
		ExplosionPalette: ra2effect
		ValidTargets: Water, Underwater
		InvalidTargets: Ship, Structure, Bridge
