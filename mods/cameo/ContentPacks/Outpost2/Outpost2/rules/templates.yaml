^OP2Building:
	GrantConditionOnDamageState:
		ValidDamageStates: Undamaged, Light, Medium
		Condition: statusGreen
	GrantConditionOnDamageState@2:
		ValidDamageStates: Heavy, Critical
		Condition: statusRed
	WithIdleOverlay:
		RequiresCondition: statusGreen
		Sequence: statusgreen
	WithIdleOverlay@2:
		RequiresCondition: statusRed
		Sequence: statusred
	RenderSprites:

^op2_engineer:
	Inherits@selection: ^SelectableEconomicUnit
	Inherits@EXPERIENCE: ^GainsExperience
	Inherits@DECORATIONS: ^InfantryExperienceHospitalHazmatOverrides
	Inherits@engineer: ^EngineerDefaultWeapons
	Inherits@isengineer: ^IsEngineer
	Valued:
		Cost: 500
	Buildable:
		BuildPaletteOrder: 15
		BuildDuration: 250
		BuildDurationModifier: 100
	Mobile:
		Speed: 90
	DamageMultiplier@DamageReduction:
		Modifier: 88
	Health:
		HP: 7200
	AutoTargetPriority@Repair:
		ValidTargets: Repair, Repairing
		ValidStances: Ally
		Priority: 2
	AutoTargetPriority@DEFAULT:
		ValidStances: Enemy, Neutral
	AutoTargetPriority@ATTACKANYTHING:
		ValidStances: Enemy, Neutral
	AutoTarget:
		ScanRadius: 4
	Passenger:
		PipType: Yellow
	InstantlyRepairs:
		Types: building
		EnterBehaviour: Dispose
		RepairSound: urepair.wav
	InstantlyRepairs@Tech:
		Types: tech
		EnterBehaviour: Dispose
		RepairSound: urepair.wav
	InstantlyRepairs@Civ:
		Types: civ
		ValidRelationships: Ally, Neutral
		EnterBehaviour: Dispose
		RepairSound: urepair.wav
	RepairsBridges:
	CaptureManager:
	GrantConditionOnPrerequisite@GLOBALREUSABLEENGINEER:
		Condition: global-reusable-engineers
		Prerequisites: global-reusable-engineers
	Captures:
		RequiresCondition: !global-reusable-engineers
		CaptureTypes: building, defense, tech
		PlayerExperience: 500
		ConsumedByCapture: True
	Captures@REUSABLE:
		RequiresCondition: global-reusable-engineers
		CaptureTypes: building, defense, tech
		PlayerExperience: 500
		CaptureDelay: 375
		ConsumedByCapture: False
		EnterCursor: ability
		EnterBlockedCursor: move-blocked
	UpdatesPlayerStatistics:
		AddToArmyValue: false

