EDEN_CONVEC_STRUCTURE_FACTORY:
	Inherits: ^Vehicle
	Inherits@Template: ^SupportVehicleTemplate
	Inherits@selection: ^SelectableSupportUnit
	Inherits@mcv: ^MCV
	Tooltip:
		Name: Eden Convec - Structure Factory
	Buildable:
		Prerequisites: ~eden_university
		Queue: Vehicle, RAVehicle
		Description: eden-convec-structure-factory.description
	Transforms:
		IntoActor: eden_factory_structure
		Offset: -1,-1
		Facing: 432
		TransformSounds: constru2.aud, hvydoor1.aud
		NoTransformNotification: BuildingCannotPlaceAudio
	Voiced:
		VoiceSet: edenConvecVoice
	RenderSprites:
		Image: eden_convec

EDEN_CARGOTRUCK_EMPTY:
	Inherits: ^Vehicle
	Inherits@Template: ^HarvesterTemplate
	Inherits@selection: ^SelectableEconomicUnit
	Inherits@harv: ^Harvester
	Tooltip:
		Name: Eden Cargo Truck
	Valued:
		Cost: 1000
	Buildable:
		BuildPaletteOrder: 10
		Prerequisites: ~eden_factory_vehicle, eden_smelter_common
		Queue: Vehicle, RAVehicle
		Description: template-harvester.description
	Harvester:
		BaleLoadDelay: 5
		BaleUnloadDelay: 1
		EmptyCondition: no-tiberium
	Health:
		HP: 110000
	Repairable:
		HpPerStep: 5500
	ChangesHealth@SelfHealing:
		Step: 44
	Armor:
		Type: Medium
	Mobile:
		Speed: 85
		TurnSpeed: 17
	StoresResources:
		Capacity: 35
	WithHarvesterSpriteBody:
		ImageByFullness: eden_cargotruck_empty, eden_cargotruck_commonore
	-WithFacingSpriteBody:
	WithHarvestAnimation:
	WithDockingAnimation:
	WithHarvestOverlay@harvesting:
		Sequence: harvesting
		Palette: ra2effect
	FireWarheadsOnDeath:
		RequiresCondition: !no-tiberium
		Weapon: OreExplosion
	FireWarheadsOnDeath@empty:
		RequiresCondition: no-tiberium
		Weapon: UnitExplodeHarvEmpty
	SelectionDecorations:
	Voiced:
		VoiceSet: cargoTruckVoice

