PLYMOUTH_MINV:
	Inherits: ^Mine
	RenderSprites:
		Image: plymouth_esg_mine
	FireWarheadsOnDeath:
		Weapon: PLYMineExplosive
	Mine:
		AvoidFriendly: true
		BlockFriendly: false
	-Immobile:
	Mobile:
		Locomotor: wheeled
		Speed: 1
		PauseOnCondition: dontmove
	GrantCondition@dontmove:
		Condition: dontmove
	RejectsOrders:
	Health:
		HP: 10000
	ChangesHealth@timed:
		Delay: 3
		PercentageStep: -1
		StartIfBelow: 101
	Targetable@plymouth_minv:
		TargetTypes: plymouth_minv

