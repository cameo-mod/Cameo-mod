tkm_upgrade_berezkaarsenalupgrade:
	Inherits: ^researched_upgrade.template
	Tooltip:
		Name: Berezka Arsenal Upgrade
	Valued:
		Cost: 1000
	Buildable:
		BuildPaletteOrder: 80
		Queue: Upgrades
