tkmrefinery:
	Inherits: ^RA2Building
	Inherits@sell: ^TKMSpawnActorsOnSell
	Inherits@ref: ^Refinery
	Inherits@shape: ^2x2Shape
	Inherits: ^BuildingPlugProducer
