## Ordos-local upgrade templates (condition grants + effects).
## Units inherit these; the matching up_*.ordos research provides the
## prerequisite that flips the condition on.

^VehicleShieldsUpgradeOrdos:
	GrantConditionOnPrerequisite@ordos_upgrade_shields:
		Condition: ordos_upgrade_shields
		Prerequisites: ordos_upgrade_shields
	GrantCondition@shieldpermanent:
		Condition: shieldpermanent
		RequiresCondition: ordos_upgrade_shields
	Shielded:
		DamageRegenDelay: 125
		RegenAmount: 10
		RegenInterval: 1
		ShieldsUpCondition: shielded
		SelectionBarColor: 8888FFFF
		RequiresCondition: !disabled && (ordos_upgrade_shields || shieldgen || shielded)
	ChangesShield@shielddischarge:
		Delay: 10
	ActorStatValues:
		Upgrades: ordos_upgrade_shields
	Armor@shielded:
		Type: Shield
		RequiresCondition: shielded

^BiologicalWarfareUpgradeOrdos:
	ReloadDelayMultiplier@ordos_upgrade_biologicalwarfare:
		RequiresCondition: ordos_upgrade_biologicalwarfare
		Modifier: 90
	SpeedMultiplier@ordos_upgrade_biologicalwarfare:
		RequiresCondition: ordos_upgrade_biologicalwarfare
		Modifier: 110
	DamageMultiplier@ordos_upgrade_biologicalwarfare:
		RequiresCondition: ordos_upgrade_biologicalwarfare
		Modifier: 90
	GrantConditionOnPrerequisite@ordos_upgrade_biologicalwarfare:
		Condition: ordos_upgrade_biologicalwarfare
		Prerequisites: ordos_upgrade_biologicalwarfare
	ActorStatValues:
		Upgrades: ordos_upgrade_biologicalwarfare

