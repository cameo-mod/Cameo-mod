swarmer.ordos:
	Inherits: ^RANeutralPlane
	Inherits@Template: ^FighterTemplate
	Inherits@exp: ^GainsExperienceRA
	Inherits@AUTOTARGET: ^AutoTargetAllAssaultMove
	Inherits@GAINSEXPERIENCE: ^GainsExperience
	Inherits@AntiAir: ^PrioritizeAir
	Inherits@AntiInf: ^PrioritizeInfantry
	Inherits@VehicleShieldsUpgradeOrdos: ^VehicleShieldsUpgradeOrdos
	Inherits@ContrabandUpgradeOrdos: ^ContrabandUpgradeOrdos
	Tooltip:
		Name: Swarmer Drone
	Valued:
		Cost: 800
	Buildable:
		Queue: Aircraft, RAAircraft
		BuildPaletteOrder: 30
		Prerequisites: ~high_tech_factory.ordos
		Description: Light plane armed with dual machine guns. \nCan attack air.\n Strong vs Infantry and Air
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	Health:
		HP: 20000
	Repairable:
		HpPerStep: 1000
	ChangesHealth@SelfHealing:
		Step: 20
	Shielded:
		RegenAmount: 40
	AttackAircraft:
		FacingTolerance: 320
	Armament@PRIMARY:
		Weapon: d2kChainGun
		LocalOffset: 256,-213,0, 256,213,0
		MuzzleSequence: muzzle
		MuzzlePalette: ra2effect
		PauseOnCondition: !ammo
		RequiresCondition: !up_laserguns.ordos
	Armament@PRIMARYLaser:
		Weapon: d2kChainGun_upgrade
		LocalOffset: 256,-213,0, 256,213,0
		MuzzleSequence: muzzle
		MuzzlePalette: ra2effect
		PauseOnCondition: !ammo
		RequiresCondition: up_laserguns.ordos
	Aircraft:
		CruiseAltitude: 1920
		Speed: 260
		TurnSpeed: 17
	Guard:
		Voice: Guard
	Guardable:
	WithMuzzleOverlay:
	Targetable:
		TargetTypes: Air, Plane
	SpawnActorOnDeath:
		Actor: swarmer_husk.ordos
	Selectable:
		Bounds: 1280, 1024, 0, 0
	SelectionDecorations:
	Voiced:
		VoiceSet: EBFDAAMine
	RenderSprites:
		PlayerPalette: player_rgba
	AmmoPool:
		Ammo: 10
		AmmoCondition: ammo
	ReloadAmmoPool:
		Delay: 24
		Count: 1
	WithAmmoPipsDecoration:
		Position: BottomLeft
		RequiresSelection: True
		PipCount: 10
	ActorStatValues:
		Upgrades: up_shield.ordos, up_contraband.ordos, up_laserguns.ordos

aa_mine.ordos:
	Inherits: ^RANeutralPlane
	Inherits@Template: ^BomberTemplate
	Inherits@AUTOTARGET: ^AutoTargetAir
	Inherits@exp: ^GainsExperienceRA
	Inherits@AntiAir: ^PrioritizeAir
	Inherits@Cloak: ^CloakedAircraft
	Inherits@ContrabandUpgradeOrdos: ^ContrabandUpgradeOrdos
	AutoTarget:
		InitialStance: ReturnFire
	Valued:
		Cost: 500
	Buildable:
		Queue: Aircraft, RAAircraft
		BuildPaletteOrder: 30
		Prerequisites: ~high_tech_factory.ordos
		Description: Slowly Flying Mine that hurls missiles upon contact with enemy airplane before exploding\nIn higher numbers can take down entire squadron
	Tooltip:
		Name: Air Mine
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	Health:
		HP: 25000
	Armor:
		Type: Light
	RevealsShroud:
		Range: 5c0
		Type: GroundPosition
	FireWarheadsOnDeath:
		Weapon: D2KAAMineExplosion
		EmptyWeapon: D2KAAMineExplosion
	RangeMultiplier@mine:
		Modifier: 1000
		RequiresCondition: attack
	RejectsOrders@mine:
		RequiresCondition: attack
	KillsSelf@mine:
		RequiresCondition: attack
		Delay: 20
	GrantConditionOnAttack:
		Condition: attack
	AttackAircraft:
		FacingTolerance: 512
	Armament@PRIMARY:
		Weapon: aa_mine.ordos
		LocalOffset: -250,-300,300, -250,300,300
		LocalYaw: -100,100
	Aircraft:
		CruiseAltitude: 1920
		Speed: 35
		TurnSpeed: 8
		RepulsionSpeed: 40
		MaximumPitch: 56
		CanHover: true
	Targetable:
		TargetTypes: Air, Plane, Mine
	Selectable:
		Bounds: 1280, 1024, 0, 0
	SelectionDecorations:
	Voiced:
		VoiceSet: EBFDAAMine
	RenderSprites:
	AutoTarget:
		InitialStance: AttackAnything
	Cloak:
		UncloakOn: Damage
		IsPlayerPalette: true
	Hovers:
	-SpawnActorOnDeath:
	RenderSprites:
		PlayerPalette: player_rgba
	ActorStatValues:
		Upgrades: up_contraband.ordos

