carryall_reinforce.ordos:
	Inherits: carryall.reinforce
	Inherits@AUTOTARGET: ^AutoTargetAllAssaultMove
	Tooltip:
		Name: Advanced Carryall
	SpawnActorOnDeath@CRUISING:
		Actor: carryall_husk.ordos
		RequiresCondition: cruising
	SpawnActorOnDeath@LANDING:
		Actor: carryall_huskvtol.ordos
		RequiresCondition: !cruising
	RenderSprites:
		Image: carryall.ordos
		PlayerPalette: player_rgba
	AttackAircraft:
		FacingTolerance: 10
	Armament@PRIMARY:
		Weapon: d2kCarryallChainGun
		LocalOffset: 128,-213,-85, 128,213,-85
		RequiresCondition: !up_laserguns.ordos
	Armament@PRIMARYLaser:
		Weapon: d2kCarryallChainGun_upgrade
		LocalOffset: 128,-213,-85, 128,213,-85
		RequiresCondition: up_laserguns.ordos
	ActorStatValues:
		Upgrades: up_laserguns.ordos
carryall.ordos:
	Inherits: carryall
	Inherits@AUTOTARGET: ^AutoTargetAllAssaultMove
	Buildable:
		Queue: Aircraft, RAAircraft
		BuildPaletteOrder: 120
		Prerequisites: ~high_tech_factory.ordos
	Tooltip:
		Name: Advanced Carryall
	SpawnActorOnDeath@CRUISING:
		Actor: carryall_husk.ordos
		RequiresCondition: cruising
	SpawnActorOnDeath@LANDING:
		Actor: carryall_huskvtol.ordos
		RequiresCondition: !cruising
	RenderSprites:
		Image: carryall.ordos
		PlayerPalette: player_rgba
	AttackAircraft:
		FacingTolerance: 10
	Armament@PRIMARY:
		Weapon: d2kCarryallChainGun
		LocalOffset: 128,-213,-85, 128,213,-85
		RequiresCondition: !up_laserguns.ordos
	Armament@PRIMARYLaser:
		Weapon: d2kCarryallChainGun_upgrade
		LocalOffset: 128,-213,-85, 128,213,-85
		RequiresCondition: up_laserguns.ordos
	ActorStatValues:
		Upgrades: up_laserguns.ordos
carryall_husk.ordos:
	Inherits: ^PlaneHusk
	Tooltip:
		Name: Advanced Carryall
	Aircraft:
		TurnSpeed: 16
		Speed: 144
		CanSlide: True
		VTOL: true
	RenderSprites:
		Image: carryall.ordos
		PlayerPalette: player_rgba
	FallsToEarth:
		Explosion: D2KUnitExplodeLarge

carryall_huskvtol.ordos:
	Inherits: ^PlaneHusk
	Tooltip:
		Name: Advanced Carryall
	FallsToEarth:
		Moves: False
		Velocity: 0c128
	Aircraft:
		TurnSpeed: 16
		CanSlide: True
		VTOL: true
	RenderSprites:
		Image: carryall.ordos
		PlayerPalette: player_rgba
	FallsToEarth:
		Explosion: D2KUnitExplodeLarge

