		EmptyWeapon: D2KUnitExplodeMed
	AttractsWorms:
		Intensity: 520
	Cloak@TDcloak:
		Palette: d2kcloak
	Voiced:
		VoiceSet: D2KCombatTank

combat_tank_husk.harkonnen:
	Inherits: ^combat_tank.husk
	TransformOnCapture:
		IntoActor: combat_tank.harkonnen
