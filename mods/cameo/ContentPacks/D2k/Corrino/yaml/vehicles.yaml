corrino_mobileconstructionvehicle:
	Inherits@D2KT: ^D2KTank
	Inherits@Template: ^SupportVehicleTemplate
	Inherits@selection: ^SelectableSupportUnit
	Inherits@D2KSprite: ^D2KPaletteRender
	Inherits@mcv: ^MCV
	Buildable:
		Queue: Vehicle, RAVehicle, Starport
		Prerequisites: ~corrino_vehicle_production, corrino_mcv_production
		Description: Deploys into a Construction Yard.\n  Unarmed
		IconPalette: d2kunit
	Tooltip:
		Name: Corrino Mobile Construction Vehicle
	FireWarheadsOnDeath:
		Weapon: D2KUnitExplodeLarge
		EmptyWeapon: D2KUnitExplodeLarge
	Transforms:
		IntoActor: corrino_constructionyard
		Offset: -1,-1
		TransformSounds: BUILD1.WAV
		Facing: 64
		NoTransformNotification: BuildingCannotPlaceAudio
	-RevealOnFire:
	Voiced:
		VoiceSet: D2KMCV
	RenderSprites:
		Image: d2k_mcv

corrino_spiceharvester:
	Inherits@D2KT: ^D2KTank
	Inherits@Template: ^HarvesterTemplate
	Inherits@selection: ^SelectableEconomicUnit
	Inherits@D2KSprite: ^D2KPaletteRender
	Inherits@harv: ^Harvester
	Buildable:
		Queue: Vehicle, RAVehicle, Starport
		Prerequisites: ~spice_refinery, ~corrino_vehicle_production
		BuildPaletteOrder: 10
		Description: Collects spice for credits.\n  Unarmed
		IconPalette: d2kunit
	Valued:
		Cost: 500
	Tooltip:
		Name: Corrino Spice Harvester
	Selectable:
		DecorationBounds: 1536, 1536
	Harvester:
		BuildDuration: 250
		BuildDurationModifier: 100
		HarvestFacings: 8
		BaleUnloadDelay: 1
	StoresResources:
		Capacity: 45
	CarryableHarvester:
	Health:
		HP: 180000
	Repairable:
		HpPerStep: 10000
	ChangesHealth@SelfHealing:
		Step: 80
	Armor:
		Type: Heavy
	Mobile:
		Speed: 50
		TurnSpeed: 9
	FireWarheadsOnDeath:
		Weapon: D2KUnitExplodeLarge
		EmptyWeapon: D2KUnitExplodeLarge
	WithHarvestOverlay:
		Palette: effect50alpha
	WithDockingAnimation:
	-RevealOnFire:
	Voiced:
		VoiceSet: D2KHarvester
	WithMoveAnimation:
		MoveSequence: move
	RenderSprites:
		Image: harkonnen_harvester
		PlayerPalette: player_rgba
