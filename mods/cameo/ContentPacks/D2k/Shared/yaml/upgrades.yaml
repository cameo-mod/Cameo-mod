		Modifier: 115
	SpeedMultiplier@td_nod_upgrade_guerillatactics:
		RequiresCondition: td_nod_upgrade_guerillatactics
		Modifier: 110
	RangeMultiplier@td_nod_upgrade_guerillatactics:
		RequiresCondition: td_nod_upgrade_guerillatactics
		Modifier: 105
	RevealsShroudMultiplier@td_nod_upgrade_guerillatactics:
		RequiresCondition: td_nod_upgrade_guerillatactics
		Modifier: 105
	DetectCloakedMultiplier@td_nod_upgrade_guerillatactics:
