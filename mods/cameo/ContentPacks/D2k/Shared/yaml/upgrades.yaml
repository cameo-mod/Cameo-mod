^D2KCyberneticModifications:
	GrantConditionOnPrerequisite@td_nod_upgrade_cyberneticmodifications:
		Condition: td_nod_upgrade_cyberneticmodifications
		Prerequisites: td_nod_upgrade_cyberneticmodifications
	Shielded:
		InitialPercentageStrength: 100
		MaxPercentageStrength: 100
		DamageRegenDelay: 125
		RegenAmount: 25
		RegenInterval: 1
		ShieldsUpCondition: armored
		RequiresCondition: (td_nod_upgrade_cyberneticmodifications || shieldgen)
		SelectionBarColor: FFFF88FF
	GrantCondition@shieldpermanent:
		Condition: shieldpermanent
		RequiresCondition: td_nod_upgrade_cyberneticmodifications
	Armor@td_nod_upgrade_cyberneticmodifications:
		Type: Medium
		RequiresCondition: armored
	DamageMultiplier@td_nod_upgrade_cyberneticmodifications:
		RequiresCondition: td_nod_upgrade_cyberneticmodifications
		Modifier: 200
	SpeedMultiplier@td_nod_upgrade_cyberneticmodifications:
		RequiresCondition: td_nod_upgrade_cyberneticmodifications
		Modifier: 120
	ActorStatValues:
		Upgrades: td_nod_upgrade_cyberneticmodifications


^D2KTiberiumInfusion:
	GrantConditionOnPrerequisite@td_nod_upgrade_tiberiuminfusion:
		Condition: td_nod_upgrade_tiberiuminfusion
