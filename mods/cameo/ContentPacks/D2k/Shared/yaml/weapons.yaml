## D2K heavy missile/rocket intermediates.
## These keep the per-weapon defaults (ReloadDelay, Range, Report) while pulling
## the projectile and effect layers from the D2K Shared templates above.

^D2KRocket:
	Inherits@wh: ^Warhead_MissileAP_Heavy
	Inherits@proj: ^Projectile_Missile_Heavy_D2K_Rocket
	Inherits@fx: ^Effect_MissileAP_Heavy_D2K_Rocket
	ReloadDelay: 50
	Range: 5000
	Report: ROCKET1.WAV

^D2KMissile:
	Inherits@wh: ^Warhead_MissileAP_Heavy
	Inherits@proj: ^Projectile_Missile_Heavy_D2K
	Inherits@fx: ^Effect_MissileAP_Heavy_D2K
	ReloadDelay: 60
	Range: 5500
	MinRange: 1100
	Report: ROCKET1.WAV

## D2K old full-stack ^ORocket and ^OMissile 3-way split templates.
## These preserve the old SpreadDamage warheads, projectiles, and effect stacks
## (including the legacy 2Smu/3Eff/3Concrete key names) so the converted
## children resolve with identical behaviour.

^Warhead_MissileAP_Heavy_D2K_ORocket:
	Inherits: ^Warhead_MissileAP_Heavy
	-ValidTargets
	-TargetActorCenter
	-Warhead@MissileAP_Heavy
	-Warhead@MissileAP_Heavy_Percentage
	Warhead@MissileAP_Heavy: SpreadDamage
		Spread: 192
		Falloff: 100, 50, 25, 0
		Damage: 3000
		Versus:
			None: 8
			wall: 75
			Wood: 45
			Light: 70
			Heavy: 100
			invulnerable: 0
			Concrete: 20
			harvester: 50
