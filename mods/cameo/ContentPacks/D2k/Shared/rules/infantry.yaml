light_inf:
	Inherits: ^D2KInfantry
	Inherits@Template: ^ScoutInfantryTemplate
	Inherits@exp: ^GainsExperienceRA
	Inherits@AUTOTARGET: ^AutoTargetAllAssaultMove
	Inherits@DECORATIONS: ^InfantryExperienceHospitalHazmatOverrides
	Inherits@anim: ^D2KPaletteRenderInfantry
	Inherits@AntiInf: ^PrioritizeInfantry
	Inherits@Armor: ^D2K_GeneralPurposeArmor
	Inherits@NeedleGuns: ^D2K_NeedleGuns
	Inherits@BiologicalWarfareUpgradeOrdos: ^BiologicalWarfareUpgradeOrdos
	Inherits@ContrabandUpgradeOrdos: ^ContrabandUpgradeOrdos
	# Re-inherit last: the Scout/Anti-Tank templates pull in ^RA2YuriStealthSuits,
	# which redefines the shield traits keyed to its own upgrade and overwrites the
	# Personal Shield condition. Re-applying ^D2KPersonalShield here restores it.
	Inherits@personalshield: ^D2KPersonalShield
	Tooltip:
		Name: Light Infantry
	Valued:
		Cost: 150
	Buildable:
		BuildPaletteOrder: 10
		Queue: Infantry, RAInfantry
		Description: template-scout-infantry.description
		IconPalette: d2kunit
		Prerequisites: ~d2k_barracks
	Health:
		HP: 18000
	ChangesHealth@SelfHealing:
		Step: 18
	Mobile:
		Speed: 52
	Armament@PRIMARY: ##########
		Weapon: LMG
		LocalOffset: 128,0,256
		RequiresCondition: !up_needleguns.ixian
	Armament@Upgrade: ##########
		Weapon: LMG_upgrade
		LocalOffset: 128,0,256
		RequiresCondition: up_needleguns.ixian
	Armament@GARRISONED: ##########
		Name: garrisoned
		Weapon: LMG
		MuzzleSequence: garrison-muzzle
		MuzzlePalette: d2keffect
		RequiresCondition: !up_needleguns.ixian
	Armament@UpgradeGARRISONED: ##########
		Name: garrisoned
		Weapon: LMG_upgrade
		MuzzleSequence: garrison-muzzle
		MuzzlePalette: d2keffect
		RequiresCondition: up_needleguns.ixian
	WithInfantryBody:
		IdleSequences: idle1,idle2,idle3,idle4
		DefaultAttackSequence: shoot
	Parachutable:
	ActorStatValues:
		Upgrades: up_personal_shield.ixian, up_needleguns.ixian, up_general_purpose_armor.ixian, up_advanced_ixian_technology.ixian

trooper:
	Inherits: ^D2KInfantry
	Inherits@Template: ^AntiTankAntiAirInfantryTemplate
	Inherits@AUTOTARGET: ^AutoTargetAllAssaultMove
	Inherits@anim: ^D2KPaletteRenderInfantry
	Inherits@exp: ^GainsExperienceRA
	Inherits@AntiVeh: ^PrioritizeVehicle
	Inherits@Armor: ^D2K_GeneralPurposeArmor
	Inherits@HeavyMissiles: ^D2K_HeavyMissilesUpgrade
	Inherits@BiologicalWarfareUpgradeOrdos: ^BiologicalWarfareUpgradeOrdos
	Inherits@ContrabandUpgradeOrdos: ^ContrabandUpgradeOrdos
	# Re-inherit last: ^AntiTankAntiAirInfantryTemplate pulls in ^RA2YuriStealthSuits,
	# which overwrites the shield traits with its own upgrade condition. Re-applying
	# ^D2KPersonalShield here restores the Personal Shield condition.
	Inherits@personalshield: ^D2KPersonalShield
	Buildable:
		Queue: Infantry, RAInfantry
		BuildPaletteOrder: 20
		Prerequisites: ~d2k_barracks, ~!up_aatrooper.ordos, ~!up_twin_rocket_trooper.ixian
		Description: template-antitank-antiair-infantry.description
		IconPalette: d2kunit
	Valued:
		Cost: 300
	Tooltip:
		Name: Rocket Trooper
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	Health:
		HP: 12000
	ChangesHealth@SelfHealing:
		Step: 12
	Mobile:
		Speed: 48
	Armament:
		Weapon: D2K_Rocket_Trooper
		LocalOffset: 128,0,256
	Armament@garrisoned:
		Name: garrisoned
		Weapon: D2K_Rocket_Trooper
	TakeCover:
		ProneOffset: 320,0,-128
	WithInfantryBody:
		DefaultAttackSequence: shoot
	ActorStatValues:
		Upgrades: up_personal_shield.ixian, up_general_purpose_armor.ixian, up_heavy_missile.ixian, up_advanced_ixian_technology.ixian

saboteur:
	Inherits: ^D2KInfantry
	Inherits@anim: ^D2KPaletteRenderInfantry
	Inherits@CLOAK: ^CloakedVehicle
	Inherits@bot: ^BotMicromanageable
	Inherits@MC: ^MCImmune
	Inherits@isengineer: ^IsEngineer
	Inherits@BiologicalWarfareUpgradeOrdos: ^BiologicalWarfareUpgradeOrdos
	Buildable:
		Queue: Infantry, RAInfantry
		BuildPaletteOrder: 100
		Prerequisites: ~wip-content
		Description: Sneaky stealth infantry that can infiltrate safely, armed with explosives that can be attached to buildings\nExplodes upon death\nDetector\n  Strong vs Buildings\n  Weak vs Everything\n  Special Abilities: Destroy Buildings, Invisibility
		IconPalette: d2kunit
	Valued:
		Cost: 300 ## actually 0, but spawns from support power at Palace
	Tooltip:
		Name: Saboteur
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	Health:
		HP: 12000
	Mobile:
		Speed: 100
	-RevealOnFire:
	Cloak:
		InitialDelay: 30
		CloakDelay: 30
		CloakSound: STEALTH1.WAV
		IsPlayerPalette: true
		Palette: d2kcloak
	Armament@c4:
		Weapon: GenericC4
		Cursor: c4
	Voiced:
		VoiceSet: D2KSaboteurVoice
	AttackFrontal:
		FacingTolerance: 0
	FireWarheadsOnDeath:
		Weapon: SaboDeath
		EmptyWeapon: SaboDeath
	DetectCloaked:
		Range: 4c0
	ActorStatValues:
		Upgrades: up_toxin.ordos

