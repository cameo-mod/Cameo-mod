	TakeCover:
		ProneOffset: 300,0,-200
	Parachutable:
	RenderSprites:
		PlayerPalette: player_rgba
	WithDeathAnimation:
		DeathSequencePalette: player_rgba
	ActorStatValues:
		Upgrades: up_personal_shield.ixian, up_needleguns.ixian, up_general_purpose_armor.ixian, up_advanced_ixian_technology.ixian

engineer:
	Inherits: E6
	Inherits@BulletImmune: ^BulletImmune
	Inherits@personalshield: ^D2KPersonalShield
