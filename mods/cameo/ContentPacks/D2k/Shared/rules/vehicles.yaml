siege_tank:
	Inherits@D2KT: ^D2KTank
	Inherits@Template: ^ArtilleryTemplate
	Inherits@exp: ^GainsExperienceRA
	Inherits@AUTOTARGET: ^AutoTargetGroundAssaultMove
	Inherits@D2KSprite: ^D2KPaletteRender
	Inherits@EMP: ^FrontalEMP
	Inherits@AntiInf: ^PrioritizeInfantry
	Inherits@AntiBuil: ^PrioritizeBuilding
	Buildable:
		Queue: Vehicle, RAVehicle
		Prerequisites: ~disabled ,upgrade_heavy
		BuildPaletteOrder: 50
		Description: Siege Artillery\n  Strong vs Infantry, Buildings\n  Weak vs Tanks
		IconPalette: d2kunit
	Valued:
		Cost: 600
	Tooltip:
		Name: Siege Tank
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	Health:
		HP: 40000
	Armor:
		Type: Light
	Mobile:
		Speed: 43
		TurnSpeed: 48
	Turreted:
		Offset: 32,16,0
		TurnSpeed: 48
	Armament:
		Weapon: D2K_155mm
		Recoil: 150
		RecoilRecovery: 19
		LocalOffset: 512,0,320
		MuzzleSequence: muzzle
		MuzzlePalette: d2keffect
	AttackFrontal:
		FacingTolerance: 0
	WithMuzzleOverlay:
	WithSpriteTurret:
	FireWarheadsOnDeath:
		Weapon: D2KUnitExplodeMed
		EmptyWeapon: D2KUnitExplodeMed
	AutoTarget:
		InitialStanceAI: Defend
	SpawnActorOnDeath:
		Actor: siege_tank.husk
		OwnerType: InternalName
		EffectiveOwnerFromOwner: true
	AttractsWorms:
		Intensity: 600
	GrantConditionOnPrerequisite@up_siege_range.ixian:
		Condition: up_siege_range.ixian
		Prerequisites: up_siege_range.ixian
	RangeMultiplier@up_siege_range.ixian:
		Modifier: 150
		RequiresCondition: up_siege_range.ixian
	Voiced:
		VoiceSet: D2KSiegeTank

duelist_tank:
