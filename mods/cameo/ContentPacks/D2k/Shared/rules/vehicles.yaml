	ActorStatValues:
		Upgrades: up_siege_range.ixian
	AttackTurreted:
	WithMuzzleOverlay:
	WithSpriteTurret:
	FireWarheadsOnDeath:
		Weapon: D2KUnitExplodeMed
		EmptyWeapon: D2KUnitExplodeMed
	AttractsWorms:
		Intensity: 520
	Cloak@TDcloak:
	Voiced:
		VoiceSet: D2KDuelistTank
	RangeMultiplier@up_needleguns.ixian:
		Modifier: 105
	FirepowerMultiplier@up_needleguns.ixian:
		Modifier: 110
	ActorStatValues:
		Upgrades: up_siege_range.ixian, up_needleguns.ixian, up_general_purpose_armor.ixian, up_advanced_ixian_technology.ixian

d2k_mcv.husk:
	Inherits: ^D2KVehicleHusk
	Health:
		HP: 1750
	Tooltip:
		Name: Mobile Construction Vehicle (Destroyed)
	TransformOnCapture:
		IntoActor: d2k_mcv

siege_tank.husk:
	Inherits: ^D2KVehicleHusk
	Tooltip:
		Name: Siege Tank (Destroyed)
	Health:
		HP: 750
	ThrowsParticle@turret:
		Anim: turret
	TransformOnCapture:
		IntoActor: siege_tank

duelist_tank.husk:
	Inherits: ^D2KVehicleHusk
	Tooltip:
		Name: Ix Duelist Tank (Destroyed)
	Health:
		HP: 1250
	ThrowsParticle@turret:
		Anim: turret
	TransformOnCapture:
		IntoActor: duelist_tank

sandworm:
	Inherits@1: ^SpriteActor
	Inherits: ^D2KPaletteRender
	Interactable:
	Tooltip:
		Name: Sandworm
	Health:
		HP: 150000
	HitShape:
		Type: Circle
			Radius: 256
	Armor:
		Type: Heavy
	Mobile:
		Speed: 42
		Locomotor: sandwormsub
	Targetable:
		TargetTypes: Ground, Creep
	WithSpriteBody:
	WithIdleAnimation:
		Interval: 160
		Sequences: lightninga, lightningb, lightningc, lightningd, lightninge, lightningf
		RequiresCondition: !attacking
	AmbientSound:
		SoundFiles: WRMSIGN1.WAV
		Interval: 160
		RequiresCondition: !attacking
	WithAttackOverlay@mouth:
		Sequence: mouth
	WithAttackOverlay@sand:
		Sequence: sand
	HiddenUnderFog:
	AppearsOnRadar:
		UseLocation: true
	AttackSwallow:
		AttackRequiresEnteringCell: true
		AttackingCondition: attacking
		WormAttackNotification: WormAttack
	Armament:
		Weapon: WormJaw
	Sandworm:
		WanderMoveRadius: 5
		ChanceToDisappear: 30
	IgnoresCloak:
	AnnounceOnSeen:
		Notification: WormSign
		PingRadar: True
		AnnounceNeutrals: True
	RevealsShroud:
		Range: 5c0
	LeavesTrails:
		Image: sandtrail
		Sequences: traila, trailb, trailc
		Palette: d2keffect
		Type: CenterPosition
		TerrainTypes: Clear, ClearTemperat, ClearWinter, ClearJungle, ClearSnow, ClearDesert, ClearInterior, Rough, Road, Beach, Tiberium, BlueTiberium, RedTiberium, GoldTiberium, Ore, Gems, SCMinerals, ClearDune, Dune, Sand, SpiceSand, Spice
		MovingInterval: 3
		RequiresCondition: !attacking
	RevealOnFire:
		Duration: 50
		Radius: 2c512
	RequiresSpecificOwners:
		ValidOwnerNames: Creeps
