	Armor:
		Type: Heavy
	Shielded:
		RegenAmount: 158
	Mobile:
		Speed: 45
		TurnSpeed: 9
	Turreted:
		TurnSpeed: 9
		Offset: 0,0,0
	Armament:
		Weapon: DuelistTankCannon
		Recoil: 150
		RecoilRecovery: 15
		LocalOffset: 256,0,320
		MuzzleSequence: muzzle
		MuzzlePalette: d2keffect
	Armament@Guns: ##########
		Weapon: HMG_Duelist
		LocalOffset: 128,-128,128, 128,128,128
		MuzzleSequence: muzzle2
		MuzzlePalette: d2keffect
		RequiresCondition: !up_needleguns.ixian
