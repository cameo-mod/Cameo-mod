upgrade_conyard:
	Inherits: ^researched_upgrade.template
	Tooltip:
		Name: Construction Yard Upgrade
	Buildable:
		BuildPaletteOrder: 50
		Prerequisites: ~d2k_construction_yard, research_centre, !upgrade_conyard
		Queue: Upgrades
		BuildLimit: 1
		BuildDuration: 1500
		BuildDurationModifier: 100
		Description: Construction Yard gets 25% more armor. Reduces cost and production time by 10% for all Defenses and upgrades Concrete Slabs.
		IconPalette: d2kunit
	Valued:
		Cost: 1250
	RenderSprites:
		Image: conyard.ordos

