d2k_mcv.ixian:
	Inherits@D2KT: ^D2KTank
	Inherits@Template: ^SupportVehicleTemplate
	Inherits@selection: ^SelectableSupportUnit
	Inherits@D2KSprite: ^D2KPaletteRender
	Inherits@mcv: ^MCV
	Buildable:
		Prerequisites: ~heavy_factory.ixian, repair_pad.ixian
		IconPalette: d2kunit
	Tooltip:
		Name: Ixian Mobile Construction Vehicle
	FireWarheadsOnDeath:
		Weapon: D2KUnitExplodeLarge
		EmptyWeapon: D2KUnitExplodeLarge
	Transforms:
		IntoActor: construction_yard.ixian
		Offset: -1,-1
		TransformSounds: BUILD1.WAV
		Facing: 64
		NoTransformNotification: BuildingCannotPlaceAudio
	-RevealOnFire:
	Voiced:
		VoiceSet: D2KMCV
	RenderSprites:
		Image: d2k_mcv

harvester.ixian:
	Inherits@D2KT: ^D2KTank
	Inherits@Template: ^HarvesterTemplate
	Inherits@selection: ^SelectableEconomicUnit
	Inherits@D2KSprite: ^D2KPaletteRender
	Inherits@harv: ^Harvester
	Inherits@Armor: ^D2K_GeneralPurposeArmor
	Buildable:
		Queue: Vehicle, RAVehicle
		Prerequisites: ~spice_refinery, ~heavy_factory.ixian
		BuildPaletteOrder: 10
		Description: template-harvester.description
		IconPalette: d2kunit
	Valued:
		Cost: 500
	Tooltip:
		Name: Ixian Spice Harvester
	Selectable:
		DecorationBounds: 1536, 1536
	Harvester:
		BuildDuration: 250
		BuildDurationModifier: 100
		HarvestFacings: 8
		BaleUnloadDelay: 1
	StoresResources:
		Capacity: 45
	CarryableHarvester:
	Health:
		HP: 200000
	Repairable:
		HpPerStep: 10000
	ChangesHealth@SelfHealing:
		Step: 80
	Armor:
		Type: Heavy
	Shielded:
		RegenAmount: 160
	Cloak:
		RequiresCondition: !disabled && (stealthed || up_advanced_ixian_technology.ixian || shieldgen || shielded)
	Mobile:
		Speed: 45
		TurnSpeed: 9
	FireWarheadsOnDeath:
		Weapon: D2KUnitExplodeLarge
		EmptyWeapon: D2KUnitExplodeLarge
	SpawnActorOnDeath:
		Actor: harvester_husk.ixian
		OwnerType: InternalName
		EffectiveOwnerFromOwner: true
	WithHarvestOverlay:
		Palette: effect50alpha
	WithDockingAnimation:
	AttractsWorms:
		Intensity: 750
	-RevealOnFire:
	Voiced:
		VoiceSet: D2KHarvester
	ActorStatValues:
		Upgrades: up_general_purpose_armor.ixian, up_advanced_ixian_technology.ixian

