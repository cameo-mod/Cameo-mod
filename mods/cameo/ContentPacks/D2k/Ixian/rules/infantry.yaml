twin_rocket_trooper.ixian:
	Inherits: ^D2KInfantry
	Inherits@Template: ^AntiTankAntiAirInfantryTemplate
	Inherits@PromotionUnitBuff: ^PromotionUnitBuff
	Inherits@AUTOTARGET: ^AutoTargetAllAssaultMove
	Inherits@anim: ^D2KPaletteRenderInfantry
	Inherits@exp: ^GainsExperienceRA
	Inherits@AntiVeh: ^PrioritizeVehicle
	Inherits@Armor: ^D2K_GeneralPurposeArmor
	Inherits@HeavyMissiles: ^D2K_HeavyMissilesUpgrade
	# Re-inherit last: ^AntiTankAntiAirInfantryTemplate pulls in ^RA2YuriStealthSuits,
	# which overwrites the shield traits with its own upgrade condition. Re-applying
	# ^D2KPersonalShield here restores the Personal Shield condition.
	Inherits@personalshield: ^D2KPersonalShield
	Buildable:
		Queue: Infantry, RAInfantry
		BuildPaletteOrder: 20
		Prerequisites: ~up_twin_rocket_trooper.ixian
		Description: template-antitank-antiair-infantry.description
		IconPalette: d2kunit
	Valued:
		Cost: 600
	Tooltip:
		Name: Twin Rocket Trooper
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	Health:
		HP: 24000
	ChangesHealth@SelfHealing:
		Step: 24
	Mobile:
		Speed: 48
	Armament:
		Weapon: D2K_Rocket_Trooper1
		LocalOffset: 128,0,256
	Armament@SECONDARY:
		Weapon: D2K_Rocket_Trooper2
		LocalOffset: 128,0,256
	Armament@garrisoned:
		Name: garrisoned
		Weapon: D2K_Rocket_Trooper1
	Armament@SECONDARYgarrisoned:
		Name: garrisoned
		Weapon: D2K_Rocket_Trooper2
	TakeCover:
		ProneOffset: 320,0,-128
	WithInfantryBody:
		DefaultAttackSequence: shoot
	ActorStatValues:
		Upgrades: up_personal_shield.ixian, up_general_purpose_armor.ixian, up_heavy_missile.ixian, up_advanced_ixian_technology.ixian

shock_infantry.ixian:
	Inherits: ^D2KInfantry
	Inherits@Template: ^HeavyInfantryTemplate
	Inherits@exp: ^GainsExperienceRA
	Inherits@AUTOTARGET: ^AutoTargetGroundAssaultMove
	Inherits@DECORATIONS: ^InfantryExperienceHospitalHazmatOverrides
	Inherits@anim: ^D2KPaletteRenderInfantry
	Inherits@AntiVeh: ^PrioritizeVehicle
	Inherits@Armor: ^D2K_GeneralPurposeArmor
	Valued:
		Cost: 500
	Tooltip:
		Name: Shock Infantry
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	Buildable:
		BuildPaletteOrder: 10
		Queue: Infantry, RAInfantry
		Description: actor-shock_infantry.description
		IconPalette: d2kunit
		Prerequisites: ~research_centre.ixian, ~!up_storm_infantry.ixian
	Health:
		HP: 36000
	ChangesHealth@SelfHealing:
		Step: 36
	Mobile:
		Speed: 45
	Armament@PRIMARY: ##########
		Weapon: D2K_ShockGunInf
		LocalOffset: 135,0,200
	Armament@GARRISONED: ##########
		Name: garrisoned
		Weapon: D2K_ShockGunInf
		MuzzleSequence: garrison-muzzle
		MuzzlePalette: d2keffect
	FirepowerMultiplier@up_advanced_ixian_technology.ixian:
		Modifier: 200
		RequiresCondition: up_advanced_ixian_technology.ixian
	WithInfantryBody:
		-IdleSequences: idle1,idle2
		DefaultAttackSequence: shoot
	Parachutable:
	Voiced:
		VoiceSet: D2KGenericVoice
	RenderSprites:
		Image: shockgunner
		PlayerPalette: player
	ActorStatValues:
		Upgrades: up_personal_shield.ixian, up_general_purpose_armor.ixian, up_advanced_ixian_technology.ixian

