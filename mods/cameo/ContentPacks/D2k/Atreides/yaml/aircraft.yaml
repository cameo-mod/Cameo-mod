atreides_ornithopter:
	Inherits: ^RANeutralPlane
	Inherits@reload: ^RearmableAircraft
	Inherits@exp: ^GainsExperienceRA
	Inherits@decoration: ^DuneRankDecoration
	Inherits@AUTOTARGET: ^AutoTargetAllAssaultMove
	Inherits@AntiBuil: ^PrioritizeBuilding
	Inherits@D2KSprite: ^D2KPaletteRender
	Inherits@Armor: ^D2K_GeneralPurposeArmor
	Valued:
		Cost: 1500
	Tooltip:
		Name: Ornithopter
	Buildable:
		Queue: Aircraft, RAAircraft
		BuildPaletteOrder: 10
		Prerequisites: ~atreides_hightechfactory
		Description: Fast strike aircraft armed with bombs and missiles.\n  Strong vs Buildings, Vehicles\n  Weak vs Anti-Air
		IconPalette: d2kunit
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	Health:
		HP: 50000
	Repairable:
		HpPerStep: 2500
	Armor:
		Type: Light
	Aircraft:
		CruiseAltitude: 2160
		CruisingCondition: cruising
		InitialFacing: 0
		Speed: 224
		TurnSpeed: 20
		Repulsable: False
		CanSlide: True
		VTOL: True
		IdleTurnSpeed: 4
	SpawnActorOnDeath:
		Actor: ornithopter_husk.atreides
	Armament@PRIMARY:
		Weapon: OrniBomb
		LocalOffset: 0,-256,-128
	Armament@SECONDARY:
		Weapon: OrniMissile
		LocalOffset: 0,256,-128
	Armament@GUN:
		Weapon: OrniGun
		LocalOffset: 256,0,0
	AttackAircraft:
		FacingTolerance: 0
	WithInfantryBody:
		Sequence: idle
	RenderSprites:
		Image: ornithopter
		PlayerPalette: playerd2k
	Voiced:
		VoiceSet: D2KVehicleVoice
	RevealOnFire:
		Duration: 50
		Radius: 2c512
	-MustBeDestroyed:
	AmmoPool@PRIMARY:
		Ammo: 5
		ReloadCount: 5
		PipCount: 5
		RearmSound: REARM1.WAV
	Targetable:
		TargetTypes: Air

ornithopter_husk.atreides:
	Inherits: ^PlaneHusk
	Tooltip:
		Name: Ornithopter
	Aircraft:
		TurnSpeed: 20
		Speed: 224
	RenderSprites:
		Image: ornithopter
		PlayerPalette: playerd2k
	FallsToEarth:
		Explosion: D2KUnitExplodeMed
