# Atreides faction-specific weapons.
# Ported from legacy mods/cameo/weapons/d2k.yaml to make the Atreides ContentPack
# self-contained. Weapons shared with other D2k factions live in
# ContentPacks/D2k/Shared/yaml/weapons.yaml (light_inf_lmg, D2K_Rocket_Trooper,
# 80mm_A, mtank_pri, D2KUnitExplode*, Sound, OrniGun, HMG).
#
# Atreides-unique weapons:
# - Sound2: sonic tank variant (inherits Shared Sound)
# - OrniBomb/OrniBombC: ornithopter bomb
# - OrniMissile: ornithopter missile (inherits PhoenixRocket, moved here from legacy)
# - OrniGunC: ornithopter gun variant (inherits Shared OrniGun)
# - PhoenixRocket: missile base inherited by OrniMissile (Atreides-only consumer)
# - Fremen_S: Fremen stealth weapon

Sound2:
	Inherits: Sound
	Range: 5632
	ReloadDelay: 40
	Projectile: AreaBeam
		Speed: 0c256
		Duration: 2
		Width: 0c256
	Warhead@1Dam: SpreadDamage
		Damage: 4000
	Warhead@2Dam: SpreadDamage
		Damage: 400
	Warhead@Concrete: DamagesConcrete
		Damage: 800


OrniBomb:
	Inherits@wh: ^Warhead_Demolition_Heavy_D2K_Orni
	Inherits@proj: ^Projectile_GravityBomb_D2K
	Inherits@fx: ^Effect_Demolition_Heavy_D2K_Orni
	ReloadDelay: 25
	Burst: 5
	BurstDelays: 5
	Range: 2500


OrniBombC:
	Inherits: OrniBomb
	Range: 2500


OrniMissile:
	Inherits: PhoenixRocket
	ReloadDelay: 66
	Burst: 2
	Range: 6666
	ValidTargets: Ground, Air
	BurstDelays: 6
	Projectile: Missile
		VerticalRateOfTurn: 12
		MinimumLaunchAngle: -128
		Inaccuracy: 666
		Speed: 333
		RangeLimit: 33333
	Warhead@1Dam: SpreadDamage
		Damage: 12345
		Spread: 1234
		ValidTargets: Ground, Air
		Versus:
			None: 25
			Wood: 150
			Light: 100
			Medium: 75
			Heavy: 50
			Concrete: 125
	MinRange: 1335


OrniGunC:
	Inherits: OrniGun
	Range: 6000
	ValidTargets: Ground, Air
	Warhead@1Dam: SpreadDamage
		ValidTargets: Ground, Air
		Damage: 800
	MinRange: 1200


Fremen_S:
	Inherits: ^MG
	ValidTargets: Infantry
	InvalidTargets: Vehicle, Structure, Air
	ReloadDelay: 20
	Report: MGUN2.WAV
	Warhead@1Dam: SpreadDamage
		Damage: 1600
	Warhead@2Eff: CreateEffect
		Explosions: d2k_small_explosion

# Migrated from legacy mods/cameo/weapons/d2k.yaml (Ruling 9)
# These weapons are only used by Atreides actors.

D2KRepair:
	Inherits: Heal
	ReloadDelay: 80
	Report: fixit1.aud
	ValidTargets: Repair, lockdowned, ivanattached, Repairing
	Projectile: InstantHit
	Warhead@1Dam: SpreadDamage
		Spread: 250
		Damage: -1500
		ValidRelationships: Ally
		ValidTargets: Repair, Repairing
		Versus:
			None: 125
			Light: 100
			Medium: 75
			Heavy: 60
			Concrete: 60
			Wood: 100
	Warhead@2Defuse: DetachDelayedWeapon
		Types: ivanbomb
		ValidTargets: ivanattached
		ValidRelationships: Ally
	Warhead@3Defuse: DetachDelayedWeapon
		Types: lockdown
		ValidTargets: lockdowned
		ValidRelationships: Ally

PhoenixRocket:
	Inherits: ^D2KMissile
	ReloadDelay: 100
	Burst: 8
	Range: 4608
	BurstDelays: 10
	Projectile: Missile
		Inaccuracy: 96
		Speed: 256
		RangeLimit: 4c512
	Warhead@1Dam: SpreadDamage
		Spread: 1c0
		Damage: 7500
		Versus:
			None: 150
			Wood: 100
			Light: 125
			Medium: 125
			Heavy: 100
			Concrete: 40
	Warhead@3Eff: CreateEffect
		Explosions: napalm
		GlowScale: 1.5
		GlowFadeFrames: 30
		GlowFadeInFrames: 12
		ImpactSounds: firebl3.aud
		ExplosionPalette: effect
	Warhead@Concrete: DamagesConcrete
		Damage: 1250
	Warhead@Shrapnel: FireShrapnel
		Weapon: PhoenixRocketShrapnel
		Amount: 3
		ValidTargets: Ground, Water, Air
	MinRange: 920

