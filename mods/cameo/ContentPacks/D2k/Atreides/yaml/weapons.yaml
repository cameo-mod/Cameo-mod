# Atreides faction-specific weapons.
# Ported from legacy mods/cameo/weapons/d2k.yaml to make the Atreides ContentPack
# self-contained. Weapons shared with other D2k factions live in
# ContentPacks/D2k/Shared/yaml/weapons.yaml (light_inf_lmg, D2K_Rocket_Trooper,
# 80mm_A, mtank_pri, D2KUnitExplode*, Sound, OrniGun, HMG).
#
# Atreides-unique weapons:
# - Sound2: sonic tank variant (inherits Shared Sound)
# - OrniBomb/OrniBombC: ornithopter bomb
# - OrniMissile: ornithopter missile (inherits PhoenixRocket, moved here from legacy)
# - OrniGunC: ornithopter gun variant (inherits Shared OrniGun)
# - PhoenixRocket: missile base inherited by OrniMissile (Atreides-only consumer)
# - Fremen_S: Fremen stealth weapon

Sound2:
	Inherits@fx: ^d2k_atreides_sound2
	ReloadDelay: 40
	Range: 5632
	Report: SONIC1.WAV
	Projectile: AreaBeam
		Speed: 0c256
		Inaccuracy: 333
		InaccuracyType: PerCellIncrement
		Duration: 2
		DamageInterval: 2
		Width: 0c256
		Shape: Flat
		Falloff: 100, 75, 50
		Range: 0, 7500, 15000
		BeyondTargetRange: 1c0
		Color: C4C9C2
	Warhead@1Dam: SpreadDamage
		Range: 0, 32
		Falloff: 100, 100
		Damage: 4000
		AffectsParent: false
		ValidRelationships: Neutral, Enemy
		Versus:
			None: 333
			Wood: 88
			Light: 123
			Medium: 111
			Heavy: 99
			Concrete: 77
		DamageTypes: Prone50Percent, TriggerProne, DefaultDeath
	Warhead@2Dam: SpreadDamage
		Range: 0, 32
		Falloff: 100, 100
		Damage: 400
		AffectsParent: false
		ValidRelationships: Ally
		Versus:
			None: 333
			Wood: 88
			Light: 123
			Medium: 111
			Heavy: 99
			Concrete: 77
		DamageTypes: Prone50Percent, TriggerProne, DefaultDeath

OrniBomb:
	Inherits@wh: ^Warhead_Demolition_Heavy_D2K_Orni
	Inherits@proj: ^Projectile_GravityBomb_D2K
	Inherits@fx: ^Effect_Demolition_Heavy_D2K_Orni
	ReloadDelay: 25
	Burst: 5
	BurstDelays: 5
	Range: 2500

OrniBombC:
	Inherits@w71: ^Warhead_Demolition_Heavy_D2K_Orni
	Inherits@w72: ^Projectile_GravityBomb_D2K
	Inherits@w73: ^Effect_Demolition_Heavy_D2K_Orni
	Range: 2500


	BurstDelays: 5
	Burst: 5
^d2k_atreides_ornimissile:
	Warhead@3Eff: CreateEffect
		ExplosionPalette: effect
		Explosions: napalm
		GlowFadeFrames: 30
		GlowFadeInFrames: 12
		GlowScale: 1.5
		ImpactSounds: firebl3.aud
	Warhead@Concrete: DamagesConcrete
		Damage: 1250
	Warhead@Effect: CreateEffect
		Explosions: d2k_small_explosion
		ImpactSounds: EXPLSML1.WAV
		ValidTargets: Ground, Air
		ExplosionPalette: effect75alpha
		ImpactActors: false
	Warhead@EffectAir: CreateEffect
		Explosions: big_explosion_air
		ImpactSounds: EXPLLG2.WAV
		ImpactActors: false
		ValidTargets: Air
	Warhead@Glow: GlowImpact
		Color: FFB84D
		Scale: 0.8
		FadeFrames: 15
	Warhead@ShieldHitEffect: CreateEffect
		ImpactSounds: shielded_shell_hit1.wav, shielded_shell_hit2.wav, shielded_shell_hit3.wav, shielded_shell_hit4.wav
		ValidTargets: Shielded
	Warhead@Smudge: LeaveSmudge
		SmudgeType: SandCrater, RockCrater
		InvalidTargets: Vehicle, Structure, wall, Husk, Creep

OrniMissile:
	Inherits@wh: ^Warhead_MissileHE_Heavy
	Inherits: ^d2k_atreides_ornimissile
	ValidTargets: Ground, Air
	ReloadDelay: 66
	Range: 6666
	TargetActorCenter: true
	Projectile: Missile
		Arm: 0
		Blockable: false
		AllowSnapping: true
		Inaccuracy: 666
		Image: d2k_missile2
		Shadow: true
		HorizontalRateOfTurn: 80
		VerticalRateOfTurn: 12
		TrailImage: large_trail
		TrailInterval: 1
		ContrailLength: 0
		MaximumLaunchSpeed: 200
		MinimumLaunchSpeed: 200
		Speed: 333
		CloseEnough: 400
		Acceleration: 3
		HomingActivationDelay: 3
		RangeLimit: 33333
		PointDefenseTypes: Missile
		Palette: d2keffect
		CruiseAltitude: 1000
		MinimumLaunchAngle: -128
	Warhead@ShieldHit: GrantExternalCondition
		Condition: shieldhit
		Duration: 12
		Range: 1250
		ValidTargets: Shielded
	MinRange: 1335
	Report: ROCKET1.WAV
	Burst: 2
	BurstDelays: 6
	Warhead@Shrapnel: FireShrapnel
		Weapon: PhoenixRocketShrapnel
		Amount: 3
		ValidTargets: Ground, Water, Air
	Warhead@MissileHE_Heavy:
		Damage: 13345
		ValidTargets: Ground, Air

OrniGunC:
	Inherits@w71: ^d2k_shared_ornigun
	Range: 6000
	ValidTargets: Ground, Air
	Warhead@1Dam: SpreadDamage
		ValidTargets: Ground, Air
		Damage: 800
		Versus:
			Heavy: 99
			Concrete: 33
			Light: 123
			None: 333
			Medium: 111
			Wood: 66
		Falloff: 100, 33
		DamageTypes: Prone50Percent, TriggerProne, BulletDeath
		Spread: 333
		DamageCalculationType: ClosestTargetablePosition
	MinRange: 1200
	Warhead@2Eff:
		ImpactSounds: EXPLSML1.WAV


	Projectile: InstantHit
		Inaccuracy: 1c256
		InaccuracyType: PerCellIncrement
	BurstDelays: 2
	Burst: 5
	StartBurstReport: FREMODD1.WAV
	ReloadDelay: 25
Fremen_S:
	Inherits: ^MG
