atreides_mobileconstructionvehicle:
	Inherits@D2KT: ^D2KTank
	Inherits@Template: ^SupportVehicleTemplate
	Inherits@selection: ^SelectableSupportUnit
	Inherits@D2KSprite: ^D2KPaletteRender
	Inherits@mcv: ^MCV
	Buildable:
		Queue: Vehicle, RAVehicle, Starport
		Prerequisites: ~atreides_vehicle_production, atreides_mcv_production
		Description: Deploys into a Construction Yard.\n  Unarmed
		IconPalette: d2kunit
	Tooltip:
		Name: Atreides Mobile Construction Vehicle
	FireWarheadsOnDeath:
		Weapon: D2KUnitExplodeLarge
		EmptyWeapon: D2KUnitExplodeLarge
	Transforms:
		IntoActor: atreides_constructionyard
		Offset: -1,-1
		TransformSounds: BUILD1.WAV
		Facing: 64
		NoTransformNotification: BuildingCannotPlaceAudio
	-RevealOnFire:
	Voiced:
		VoiceSet: D2KMCV
	RenderSprites:
		Image: d2k_mcv

atreides_combattank:
