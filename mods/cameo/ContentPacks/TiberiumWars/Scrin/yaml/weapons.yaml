# Initial independently-authored Scrin gameplay weapons. These deliberately use
# engine-native beam/warhead primitives so the first playable faction pass does
# not depend on another mod's art or effects.

^ScrinBeamBase:
	ReloadDelay: 25
	Range: 5c0
	TargetActorCenter: true
	ValidTargets: Ground, Water
	Projectile: LaserZap
		Width: 40
		Duration: 4
		Color: 44FF88
		ZOffset: 2047
		SecondaryBeam: true
		SecondaryBeamWidth: 16
		SecondaryBeamZOffset: 2047
		SecondaryBeamColor: 22443388
	Warhead@1Dam: SpreadDamage
		Spread: 42
		Damage: 2500
		Versus:
			None: 100
			Wood: 80
			Light: 85
			Medium: 65
			Heavy: 45
			Concrete: 35
		DamageTypes: Prone50Percent, TriggerProne, DefaultDeath
		ValidTargets: Ground, Water

ScrinLightBeam:
	Inherits: ^ScrinBeamBase

ScrinLightBeamAA:
	Inherits: ^ScrinBeamBase
	ValidTargets: Ground, Water, Air
	Warhead@1Dam:
		ValidTargets: Ground, Water, Air

