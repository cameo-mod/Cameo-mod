# Scrin gameplay weapons, converted to the current weapon schema.
# Versus profiles live in the pack-local ^Warhead_Scrin* templates below
# (rule: Versus lives only in ^Warhead_* templates; per-weapon Damage/Spread
# stay verbatim on the weapon as overrides). Mechanic warheads (HeatDistortion,
# SpawnActor, Shockwave, TargetDamage, Dummy, repair) stay inline - they are
# not damage-family warheads.

# Pack-local warhead templates. Each carries one authored Versus profile so a
# weapon only says which profile it fires, never re-derives it.
^Warhead_ScrinBeam:
	Warhead@ScrinBeam: SpreadDamage
		Spread: 42
		Versus:
			None: 100
			Wood: 80
			Light: 85
			Medium: 65
			Heavy: 45
			Concrete: 35
		DamageTypes: Prone50Percent, TriggerProne, DefaultDeath
		ValidTargets: Ground, Water

^Warhead_ScrinShard:
	Warhead@ScrinShard: SpreadDamage
		Spread: 42
		Versus:
			None: 125
			Wood: 100
			Light: 90
			Medium: 55
			Heavy: 35
			Concrete: 25
		DamageTypes: Prone50Percent, TriggerProne, DefaultDeath
		ValidTargets: Ground, Water

^Warhead_ScrinHeavyBeam:
	Warhead@ScrinHeavyBeam: SpreadDamage
		Spread: 64
		Versus:
			None: 45
			Wood: 70
			Light: 90
			Medium: 115
			Heavy: 135
			Concrete: 110
		DamageTypes: Prone50Percent, TriggerProne, DefaultDeath
		ValidTargets: Ground, Water

^Warhead_ScrinAcid:
	Warhead@ScrinAcid: SpreadDamage
		Spread: 96
		Versus:
			None: 125
			Wood: 115
			Light: 95
			Medium: 65
			Heavy: 45
			Concrete: 35
		DamageTypes: Prone50Percent, TriggerProne, DefaultDeath
		ValidTargets: Ground, Water

^Warhead_ScrinCorrosion:
	Warhead@ScrinCorrosion: AreaDamage
		Spread: 96
		Versus:
			None: 125
			Wood: 115
			Light: 95
			Medium: 65
			Heavy: 45
			Concrete: 35
		DamageTypes: Prone50Percent, TriggerProne, TiberiumDeath
		PhysicalStates:
			Corrosion: 100
		ValidRelationships: Neutral, Enemy
		ValidTargets: Ground, Water

^Warhead_ScrinCapital:
	Warhead@ScrinCapital: SpreadDamage
		Spread: 128
		Versus:
			None: 70
			Wood: 100
			Light: 110
			Medium: 120
			Heavy: 130
			Concrete: 100
		DamageTypes: Prone50Percent, TriggerProne, DefaultDeath
		ValidTargets: Ground, Water

# Shared beam base: weapon-side fields only. The damage warhead comes from
# ^Warhead_ScrinBeam via Inherits@wh; children may swap the wh inherit.
^ScrinBeamBase:
	Inherits@wh: ^Warhead_ScrinBeam
	ReloadDelay: 25
	Range: 5c0
	TargetActorCenter: true
	ValidTargets: Ground, Water
	Projectile: LaserZap
		Width: 40
		Duration: 4
		Color: 44FF88
		ZOffset: 2047
		SecondaryBeam: true
		SecondaryBeamWidth: 16
		SecondaryBeamZOffset: 2047
		SecondaryBeamColor: 22443388
	Warhead@ScrinBeam:
		Damage: 2500

ScrinLightBeam:
	Inherits: ^ScrinBeamBase

ScrinLightBeamAA:
	Inherits: ^ScrinBeamBase
	ValidTargets: Ground, Water, Air
	Warhead@ScrinBeam:
		ValidTargets: Ground, Water, Air

