# Map/editor-ready Scrin aircraft visuals. Gameplay roles, weapons, carrier
# logic, costs, prerequisites, and final balance remain deferred.

^ScrinAircraftShieldAlignment:
	WithIdleOverlay@shield1:
		FollowBodySpriteOffset: true
		Offset: 0,0,427
	WithIdleOverlay@shield_damage:
		FollowBodySpriteOffset: true
		Offset: 0,0,427

^ScrinAircraftVisual:
	Inherits: ^Helicopter
	Inherits@shieldalignment: ^ScrinAircraftShieldAlignment
	Inherits@AUTOTARGET: ^AutoTargetAllAssaultMove
	Inherits@materialization: ^ScrinFactoryMaterialization
	Health:
		HP: 100000
	Armor:
		Type: Heavy
	Selectable:
		Bounds: 1024, 1024
	Aircraft:
		Speed: 100
		TurnSpeed: 20
		AltitudeVelocity: 100
		CanForceLand: false
		Repulsable: false
		Voice: Move
	DeathSounds:
	-WithShadow:
	-Hovers@CRUISING:
	-AttackAircraft:
	-SpawnActorOnDeath:
	-Voiced:

scrin_drone_ship:
	Inherits: ^Helicopter
	Inherits@shieldalignment: ^ScrinAircraftShieldAlignment
	Inherits@materialization: ^ScrinFactoryMaterialization
	Voiced:
		VoiceSet: ScrinDroneShipVoice
	DeathSounds:
	WithIdleOverlay@shield1:
		Sequence: colossal-mobile-west
		StartSequence: colossal-mobile-west
	WithIdleOverlay@shield_damage:
		Sequence: colossal-mobile-west
	Tooltip:
		Name: actor_scrin_drone_ship.name
	Buildable:
		Queue: ScrinAircraft, ScrinWarpAircraft
		BuildPaletteOrder: 10
		Prerequisites: scrin_reactor, scrin_extractor
		Icon: icon
		IconPalette: player_rgba
		IconPaletteIsPlayerPalette: true
		Description: Deploys into a Drone Platform construction hub.
	Valued:
		Cost: 5000
	Health:
		HP: 1000000
	Armor:
		Type: Heavy
	MustBeDestroyed:
		RequiredForShortGame: true
	BaseBuilding:
	Selectable:
		Bounds: 2048, 2048, 0, -2048
		DecorationBounds: 2304, 2560, 0, -2048
	Aircraft:
		Speed: 61
		TurnSpeed: 20
		CruiseAltitude: 768
		AltitudeVelocity: 35
		CanForceLand: false
		Repulsable: false
		Voice: Move
	-WithShadow:
	-Hovers@CRUISING:
	Transforms:
		IntoActor: scrin_drone_platform
		Offset: -1,-1
		Facing: 480
		NoTransformNotification: BuildingCannotPlaceAudio
	-AttackAircraft:
	-SpawnActorOnDeath:
	RenderSprites:
		PlayerPalette: player_rgba

scrin_stormrider:
	Inherits: ^ScrinAircraftVisual
	Voiced:
		VoiceSet: ScrinStormriderVoice
	Tooltip:
		Name: actor_scrin_stormrider.name
	Buildable:
		Queue: ScrinAircraft, ScrinWarpAircraft
		BuildPaletteOrder: 20
		Prerequisites: scrin_reactor, scrin_extractor
		Icon: icon
		IconPalette: player_rgba
		IconPaletteIsPlayerPalette: true
		Description: Fast attack spacecraft effective against ground and air targets.
	Valued:
		Cost: 1000
	Health:
		HP: 85000
	Selectable:
		Bounds: 1024, 1024, 0, -576
	Aircraft:
		CanHover: false
		CanSlide: false
		VTOL: false
		Voice: Move
	Armament:
		Weapon: ScrinAirZap
	AttackAircraft:
		FacingTolerance: 128
		Voice: Attack
	RenderSprites:
		PlayerPalette: scrin_stormrider_player

