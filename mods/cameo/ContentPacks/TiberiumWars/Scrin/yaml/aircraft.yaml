# Map/editor-ready Scrin aircraft visuals. Gameplay roles, weapons, carrier
# logic, costs, prerequisites, and final balance remain deferred.

^ScrinAircraftShieldAlignment:
	WithIdleOverlay@shield1:
		FollowBodySpriteOffset: true
		Offset: 0,0,427
	WithIdleOverlay@shield_damage:
		FollowBodySpriteOffset: true
		Offset: 0,0,427

^ScrinAircraftVisual:
	Inherits: ^Helicopter
	Inherits@shieldalignment: ^ScrinAircraftShieldAlignment
	Health:
		HP: 100000
	Armor:
		Type: Heavy
	Selectable:
		Bounds: 1024, 1024
	Aircraft:
		Speed: 100
		TurnSpeed: 20
		AltitudeVelocity: 100
		CanForceLand: false
		Repulsable: false
	-WithShadow:
	-Hovers@CRUISING:
	-AttackAircraft:
	-SpawnActorOnDeath:
	-Voiced:

scrin_drone_ship:
	Inherits: ^Helicopter
	Inherits@shieldalignment: ^ScrinAircraftShieldAlignment
	WithIdleOverlay@shield1:
		Sequence: colossal-mobile-west
		StartSequence: colossal-mobile-west
	WithIdleOverlay@shield_damage:
		Sequence: colossal-mobile-west
	Tooltip:
		Name: actor_scrin_drone_ship.name
	Valued:
		Cost: 5000
	Health:
		HP: 1000000
	Armor:
		Type: Heavy
	Selectable:
		Bounds: 2048, 2048, 0, -2048
		DecorationBounds: 2304, 2560, 0, -2048
	Aircraft:
		Speed: 61
		TurnSpeed: 20
		AltitudeVelocity: 100
		CanForceLand: false
		Repulsable: false
	-WithShadow:
	-Hovers@CRUISING:
	Transforms:
		IntoActor: scrin_drone_platform
		Offset: -1,-1
		Facing: 480
		NoTransformNotification: BuildingCannotPlaceAudio
	-AttackAircraft:
	-SpawnActorOnDeath:
	-Voiced:
	RenderSprites:
		PlayerPalette: player_rgba

scrin_stormrider:
	Inherits: ^ScrinAircraftVisual
	Tooltip:
		Name: actor_scrin_stormrider.name
	Selectable:
		Bounds: 1024, 1024, 0, -576
	Aircraft:
		CanHover: false
		CanSlide: false
		VTOL: false
	RenderSprites:
		PlayerPalette: scrin_stormrider_player

scrin_devastator_warship:
	Inherits: ^ScrinAircraftVisual
	WithIdleOverlay@shield1:
		Image: hexshield_directional_oval
		Sequence: aircraft-large-west
		StartSequence: aircraft-large-west
	WithIdleOverlay@shield_damage:
		Image: hexshield_directional_oval
		Sequence: aircraft-large-west
	Tooltip:
		Name: actor_scrin_devastator_warship.name
	Selectable:
		Bounds: 2048, 2048, 0, -768
	RenderSprites:
		PlayerPalette: scrin_devastator_warship_player

scrin_planetary_assault_carrier:
	Inherits: ^ScrinAircraftVisual
	WithIdleOverlay@shield1:
		Image: hexshield_directional_oval
		Sequence: aircraft-colossal
		StartSequence: aircraft-colossal
	WithIdleOverlay@shield_damage:
		Image: hexshield_directional_oval
		Sequence: aircraft-colossal
	Tooltip:
		Name: actor_scrin_planetary_assault_carrier.name
	Selectable:
		Bounds: 2048, 2048, 0, -704
	RenderSprites:
		PlayerPalette: scrin_planetary_assault_carrier_player

scrin_invader_fighter:
	Inherits: ^ScrinAircraftVisual
	Tooltip:
		Name: actor_scrin_invader_fighter.name
	Selectable:
		Bounds: 1024, 1024, 0, -448
	RenderSprites:
		PlayerPalette: scrin_invader_fighter_player

scrin_mothership:
	Inherits: ^ScrinAircraftVisual
	WithIdleOverlay@shield1:
		Sequence: colossal-mobile-standard
		StartSequence: colossal-mobile-standard
		Offset: 0,0,853
	WithIdleOverlay@shield_damage:
		Sequence: colossal-mobile-standard
		Offset: 0,0,853
	Tooltip:
		Name: actor_scrin_mothership.name
	Selectable:
		Bounds: 3072, 3072, 0, -1280
	RenderSprites:
		PlayerPalette: scrin_mothership_player
