# Map/editor-ready visual foundation. Production, weapons, abilities, and final
# gameplay values are intentionally deferred with the rest of the Scrin roster.

^ScrinVehicleVisual:
	Inherits: ^Vehicle
	Health:
		HP: 100000
	Armor:
		Type: Heavy
	Mobile:
		Locomotor: wheeled
		Speed: 50
		TurnSpeed: 8
	Selectable:
		Bounds: 1024, 1024
	-Voiced:

^ScrinHoverVisual:
	Inherits: ^ScrinVehicleVisual
	Mobile:
		Locomotor: hover

scrin_explorer:
	Inherits: ^ScrinHoverVisual
	Tooltip:
		Name: actor_scrin_explorer.name
	RenderSprites:
		PlayerPalette: scrin_explorer_player

scrin_harvester:
	Inherits: ^ScrinHoverVisual
	Tooltip:
		Name: actor_scrin_harvester.name
	RenderSprites:
		PlayerPalette: scrin_harvester_player

