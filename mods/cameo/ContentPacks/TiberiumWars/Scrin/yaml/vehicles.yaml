# Map/editor-ready visual foundation. Production, weapons, abilities, and final
# gameplay values are intentionally deferred with the rest of the Scrin roster.

^ScrinVehicleVisual:
	Inherits: ^Vehicle
	Inherits@AUTOTARGET: ^AutoTargetAllAssaultMove
	Health:
		HP: 100000
	Armor:
		Type: Heavy
	Mobile:
		Locomotor: wheeled
		Speed: 50
		TurnSpeed: 8
	Selectable:
		Bounds: 1024, 1024
	-Voiced:

^ScrinHoverVisual:
	Inherits: ^ScrinVehicleVisual
	Mobile:
		Locomotor: hover

scrin_explorer:
	Inherits: ^ScrinHoverVisual
	Tooltip:
		Name: actor_scrin_explorer.name
	Buildable:
		Queue: ScrinVehicle, ScrinAdvancedVehicle
		BuildPaletteOrder: 10
		Prerequisites: scrin_reactor, scrin_extractor
		Icon: idle
		IconPalette: scrin_explorer_player
		IconPaletteIsPlayerPalette: true
		Description: Deploys into a Scrin Outpost.
	Valued:
		Cost: 600
	Health:
		HP: 50000
	Transforms:
		IntoActor: scrin_outpost
	RenderSprites:
		PlayerPalette: scrin_explorer_player

scrin_harvester:
	Inherits: ^ScrinHoverVisual
	Inherits@harvester: ^Harvester
	Tooltip:
		Name: actor_scrin_harvester.name
	Buildable:
		Queue: ScrinVehicle, ScrinAdvancedVehicle
		BuildPaletteOrder: 20
		Prerequisites: scrin_extractor
		Icon: idle
		IconPalette: scrin_harvester_player
		IconPaletteIsPlayerPalette: true
		Description: Collects Tiberium for processing at an Extractor.
	Valued:
		Cost: 1400
	Health:
		HP: 140000
	Harvester:
		HarvestFacings: 32
	StoresResources:
		Capacity: 50
	Mobile:
		Speed: 60
		TurnSpeed: 12
	RenderSprites:
		PlayerPalette: scrin_harvester_player

