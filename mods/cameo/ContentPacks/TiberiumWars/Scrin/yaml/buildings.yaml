# Structures-only foundation. These actors are available to maps and the editor,
# but stay outside production until the Drone Ship and the rest of the faction exist.

scrin_drone_platform:
	Inherits: ^Building
	Inherits@shape: ^3x2Shape
	Tooltip:
		Name: actor_scrin_drone_platform.name
	Building:
		Dimensions: 3,2
		Footprint: xxx xxx
		LocalCenterOffset: 0,0,0
	RenderSprites:
		PlayerPalette: player_rgba

