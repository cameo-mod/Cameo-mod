# Structures-and-defenses foundation. These actors are available to maps and the
# editor, but stay outside production until the Drone Ship, weapons, and the rest
# of the faction exist.

^Scrin3x1Shape:
	HitShape:
		UseTargetableCellsOffsets: true
		Type: Rectangle
			TopLeft: -1536, -512
			BottomRight: 1536, 512
	Selectable:
		Bounds: 3072, 1024

scrin_drone_platform:
	Inherits: ^Building
	Inherits@shape: ^3x3Shape
	Tooltip:
		Name: actor_scrin_drone_platform.name
	Building:
		Dimensions: 3,3
		Footprint: _x_ xxx _x_
		LocalCenterOffset: 0,0,0
		TerrainTypes: Clear,ClearTemperat,ClearWinter,ClearJungle,ClearSnow,ClearDesert,Road,Concrete,ClearDune
	RenderSprites:
		PlayerPalette: player_rgba
	WithMakeAnimation:
	Transforms:
		IntoActor: scrin_drone_ship
		Offset: 1,1
		Facing: 480
		NoTransformNotification: BuildingCannotPlaceAudio

scrin_reactor:
	Inherits: ^Building
	Inherits@shape: ^2x2Shape
	Tooltip:
		Name: actor_scrin_reactor.name
	Building:
		Dimensions: 2,2
		Footprint: xx xx
		LocalCenterOffset: 0,0,0
	RenderSprites:
		PlayerPalette: player_rgba

# Map/editor-ready upgraded Reactor visual. The Nerve Center research and
# production-menu replacement are deferred with the playable Scrin economy.
scrin_fusion_reactor:
	Inherits: scrin_reactor
	Tooltip:
		Name: actor_scrin_fusion_reactor.name
	RenderSprites:
		Image: scrin_fusion_reactor
		PlayerPalette: player_rgba

