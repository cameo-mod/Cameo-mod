	Building:
		Dimensions: 4,3
		Footprint: =xx= xxxx =xx=
		LocalCenterOffset: 0,-512,0
	RenderSprites:
		PlayerPalette: scrin_extractor_player
	Refinery:
		TickRate: 15
		PlayerExperienceModifier: 20
	StoresPlayerResources:
